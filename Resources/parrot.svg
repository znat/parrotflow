<svg xmlns="http://www.w3.org/2000/svg" viewBox="26.5 15.5 46 68">
  <!-- Parrot outline by Md Moniruzzaman, from the Noun Project (CC BY). The
       shape is his, untouched; only the fills below are ours. -->
  <!-- The plumage wheel of Sources/ParrotFlow/ParrotStyle.swift, run head to
       tail: scarlet, amber, leaf, sky. Held flat between the hues rather than
       blended evenly, so the wing carries a band the way a macaw's does and the
       bird does not read as a rainbow. -->
  <defs>
    <linearGradient id="plumage" gradientUnits="userSpaceOnUse" x1="33" y1="18" x2="68" y2="82">
      <stop offset="0.00" stop-color="#FF2926"/>
      <stop offset="0.40" stop-color="#FF2926"/>
      <stop offset="0.52" stop-color="#FFBF00"/>
      <stop offset="0.62" stop-color="#FFBF00"/>
      <stop offset="0.70" stop-color="#00D96B"/>
      <stop offset="0.80" stop-color="#00D96B"/>
      <stop offset="0.93" stop-color="#0099FF"/>
    </linearGradient>
  </defs>
