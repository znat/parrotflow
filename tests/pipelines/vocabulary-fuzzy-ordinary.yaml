# A rendering made only of ordinary words is not a rule, but the near-miss pass
# still reads it. With the sound pass off, `Praise's` reaches `heard: Praises`
# only through its apostrophe.
#
languages: [en]
vocabulary:
  terms:
    Praisy:
      heard: [Praises]
pipeline:
  - stage: vocabulary
    by_sound: false
