# Two name steps in one pipeline, which a pipeline is allowed to have.
#
# Both publish under the same namespace and the second wins, for `before`
# exactly as for `changes`. The pair stays consistent — the second step reads
# the last step's changes beside the last step's input — and the first step's
# changes are not readable at all, which was already true before `before`
# existed.
#
# The stage gathers the places and publishes `vocabulary.slots`. Every case
# here scores the places it found, not what was decided at them.
languages: [en]
vocabulary:
  terms:
    Vercel:
      heard: [Versailles]
pipeline:
  - vocabulary
  - vocabulary
