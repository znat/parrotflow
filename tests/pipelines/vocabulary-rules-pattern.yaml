# The same stage, with one literal rendering and one pattern beside it.
#
# A pattern names no spelling to offer back, so the stage skips its pair — but
# the pattern still wrote a `Vercel`. The literal rule cannot account for that
# occurrence, grouped or not, and the stage has to offer nothing rather than
# hand the literal's spelling to a place some other rule wrote. See the cases.
#
# The stage gathers the places and publishes `vocabulary.slots`. Every case
# here scores the places it found, not what was decided at them.
#
languages: [en]
vocabulary:
  terms:
    Vercel:
      heard: [Versal, '/Versa\w+/']
pipeline:
  - vocabulary
