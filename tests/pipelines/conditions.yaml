# The conditions, on steps cheap enough to score deterministically. `numbers`
# stands in for the expensive stage a condition really exists for: what is being
# tested is that a condition gates a step, not what that step does.
languages: [en, fr]
transforms:
  - name: numbers_fr
    description: spoken numbers as digits
    command: fr.py
    returns: json

vocabulary:
  terms:
    Supabase:
      heard: [super base]
pipeline:
  - vocabulary
  # Never rewrite inside a code fence.
  - transform: numbers_fr
    unless: /```/
