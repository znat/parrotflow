# The table tests/replacement-cases.txt has always assumed, in the two places
# that hold it now.
#
# It used to be one `replacements:` table doing both jobs. A name the recogniser
# mangles goes in vocabulary.yaml, where the stage weighs it against the
# sentence; a mechanical rule — a deletion, a template — goes in a transform,
# which needs no sentence read at all. Nothing was left in between, which is
# why the table went.
#
# `Mik` and `Matthieu` are the two that make the near-miss guard visible: "Mick"
# must be corrected because it is a name, and "Matthew" must not, because the
# spell checker knows it.
#
# The exact and near-miss passes are what the cases score.
languages: [en, fr]
vocabulary:
  terms:
    Vercel:
      heard: [Versailles, Versal]
    Supabase:
      heard: [Super Base, super bays, superbase, superbees]
    Tasmeen:
      heard: [Tasmid, Tasmin, Tasmine]
    Matthieu:
      heard: [Mathieu]
    Mik:
      heard: [Meek, Mick]
transforms:
  - name: fillers
    description: delete hesitation sounds
    replace:
      "": ['/[,]?\s*\b(?:mm[-‑]?hmm|uh[-‑]?huh|mhm|u+m+|u+h+|erm+|hmm+|mm+)\b[,]?/']
  # A template, not a word: the source is a pattern, so `$1` and `$2` are what
  # it captured. A transform is where this belongs — there is no name here to
  # weigh against the sentence.
  - name: dotted
    description: spoken dot as a dotted path
    replace:
      $1.$2: ['/\b(\w+) dot (\w+)\b/']
pipeline:
  - vocabulary
  - transform: fillers
  - transform: dotted
