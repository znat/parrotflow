# Renderings a correction learnt, read with no parser.
#
# `quand on` is two ordinary French words, so it is not a rule: with the clause
# decider down it is left as heard. `Conto` is in no word list, so it is still
# a rule and still writes, and so is `404`: it has no word in it.
#
languages: [fr]
vocabulary:
  terms:
    Qonto:
      heard: [quand on, Conto]
    Erreur404:
      heard: ['404']
pipeline:
  - vocabulary
