# `review: false` on the vocabulary stage, which is a retired key.
#
# It named the model that kept or reverted each substitution. There is no model
# in this stage now, so the key is read, reported by `--check-config`, and does
# nothing. The fixture is kept because that is the thing worth asserting: a
# config still carrying the key runs exactly like one without it.
#
# The exact matches ship — they are what the rules wrote. The near miss does
# not: `Versel` opens a place, nothing settles it, and a place nothing settles
# keeps the word that was heard.
#
# The same two terms as tests/pipelines/vocabulary-exact.yaml, so the two
# fixtures can be read against each other: that one closes the near-miss pass
# with `near_misses: false`, this one leaves it open and shows what an
# unsettled place ships.
languages: [en]
vocabulary:
  terms:
    Vercel:
      heard: [Versal]
    Supabase:
      heard: [super base]
pipeline:
  - stage: vocabulary
    review: false
