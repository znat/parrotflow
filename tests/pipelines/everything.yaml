# The shape a new install gets: every automatic stage plus the numbers
# transform, and no conditions.
languages: [en, fr]
transforms:
  - name: numbers
    description: spoken numbers as digits
    command: numbers.py
    returns: json

vocabulary:
  terms:
    Supabase:
      heard: [super base, superbees]
    Tasmeen:
      heard: [Tasmin]
    "":
      heard: ['/[,]?\s*\b(?:u+m+|u+h+|erm+)\b[,]?/']
pipeline:
  - vocabulary
  - transform: numbers
