# A cap on a menu that no longer exists.
#
# `max_readings` trimmed the lettered list of whole sentences. A place is one
# span with one alternative, so the number reads nothing.
#
# Refused for the same reason as the prompt file beside it: a key that loads
# and does nothing is worse than one that fails, because nothing ever tells the
# person who typed it.
languages: [en]
pipeline:
  - vocabulary
  - stage: vocabulary
    max_readings: 16
