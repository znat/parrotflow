# More readings a place than a place can hold.
#
# A place is one span with one alternative: what the decoder wrote, and the
# term. `max_per_slot: 3` builds a third reading that nothing ever reads.
#
# Refused, not clamped. A number quietly rounded down is a configuration that
# says one thing and does another. Found by review on #102.
languages: [en]
pipeline:
  - vocabulary
  - stage: vocabulary
    max_per_slot: 3
