# A `command:` naming a script by a relative path — the shipped example, not a
# copy of it, reached through a symlink so this scores the file people edit.
#
# The point is the resolution rule: a transform named X looks in
# `transforms/X/` beside the file that declared it, which is this fixture here
# and `config.yaml` in a real install. There is nowhere else to look, so a
# script that is not in the folder is a fault `--check-config` reports rather
# than something the shell is left to fail on once per transcript.
languages: [en]
transforms:
  - name: code_identifiers
    description: spoken names as identifiers
    command: code_identifiers.py
pipeline:
  - transform: code_identifiers
