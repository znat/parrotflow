# The name stage reading what a `replacements` rule did, with no audio at all.
#
# What is scored is attribution: which occurrence of a term a rule wrote.
# `vocabulary.slots` is the number.
#
# The stage gathers the places and publishes `vocabulary.slots`. Every case
# here scores the places it found, not what was decided at them.
#
languages: [en]
vocabulary:
  terms:
    Vercel:
      heard: [Versailles]
pipeline:
  - vocabulary
