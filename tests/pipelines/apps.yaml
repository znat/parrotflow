# App conditions, on a step cheap enough to score deterministically. What is
# tested is that `app:` decides, not what the step does — `numbers` stands in
# for whatever you would really scope to a terminal.
#
# Both directions from one key: inclusion is a plain pattern, exclusion is a
# negative lookahead. There is no `not_app:`, so the second one is the whole
# case for that decision — if a lookahead cannot express exclusion here, the
# key was needed after all.
languages: [en, fr]
transforms:
  - name: numbers_fr
    description: spoken numbers as digits
    command: fr.py
    returns: json

vocabulary:
  terms:
    Supabase:
      heard: [super base]
pipeline:
  - vocabulary
  - transform: numbers_fr
    app: /term|ghostty|iterm/
