# The sentence_repair transform with no parse and no readings, so no model is
# asked: what is left is the decoder's doubled full stop, collapsed to one.
# The rules that read the parse and the readings are scored by
# built-in/transforms/sentence_repair/score.py.
languages: [en]
transforms:
  - name: sentence_repair
    description: repair sentence boundaries a pause cut
    command: sentence_repair.py
    returns: json
pipeline:
  - transform: sentence_repair
