# The same stage, with two renderings of one term in one sentence.
#
# Separate from `vocabulary-rules.yaml` because the table is what differs: two
# rules write `Vercel` here, and each is counted on its own. See the cases.
#
# The stage gathers the places and publishes `vocabulary.slots`. Every case
# here scores the places it found, not what was decided at them.
#
languages: [en]
vocabulary:
  terms:
    Vercel:
      heard: [Versailles, Versal]
pipeline:
  - vocabulary
