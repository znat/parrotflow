# VoiceQueue: each case runs its steps on an empty queue and reads the state
# after. An entry shows as session:sentence it starts from.
queue:
  - name: a pause mid-answer puts it in front, at the sentence it stopped on
    steps:
      - {op: add, session: a, text: "One. Two. Three."}
      - {op: add, session: b, text: "Four."}
      - {op: next}
      - {op: hold, hold: user, at: 1}
    want: "waiting a:Two., b:Four. | held user"
  - name: new answers go last, while one plays and while paused
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: add, session: b, text: "Two."}
      - {op: hold, hold: user, at: 0}
      - {op: add, session: c, text: "Three."}
    want: "waiting a:One., b:Two., c:Three. | held user"
  - name: the end of a dictation resumes the answer it held
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: next}
      - {op: hold, hold: dictation, at: 1}
      - {op: next}
      - {op: release, hold: dictation}
      - {op: next}
    want: "playing a:Two. 1 of 1"
  - name: the end of a dictation while paused stays paused
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: next}
      - {op: hold, hold: user, at: 1}
      - {op: hold, hold: dictation}
      - {op: release, hold: dictation}
      - {op: next}
    want: "waiting a:Two. | held user"
  - name: pausing twice is one pause
    steps:
      - {op: add, session: a, text: "One."}
      - {op: hold, hold: user}
      - {op: hold, hold: user}
      - {op: release, hold: user}
      - {op: next}
    want: "playing a:One. 1 of 1"
  - name: a hold before any sound keeps the sentence it resumed from
    steps:
      - {op: add, session: a, text: "One. Two. Three."}
      - {op: next}
      - {op: hold, hold: user, at: 1}
      - {op: release, hold: user}
      - {op: next}
      - {op: hold, hold: dictation}
    want: "waiting a:Two. | held dictation"
  - name: a sentence past the end resumes at the last one
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: next}
      - {op: hold, hold: user, at: 5}
    want: "waiting a:Two. | held user"
  - name: a second hold counts from the sentence the answer resumed at
    steps:
      - {op: add, session: a, text: "One. Two. Three. Four."}
      - {op: next}
      - {op: hold, hold: dictation, at: 1}
      - {op: release, hold: dictation}
      - {op: next}
      - {op: hold, hold: dictation, at: 1}
    want: "waiting a:Three. | held dictation"
  - name: an answer that comes during a dictation plays when it ends
    steps:
      - {op: hold, hold: dictation}
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: release, hold: dictation}
      - {op: next}
    want: "playing a:One. 1 of 1"
  - name: a progress line is said when the voice is free
    steps:
      - {op: progress}
    want: "progress said"
  - name: a progress line during a dictation is dropped, not kept for later
    steps:
      - {op: hold, hold: dictation}
      - {op: progress}
      - {op: release, hold: dictation}
    want: "progress dropped"
  - name: a progress line while an answer plays is dropped
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: progress}
    want: "playing a:One. 1 of 1 | progress dropped"
  - name: a progress line is said again once the held list has played
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: hold, hold: user, at: 0}
      - {op: progress}
      - {op: release, hold: user}
      - {op: next}
      - {op: finish}
      - {op: progress}
    want: "heard a:One. | progress dropped | progress said"
  - name: a new prompt drops only its own session's answers
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: add, session: a, text: "Three."}
      - {op: add, session: c, text: "Four."}
      - {op: next}
      - {op: hold, hold: user, at: 0}
      - {op: drop, session: a}
    want: "waiting b:Two., c:Four. | held user"
  - name: a new prompt stops its session's answer playing, the next one starts
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: drop, session: a}
      - {op: next}
    want: "playing b:Two. 1 of 1"
  - name: another session's new prompt leaves the playing answer alone
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: drop, session: b}
    want: "playing a:One. 1 of 1"
  - name: resume plays the list oldest first, across sessions
    steps:
      - {op: add, session: a, text: "A one. A two."}
      - {op: add, session: b, text: "B one."}
      - {op: next}
      - {op: hold, hold: user, at: 1}
      - {op: add, session: c, text: "C one."}
      - {op: release, hold: user}
      - {op: next}
      - {op: finish}
      - {op: next}
    want: "playing b:B one. 2 of 3 | waiting c:C one. | heard a:A one."
  - name: an answer added while the list plays makes the run longer
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: finish}
      - {op: next}
      - {op: add, session: c, text: "Three."}
      - {op: next}
    want: "playing b:Two. 2 of 3 | waiting c:Three. | heard a:One."
  - name: after a pause, the run counts from one again
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: finish}
      - {op: next}
      - {op: hold, hold: user, at: 0}
      - {op: release, hold: user}
      - {op: next}
    want: "playing b:Two. 1 of 1 | heard a:One."
  - name: a new answer after the list ran out counts from one
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: finish}
      - {op: add, session: b, text: "Two."}
      - {op: next}
    want: "playing b:Two. 1 of 1 | heard a:One."
  - name: a late finish for an answer that was held is ignored
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: next}
      - {op: hold, hold: dictation, at: 1}
      - {op: finish, id: 1}
    want: "waiting a:Two. | held dictation"
  - name: a late finish for a dropped answer leaves the next one playing
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: drop, session: a}
      - {op: next}
      - {op: finish, id: 1}
    want: "playing b:Two. 1 of 1"
  - name: an answer with nothing to say is not queued
    steps:
      - {op: add, session: a, text: "  "}
      - {op: next}
    want: "empty"
  - name: the last 10 answers heard are kept, newest first
    steps: [
      {op: add, session: a, text: One.}, {op: add, session: a, text: Two.}, {op: add, session: a, text: Three.},
      {op: add, session: a, text: Four.}, {op: add, session: a, text: Five.}, {op: add, session: a, text: Six.},
      {op: add, session: a, text: Seven.}, {op: add, session: a, text: Eight.}, {op: add, session: a, text: Nine.},
      {op: add, session: a, text: Ten.}, {op: add, session: b, text: Eleven.},
      {op: next}, {op: finish}, {op: next}, {op: finish}, {op: next}, {op: finish}, {op: next}, {op: finish},
      {op: next}, {op: finish}, {op: next}, {op: finish}, {op: next}, {op: finish}, {op: next}, {op: finish},
      {op: next}, {op: finish}, {op: next}, {op: finish}, {op: next}, {op: finish}]
    want: "heard b:Eleven., a:Ten., a:Nine., a:Eight., a:Seven., a:Six., a:Five., a:Four., a:Three., a:Two."

  - name: a call holds the playing answer at its sentence, like a pause
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: next}
      - {op: hold, hold: call, at: 1}
      - {op: add, session: b, text: "Three."}
      - {op: next}
    want: "waiting a:Two., b:Three. | held call"
  - name: a call over with your pause still on keeps it held
    steps:
      - {op: add, session: a, text: "One."}
      - {op: hold, hold: user}
      - {op: hold, hold: call}
      - {op: release, hold: call}
      - {op: next}
    want: "waiting a:One. | held user"

  - name: play again says a heard answer now, and the one playing goes back in front at its sentence
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two. Three."}
      - {op: add, session: c, text: "Four."}
      - {op: next}
      - {op: finish}
      - {op: next}
      - {op: ask, id: 1, at: 1}
      - {op: next}
    want: "playing a:One. asked 1 of 3 | waiting b:Three., c:Four. | heard a:One."
  - name: after the replay the held answer goes on, and the replayed one is not heard twice
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two. Three."}
      - {op: add, session: c, text: "Four."}
      - {op: next}
      - {op: finish}
      - {op: next}
      - {op: ask, id: 1, at: 1}
      - {op: next}
      - {op: finish}
      - {op: next}
    want: "playing b:Three. 2 of 3 | waiting c:Four. | heard a:One."
  - name: a replay plays through a pause
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: finish}
      - {op: hold, hold: user}
      - {op: ask, id: 1}
      - {op: next}
    want: "playing a:One. asked 1 of 2 | waiting b:Two. | held user | heard a:One."
  - name: after a replay the pause is still on
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: finish}
      - {op: hold, hold: user}
      - {op: ask, id: 1}
      - {op: next}
      - {op: finish}
      - {op: next}
    want: "waiting b:Two. | held user | heard a:One."
  - name: a replay plays through a call
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: finish}
      - {op: hold, hold: call}
      - {op: ask, id: 1}
      - {op: next}
    want: "playing a:One. asked 1 of 1 | held call | heard a:One."
  - name: a dictation holds a replay at its sentence, and it goes on after, even paused
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: next}
      - {op: finish}
      - {op: hold, hold: user}
      - {op: ask, id: 1}
      - {op: next}
      - {op: hold, hold: dictation, at: 1}
      - {op: next}
      - {op: release, hold: dictation}
      - {op: next}
    want: "playing a:Two. asked 1 of 1 | held user | heard a:One."
  - name: a pause during a replay takes the ask back, and it waits like the others
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: next}
      - {op: finish}
      - {op: ask, id: 1}
      - {op: next}
      - {op: hold, hold: user, at: 1}
      - {op: next}
    want: "waiting a:Two. | held user | heard a:One."
  - name: a pause while a dictation holds a replay takes the ask back too
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: finish}
      - {op: ask, id: 1}
      - {op: next}
      - {op: hold, hold: dictation, at: 0}
      - {op: hold, hold: user}
      - {op: release, hold: dictation}
      - {op: next}
    want: "waiting a:One. | held user | heard a:One."
  - name: asked again while held, it is still there once
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: next}
      - {op: finish}
      - {op: ask, id: 1}
      - {op: next}
      - {op: hold, hold: dictation, at: 1}
      - {op: ask, id: 1}
    want: "waiting a:Two. asked | held dictation | heard a:One."
  - name: play now takes a waiting answer out of its place and says it first
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: add, session: c, text: "Three."}
      - {op: next}
      - {op: ask, id: 3, at: 0}
      - {op: next}
    want: "playing c:Three. asked 1 of 3 | waiting a:One., b:Two."
  - name: once said, a waiting answer played now is heard like any other
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: add, session: c, text: "Three."}
      - {op: next}
      - {op: ask, id: 3, at: 0}
      - {op: next}
      - {op: finish}
      - {op: next}
    want: "playing a:One. 2 of 3 | waiting b:Two. | heard c:Three."
  - name: play now while paused says that one only
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: hold, hold: user}
      - {op: ask, id: 2}
      - {op: next}
      - {op: finish}
      - {op: next}
    want: "waiting a:One. | held user | heard b:Two."
  - name: an answer no longer listed changes nothing
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: ask, id: 9, at: 0}
    want: "playing a:One. 1 of 1"
  - name: an answer made whole keeps its audio
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: next}
      - {op: finish, samples: 10}
    want: "heard a:One. audio"
  - name: past the cap, the oldest lose their audio
    audio_limit: 50
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: add, session: b, text: "Three."}
      - {op: add, session: c, text: "Four."}
      - {op: next}
      - {op: finish, samples: 10}
      - {op: next}
      - {op: finish, samples: 20}
      - {op: next}
      - {op: finish, samples: 20}
    want: "heard c:Four. audio, b:Three. audio, a:One."
  - name: one answer bigger than the cap keeps none, and the older ones keep theirs
    audio_limit: 50
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: finish, samples: 30}
      - {op: next}
      - {op: finish, samples: 60}
    want: "heard b:Two., a:One. audio"
  - name: a replay made again keeps its audio for the next one
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: finish}
      - {op: ask, id: 1}
      - {op: next}
      - {op: finish, samples: 5}
    want: "heard a:One. audio"
  - name: a replay leaves the heard order as it was
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: finish, samples: 5}
      - {op: next}
      - {op: finish, samples: 5}
      - {op: ask, id: 1}
      - {op: next}
      - {op: finish}
    want: "heard b:Two. audio, a:One. audio"

# What the pill says after the steps. The playing session's key stands for its name.
pill:
  - name: nothing plays, nothing shows
    steps:
      - {op: add, session: a, text: "One."}
    want: "nothing"
  - name: one answer alone has no status
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
    want: "speaking a"
  - name: answers behind it are counted as waiting
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: add, session: c, text: "Three."}
      - {op: next}
    want: "speaking a · 2 waiting"
  - name: out of sight, it offers to go to the session
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
    out_of_sight: true
    want: "speaking a · go to session"
  - name: after a resume, the list counts its place
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: add, session: b, text: "Three."}
      - {op: add, session: c, text: "Four."}
      - {op: next}
      - {op: hold, hold: user, at: 1}
      - {op: release, hold: user}
      - {op: next}
    want: "speaking a · 1 of 3"
  - name: the place moves on as the list plays
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: add, session: c, text: "Three."}
      - {op: next}
      - {op: hold, hold: user, at: 0}
      - {op: release, hold: user}
      - {op: next}
      - {op: finish}
      - {op: next}
    out_of_sight: true
    want: "speaking b · 2 of 3 · go to session"
  - name: after a dictation, the list counts its place too
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: hold, hold: dictation, at: 0}
      - {op: add, session: b, text: "Two."}
      - {op: release, hold: dictation}
      - {op: next}
    want: "speaking a · 1 of 2"
  - name: a held answer that plays alone after a dictation has no status
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: next}
      - {op: hold, hold: dictation, at: 1}
      - {op: release, hold: dictation}
      - {op: next}
    want: "speaking a"
  - name: once the resumed list ran out, a new answer counts as waiting again
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: hold, hold: user, at: 0}
      - {op: release, hold: user}
      - {op: next}
      - {op: finish}
      - {op: add, session: b, text: "Two."}
      - {op: add, session: c, text: "Three."}
      - {op: next}
    want: "speaking b · 1 waiting"
  - name: a dictation alone shows nothing
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: hold, hold: dictation, at: 0}
    want: "nothing"
  - name: pause shows how many wait, the held answer among them
    steps:
      - {op: add, session: a, text: "One. Two."}
      - {op: add, session: b, text: "Three."}
      - {op: next}
      - {op: hold, hold: user, at: 1}
      - {op: add, session: c, text: "Four."}
    want: "paused · 3 waiting"
  - name: pause with nothing waiting
    steps:
      - {op: hold, hold: user}
    want: "paused · 0 waiting"
  - name: pause wins over a dictation
    steps:
      - {op: add, session: a, text: "One."}
      - {op: hold, hold: user}
      - {op: hold, hold: dictation}
      - {op: release, hold: dictation}
    want: "paused · 1 waiting"
  - name: a new prompt while paused takes its answers off the count
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: hold, hold: user}
      - {op: drop, session: a}
    want: "paused · 1 waiting"
  - name: held by a call, the pill names the app
    steps:
      - {op: add, session: a, text: "One."}
      - {op: next}
      - {op: hold, hold: call, at: 0}
      - {op: add, session: b, text: "Two."}
    call: Zoom
    want: "paused · Zoom is using the mic"
  - name: held by a call with nothing waiting, no pill
    steps:
      - {op: hold, hold: call}
    call: Zoom
    want: "nothing"
  - name: your own pause during a call says your pause
    steps:
      - {op: add, session: a, text: "One."}
      - {op: hold, hold: call}
      - {op: hold, hold: user}
    call: Zoom
    want: "paused · 1 waiting"
  - name: after the call, it asks
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: add, session: c, text: "Three."}
      - {op: hold, hold: user}
    call: over
    want: "call over · 3 waiting"
  - name: not now takes the pill away, still paused
    steps:
      - {op: add, session: a, text: "One."}
      - {op: hold, hold: user}
    call: dismissed
    want: "nothing"
  - name: after the call, a new prompt dropped the only line, no pill
    steps:
      - {op: add, session: a, text: "One."}
      - {op: hold, hold: user}
      - {op: drop, session: a}
    call: over
    want: "nothing"
  - name: a replay under a pause shows as speaking, with no count
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: finish}
      - {op: hold, hold: user}
      - {op: ask, id: 1}
      - {op: next}
    want: "speaking a"
  - name: once the replay is over, the pill is paused again
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: finish}
      - {op: hold, hold: user}
      - {op: ask, id: 1}
      - {op: next}
      - {op: finish}
    want: "paused · 1 waiting"

# The Answers submenu: its title, then each row as name · when · what was said [its actions].
# Times are counted back from the steps' now; `known` are the sessions with a window.
answers_menu:
  - name: nothing heard, nothing waiting
    steps: []
    want: "Answers"
  - name: waiting on top in play order, then heard, newest first
    steps:
      - {op: add, session: a, text: "One.", ago: 600}
      - {op: next}
      - {op: finish}
      - {op: add, session: b, text: "Two.", ago: 300}
      - {op: next}
      - {op: finish}
      - {op: hold, hold: user}
      - {op: add, session: c, text: "Three.", ago: 120}
      - {op: add, session: d, text: "Four.", ago: 30}
    want: "Answers · 2 waiting > c · 2 min ago · Three. [Play now] | d · just now · Four. [Play now] | --- | b · 5 min ago · Two. [Play again] | a · 10 min ago · One. [Play again]"
  - name: go to session only where a window is known
    known: [a]
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
      - {op: finish}
      - {op: next}
      - {op: finish}
    want: "Answers > b · just now · Two. [Play again] | a · just now · One. [Play again, Go to session]"
  - name: older answers say hours, yesterday, days
    steps:
      - {op: add, session: a, text: "One.", ago: 259200}
      - {op: add, session: b, text: "Two.", ago: 90000}
      - {op: add, session: c, text: "Three.", ago: 7200}
      - {op: next}
      - {op: finish}
      - {op: next}
      - {op: finish}
      - {op: next}
      - {op: finish}
    want: "Answers > c · 2 h ago · Three. [Play again] | b · yesterday · Two. [Play again] | a · 3 days ago · One. [Play again]"
  - name: a long answer is cut at a word, on one line
    steps:
      - {op: add, session: a, text: "The tests are green on both branches,\nand the two English cuts still fail on question marks."}
      - {op: next}
      - {op: finish}
    want: "Answers > a · just now · The tests are green on both branches, and the two English… [Play again]"
  - name: the answer playing now is in neither list
    steps:
      - {op: add, session: a, text: "One."}
      - {op: add, session: b, text: "Two."}
      - {op: next}
    want: "Answers · 1 waiting > b · just now · Two. [Play now]"

# The Voice menu's pauses. Times are local to America/Toronto; labels in en_GB unless `locale:` says.
pause_until:
  - name: until tomorrow, after 8:00, is tomorrow 8:00
    now: "2026-11-10 15:42"
    choose: tomorrow
    want: "2026-11-11 08:00"
  - name: until tomorrow, before 8:00, is today 8:00
    now: "2026-11-10 06:30"
    choose: tomorrow
    want: "2026-11-10 08:00"
  - name: until tomorrow at 8:00 sharp is the next day
    now: "2026-11-10 08:00"
    choose: tomorrow
    want: "2026-11-11 08:00"
  - name: until tomorrow, a minute before 8:00, is that 8:00
    now: "2026-11-10 07:59"
    choose: tomorrow
    want: "2026-11-10 08:00"
  - name: until tomorrow over a clock change is 8:00 on the clock
    now: "2026-03-07 22:00"
    choose: tomorrow
    want: "2026-03-08 08:00"
  - name: until tomorrow on the last day of the month
    now: "2026-12-31 23:30"
    choose: tomorrow
    want: "2027-01-01 08:00"
  - name: for 1 hour
    now: "2026-11-10 15:42"
    choose: hour
    want: "2026-11-10 16:42"
  - name: until I resume has no deadline
    now: "2026-11-10 15:42"
    choose: until_resumed
    want: "until resumed"
pause_restored:
  - name: a launch before the deadline starts paused
    now: "2026-11-10 15:00"
    saved: "2026-11-10 16:42"
    want: "paused until 16:42"
  - name: a launch the next morning, before 8:00, is still paused
    now: "2026-11-11 07:10"
    saved: "2026-11-11 08:00"
    want: "paused until 08:00"
  - name: a launch the evening before says tomorrow
    now: "2026-11-10 23:00"
    saved: "2026-11-11 08:00"
    want: "paused until tomorrow 08:00"
  - name: a launch past the deadline starts playing
    now: "2026-11-10 17:00"
    saved: "2026-11-10 16:42"
    want: "not paused"
  - name: a launch at the deadline starts playing
    now: "2026-11-10 16:42"
    saved: "2026-11-10 16:42"
    want: "not paused"
  - name: until I resume survives a launch
    now: "2026-11-20 09:00"
    saved: "until resumed"
    want: "paused until I resume"
  - name: nothing saved, not paused
    now: "2026-11-10 15:00"
    want: "not paused"
pause_menu:
  - name: not paused, the three pauses, the shortcut on the first
    now: "2026-11-10 15:42"
    waiting: 2
    want: "Pause until I resume [shortcut] | Pause for 1 hour | Pause until tomorrow"
  - name: paused for an hour says until when and how many wait
    now: "2026-11-10 15:42"
    paused: "2026-11-10 16:42"
    waiting: 3
    want: "(Paused until 16:42 · 3 waiting) | Resume [shortcut]"
  - name: paused until tomorrow says tomorrow
    now: "2026-11-10 15:42"
    paused: "2026-11-11 08:00"
    waiting: 1
    want: "(Paused until tomorrow 08:00 · 1 waiting) | Resume [shortcut]"
  - name: paused until I resume, with nothing waiting
    now: "2026-11-10 15:42"
    paused: "until resumed"
    want: "(Paused) | Resume [shortcut]"
  - name: the time follows the locale
    now: "2026-11-10 15:42"
    paused: "2026-11-10 16:42"
    locale: en_US
    want: "(Paused until 4:42\u202FPM) | Resume [shortcut]"  # a narrow no-break space, as macOS writes it
  - name: held by a call, it names the app and offers Resume
    now: "2026-11-10 15:42"
    call: Zoom
    waiting: 3
    want: "(Paused · Zoom is using the mic · 3 waiting) | Resume [shortcut]"
  - name: a pause of your own during a call says your pause
    now: "2026-11-10 15:42"
    paused: "2026-11-10 16:42"
    call: Zoom
    want: "(Paused until 16:42) | Resume [shortcut]"

# CallState: who has the mic open at each look, and the events. Our own pid is 1.
calls:
  - name: under two seconds is not a call
    steps:
      - {at: 0, mic: [{name: Zoom}]}
      - {at: 1.9, mic: [{name: Zoom}]}
      - {at: 2.5, mic: []}
    want: "nothing"
  - name: two seconds with the mic open is a call
    steps:
      - {at: 0, mic: [{name: Zoom}]}
      - {at: 2, mic: [{name: Zoom}]}
    want: "2s call started (Zoom)"
  - name: the mic closed for five seconds ends it
    steps:
      - {at: 0, mic: [{name: Zoom}]}
      - {at: 2, mic: [{name: Zoom}]}
      - {at: 10, mic: []}
      - {at: 14.9, mic: []}
      - {at: 15, mic: []}
    want: "2s call started (Zoom) | 15s call over (Zoom)"
  - name: closed for under five seconds, the call goes on
    steps:
      - {at: 0, mic: [{name: Zoom}]}
      - {at: 2, mic: [{name: Zoom}]}
      - {at: 10, mic: []}
      - {at: 14, mic: [{name: Zoom}]}
      - {at: 18, mic: [{name: Zoom}]}
    want: "2s call started (Zoom)"
  - name: closing restarts the two seconds
    steps:
      - {at: 0, mic: [{name: Zoom}]}
      - {at: 1.5, mic: []}
      - {at: 2, mic: [{name: Zoom}]}
      - {at: 3.5, mic: [{name: Zoom}]}
      - {at: 4, mic: [{name: Zoom}]}
    want: "4s call started (Zoom)"
  - name: a second app joining is the same call
    steps:
      - {at: 0, mic: [{name: Zoom}]}
      - {at: 2, mic: [{name: Zoom}]}
      - {at: 5, mic: [{name: Zoom}, {name: FaceTime, pid: 200}]}
      - {at: 6, mic: [{name: FaceTime, pid: 200}]}
      - {at: 20, mic: []}
      - {at: 25, mic: []}
    want: "2s call started (Zoom) | 25s call over (Zoom)"
  - name: our own recording is not a call
    steps:
      - {at: 0, mic: [{pid: 1, bundle: com.parrotflow.app, name: ParrotFlow}]}
      - {at: 30, mic: [{pid: 1, bundle: com.parrotflow.app, name: ParrotFlow}]}
    want: "nothing"
  - name: the other ParrotFlow dictating is not a call
    steps:
      - {at: 0, mic: [{bundle: com.parrotflow.app.dev, name: ParrotFlow Dev}]}
      - {at: 30, mic: [{bundle: com.parrotflow.app.dev, name: ParrotFlow Dev}]}
    want: "nothing"
  - name: another app beside our recording is a call
    steps:
      - {at: 0, mic: [{pid: 1, bundle: com.parrotflow.app, name: ParrotFlow}, {name: Microsoft Teams}]}
      - {at: 3, mic: [{pid: 1, bundle: com.parrotflow.app, name: ParrotFlow}, {name: Microsoft Teams}]}
    want: "3s call started (Microsoft Teams)"
  - name: Siri or dictation listening is not a call
    steps:
      - {at: 0, mic: [{bundle: com.apple.CoreSpeech}]}
      - {at: 30, mic: [{bundle: com.apple.CoreSpeech}]}
    want: "nothing"
  - name: FaceTime's call service is a call
    steps:
      - {at: 0, mic: [{bundle: com.apple.avconferenced}]}
      - {at: 2, mic: [{bundle: com.apple.avconferenced}]}
    want: "2s call started (FaceTime)"
  - name: a system service beside a call app names the app
    steps:
      - {at: 0, mic: [{bundle: com.apple.CoreSpeech, pid: 200}, {name: Zoom}]}
      - {at: 2, mic: [{bundle: com.apple.CoreSpeech, pid: 200}, {name: Zoom}]}
    want: "2s call started (Zoom)"
