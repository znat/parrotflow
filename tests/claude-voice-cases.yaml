# Cases for ClaudeSpeakable: what Claude Code's text and hook events sound like.
# Run with scripts/check-claude-voice.sh. No model, no audio.

clean:
  - name: file link keeps the file name
    input: "Fixed in [Config.swift:42](Sources/ParrotFlow/Config.swift:42)."
    want: "Fixed in Config.swift."
  - name: owner/repo#number is a PR
    input: "Opened znat/parrotflow#327."
    want: "Opened PR 327 in parrotflow."
  - name: GitHub PR URL
    input: "See https://github.com/znat/parrotflow/pull/327 for details"
    want: "See PR 327 in parrotflow for details."
  - name: GitHub issue URL
    input: "Filed https://github.com/znat/parrotflow/issues/12."
    want: "Filed issue 12 in parrotflow."
  - name: bare number
    input: "Merged #42."
    want: "Merged number 42."
  - name: code block is dropped
    input: "Run this:\n```bash\nmake test\n```\nThen restart."
    want: "Run this: Then restart."
  - name: bullets become sentences
    input: "Two changes:\n- **Speaker**: plays audio\n- `ClaudeVoice` listens"
    want: "Two changes: Speaker: plays audio. ClaudeVoice listens."
  - name: heading becomes a sentence
    input: "## What changed\nThe hook is faster."
    want: "What changed. The hook is faster."
  - name: home path keeps the file name
    input: "The log is ~/Library/Logs/ParrotFlow.log now"
    want: "The log is ParrotFlow.log now."
  - name: absolute folder keeps its last part
    input: "Evidence is in /Users/me/Documents/parrotflow-scratch/verify/"
    want: "Evidence is in verify."
  - name: two folders separated by prose stay two
    input: "Moved /Users/me/old to /Users/me/new today"
    want: "Moved old to new today."
  - name: a folder name with a space
    input: "It is in ~/Library/Application Support/ParrotFlow/"
    want: "It is in ParrotFlow."
  - name: and/or after a folder is prose
    input: "See /tmp/foo and/or run tests."
    want: "See foo and/or run tests."
  - name: table is dropped
    input: "Summary:\n| a | b |\n|---|---|\n| 1 | 2 |\nDone."
    want: "Summary: Done."
  - name: other URL says the site
    input: "Docs are at https://code.claude.com/docs/en/hooks"
    want: "Docs are at a link on code.claude.com."
  - name: arrow
    input: "Latency went 7s → 1.5s"
    want: "Latency went 7 seconds to 1.5 seconds."
  - name: plain prose is left alone
    input: "Nothing is built yet."
    want: "Nothing is built yet."
  - name: snake_case is left alone
    input: "Set voice.agents and last_assistant_message."
    want: "Set voice.agents and last_assistant_message."

progress:
  - name: Bash says its description
    tool: Bash
    input: { command: "swift build", description: "Build the release binary." }
    want: "I'm building the release binary"
  - name: Bash without a description
    tool: Bash
    input: { command: "ls" }
    want: "I'm running a command"
  - name: edit names the file
    tool: Edit
    input: { file_path: "/Users/me/parrotflow/Sources/ParrotFlow/Config.swift" }
    want: "I'm editing Config.swift"
  - name: write names the file
    tool: Write
    input: { file_path: "/tmp/notes.md" }
    want: "I'm writing notes.md"
  - name: reads collapse into one line
    tool: Grep
    input: { pattern: "foo" }
    want: "I'm looking through the code"
  - name: agent
    tool: Agent
    input: { description: "Find the socket code" }
    want: "I'm asking an agent to find the socket code"
  - name: task list is bookkeeping
    tool: mcp__ccd_turn__update_plan
    want: null
  - name: todo list is bookkeeping
    tool: TodoWrite
    want: null
  - name: run doubles its consonant
    tool: Bash
    input: { description: "Run the voice cases" }
    want: "I'm running the voice cases"
  - name: verb ending in e
    tool: Bash
    input: { description: "Remove the scratch folder" }
    want: "I'm removing the scratch folder"
  - name: verb ending in ie
    tool: Bash
    input: { description: "Tie the hooks together" }
    want: "I'm tying the hooks together"
  - name: already a gerund
    tool: Bash
    input: { description: "Checking the log" }
    want: "I'm checking the log"
  - name: first word is not a plain word
    tool: Bash
    input: { description: "npm-install deps" }
    want: "npm-install deps"
  - name: browser
    tool: mcp__Claude_Browser__navigate
    input: { url: "http://localhost:3000" }
    want: "I'm using the browser"
  - name: a question with no text still asks
    tool: AskUserQuestion
    want: "I have a question for you."
  - name: a finished plan
    tool: ExitPlanMode
    want: "The plan's ready when you want to look."
  # Codex sends the command alone, or the patch text. The command is never said.
  - name: Codex search reads the code
    agent: codex
    tool: Bash
    input: { command: "rg -n speaksFor Sources" }
    want: "I'm looking through the code"
  - name: Codex tests after cd and a variable
    agent: codex
    tool: Bash
    input: { command: "cd /Users/me/proj && FOO=1 timeout 60 swift test --filter Voice" }
    want: "I'm running the tests"
  - name: Codex pytest through python
    agent: codex
    tool: Bash
    input: { command: "python -m pytest -q tests" }
    want: "I'm running the tests"
  - name: Codex build
    agent: codex
    tool: Bash
    input: { command: "npm run build" }
    want: "I'm building"
  - name: Codex listing a tests folder is reading
    agent: codex
    tool: Bash
    input: { command: "ls tests" }
    want: "I'm looking through the code"
  - name: Codex git diff
    agent: codex
    tool: Bash
    input: { command: "git diff --stat | tail -3" }
    want: "I'm looking at the changes"
  - name: Codex commit keeps its message out
    agent: codex
    tool: Bash
    input: { command: "git commit -m 'rename foo'" }
    want: "I'm committing"
  - name: Codex unknown command
    agent: codex
    tool: Bash
    input: { command: "./scripts/deploy.sh --token abc123" }
    want: "I'm running a command"
  - name: Codex patch names its file
    agent: codex
    tool: apply_patch
    input:
      command: "*** Begin Patch\n*** Update File: Sources/ParrotFlow/ClaudeVoice.swift\n@@\n-old\n+new\n*** End Patch"
    want: "I'm editing ClaudeVoice.swift"
  - name: Codex patch adding two files
    agent: codex
    tool: apply_patch
    input:
      command: "*** Begin Patch\n*** Add File: a/Codex.swift\n+x\n*** Add File: b/README.md\n+y\n*** End Patch"
    want: "I'm writing Codex.swift and README.md"
  - name: Codex patch with mixed changes to three files
    agent: codex
    tool: apply_patch
    input:
      command: "*** Begin Patch\n*** Add File: a.swift\n*** Update File: b.swift\n*** Delete File: c.swift\n*** End Patch"
    want: "I'm editing 3 files"
  - name: Codex patch deleting a file
    agent: codex
    tool: apply_patch
    input: { command: "*** Begin Patch\n*** Delete File: old/Legacy.swift\n*** End Patch" }
    want: "I'm deleting Legacy.swift"
  - name: Codex subagent
    agent: codex
    tool: spawn_agent
    input: { message: "look at the socket code" }
    want: "I'm starting an agent"
  - name: Codex plan is bookkeeping
    agent: codex
    tool: update_plan
    want: null
  - name: Codex question
    agent: codex
    tool: request_user_input
    want: "I have a question for you."
  - name: Codex browser through MCP
    agent: codex
    tool: mcp__chrome__navigate
    input: { url: "http://localhost:3000" }
    want: "I'm using the browser"

# Codex PermissionRequest: the approval it waits for.
waiting:
  - name: a command waits for an OK
    tool: Bash
    input: { command: "rm -rf build" }
    want: "I need your OK to run a command."
  - name: an edit waits for an OK, with its file
    tool: apply_patch
    input: { command: "*** Begin Patch\n*** Update File: src/main.rs\n*** End Patch" }
    want: "I need your OK to edit main.rs."
  - name: another tool waits for an OK
    tool: mcp__github__create_issue
    want: "I need your OK to go on."

turns:
  - name: answer is the text after the last tool call
    lines:
      - '{"type":"user","message":{"role":"user","content":"fix it"}}'
      - '{"type":"assistant","message":{"content":[{"type":"text","text":"Checking the build."}]}}'
      - '{"type":"assistant","message":{"content":[{"type":"tool_use","name":"Bash","input":{"command":"make"}}]}}'
      - '{"type":"user","message":{"content":[{"type":"tool_result","content":"ok"}]}}'
      - '{"type":"assistant","message":{"content":[{"type":"thinking","thinking":""}]}}'
      - '{"type":"assistant","message":{"content":[{"type":"text","text":"Done. Tests pass."}]}}'
    answer: "Done. Tests pass."
    recap: null
  - name: wrap-up recap is kept
    lines:
      - '{"type":"user","message":{"role":"user","content":"go"}}'
      - '{"type":"assistant","message":{"content":[{"type":"tool_use","name":"Edit","input":{}}]}}'
      - '{"type":"user","message":{"content":[{"type":"tool_result","content":"ok"}]}}'
      - '{"type":"assistant","message":{"content":[{"type":"tool_use","name":"mcp__ccd_turn__wrap_up","input":{"recap":"The fix is in. Not committed."}}]}}'
      - '{"type":"user","message":{"content":[{"type":"tool_result","content":"shown"}]}}'
      - '{"type":"assistant","message":{"content":[{"type":"text","text":"Fixed the crash."}]}}'
    answer: "Fixed the crash."
    recap: "The fix is in. Not committed."
  - name: the previous turn does not leak in
    lines:
      - '{"type":"user","message":{"role":"user","content":"first"}}'
      - '{"type":"assistant","message":{"content":[{"type":"text","text":"Old answer."}]}}'
      - '{"type":"user","message":{"role":"user","content":"second"}}'
      - '{"type":"assistant","message":{"content":[{"type":"text","text":"New answer."}]}}'
    answer: "New answer."
    recap: null
    earlier: "Old answer."
  - name: a background task notice does not start a turn
    lines:
      - '{"type":"user","message":{"role":"user","content":"first"}}'
      - '{"type":"assistant","message":{"content":[{"type":"text","text":"Old answer."}]}}'
      - '{"type":"user","message":{"role":"user","content":"second"}}'
      - '{"type":"assistant","message":{"content":[{"type":"text","text":"Waiting on CI."}]}}'
      - '{"type":"user","message":{"role":"user","content":"[SYSTEM NOTIFICATION - NOT USER INPUT]\n<task-notification>done</task-notification>"}}'
      - '{"type":"assistant","message":{"content":[{"type":"text","text":"CI passed."}]}}'
    answer: "Waiting on CI.\n\nCI passed."
    recap: null
    earlier: "Old answer."
  - name: a reminder line is not a prompt
    lines:
      - '{"type":"user","message":{"role":"user","content":"first"}}'
      - '{"type":"assistant","message":{"content":[{"type":"text","text":"Part one."}]}}'
      - '{"type":"user","isMeta":true,"message":{"role":"user","content":"<system-reminder>x</system-reminder>"}}'
      - '{"type":"assistant","message":{"content":[{"type":"text","text":"Part two."}]}}'
    answer: "Part one.\n\nPart two."
    recap: null

parse:
  - name: opener is read beside say and tone
    raw: '{"opener": "Done", "say": "I switched to main.", "tone": "easy"}'
    say: "I switched to main."
    tone: "easy"
    opener: "Done"
  - name: JSON with say and tone
    raw: '{"say": "The build passes.", "tone": "Relaxed and pleased, smiling."}'
    say: "The build passes."
    tone: "Relaxed and pleased, smiling."
  - name: JSON in a code fence
    raw: "```json\n{\"say\": \"Two tests fail.\", \"tone\": \"Calm, a little sorry.\"}\n```"
    say: "Two tests fail."
    tone: "Calm, a little sorry."
  - name: plain text still gives the words
    raw: "The build passes."
    say: "The build passes."
    tone: null
  - name: empty tone is no tone
    raw: '{"say": "Done.", "tone": ""}'
    say: "Done."
    tone: null
  - name: task label is read beside say
    raw: '{"say": "I fixed it.", "task": "fixing the glow"}'
    say: "I fixed it."
    task: "fixing the glow"
  - name: task label is lowercased, its period dropped
    raw: '{"say": "I fixed it.", "task": "Fixing The Glow."}'
    say: "I fixed it."
    task: "fixing the glow"
  - name: a French task label keeps its accents
    raw: '{"say": "J''ai réparé le halo.", "task": "réparer le halo"}'
    say: "J'ai réparé le halo."
    task: "réparer le halo"
  - name: a long task label is no label, and the words stay
    raw: '{"say": "I fixed it.", "task": "fixing the glow around the ghostty window"}'
    say: "I fixed it."
    task: null
  - name: a one-word task label is no label
    raw: '{"say": "I fixed it.", "task": "refactoring"}'
    say: "I fixed it."
    task: null
  - name: a task label with a path is no label
    raw: '{"say": "I fixed it.", "task": "editing Sources/ParrotFlow"}'
    say: "I fixed it."
    task: null
  - name: a task label that is not text is no label
    raw: '{"say": "I fixed it.", "task": 3}'
    say: "I fixed it."
    task: null
  - name: a long plain reply is not said; the answer is said plain
    raw: "I merged the branch into main after the checks passed. The glow now follows the window when you switch tabs, and the pill names the session. Two tests were flaky on the first run, so I ran them again and they passed. Nothing else changed."
    say: ""
  - name: JSON without say is not said
    raw: '{"answer": "I fixed it."}'
    say: ""
  - name: a JSON list is not said
    raw: '["I fixed it."]'
    say: ""

capped:
  - name: short answer is left alone
    input: "I merged it. CI is green."
    want: "I merged it. CI is green."
  - name: a fourth sentence is dropped
    input: "One. Two. Three. Four."
    want: "One. Two. Three."
  - name: a semicolon ends a sentence
    input: "I merged it; CI is green."
    want: "I merged it. CI is green."
  - name: long sentences stop near 300 characters
    input: "I merged number 403 into main and the spoken digits now become identifiers the way they should, which closes the bug you saw on Monday with the server names and the ports. CI is green across all of the checks, and the branch passes twelve of twelve of the invented cases against eight of twelve on main today. One test run wrote a few lines to the release log."
    want: "I merged number 403 into main and the spoken digits now become identifiers the way they should, which closes the bug you saw on Monday with the server names and the ports."

# The spoken answer's only limit: about a minute of speech, 1,000 characters.
ceiling:
  - name: a long answer of eight sentences is said whole
    input: "The dashboard is slow because the orders query scans the whole table. The index on created_at was dropped in the March migration. I put it back in a new migration. The page now loads in under a second on staging. Two other reports use the same query and get faster too. The nightly export was not affected. Nothing is deployed yet. Say the word and I will open the PR."
    want: "The dashboard is slow because the orders query scans the whole table. The index on created_at was dropped in the March migration. I put it back in a new migration. The page now loads in under a second on staging. Two other reports use the same query and get faster too. The nightly export was not affected. Nothing is deployed yet. Say the word and I will open the PR."
  - name: past a minute of speech, whole sentences stop near 1000 characters
    input: "The audit covered all fourteen services that talk to the payments database, one by one. Nine of them open a new connection for every request instead of using the shared pool. Three of those nine run on every page view, which explains the connection spikes at noon. The billing worker holds transactions open while it calls the card provider over the network. That is the cause of the lock waits you saw in the slow query log last week. The reporting service reads from the primary when it could read from the replica. Moving it would take about a fifth of the load off the primary at peak. The search indexer is fine and needs no change at all. The fix for the pool is one shared client per service, created at startup. The fix for billing is to call the provider before the transaction opens. Both changes are small and can ship separately. I would start with billing, because the lock waits are what users feel. Tell me which one to do first. I can also add a CI check that fails when a service opens its own connection. That would stop the problem from coming back."
    want: "The audit covered all fourteen services that talk to the payments database, one by one. Nine of them open a new connection for every request instead of using the shared pool. Three of those nine run on every page view, which explains the connection spikes at noon. The billing worker holds transactions open while it calls the card provider over the network. That is the cause of the lock waits you saw in the slow query log last week. The reporting service reads from the primary when it could read from the replica. Moving it would take about a fifth of the load off the primary at peak. The search indexer is fine and needs no change at all. The fix for the pool is one shared client per service, created at startup. The fix for billing is to call the provider before the transaction opens. Both changes are small and can ship separately. I would start with billing, because the lock waits are what users feel. Tell me which one to do first."

# A table reaches the model as lines of cells; `clean` alone drops it. A row
# with a cell that names a secret keeps only that cell; a column whose header
# names one is dropped.
tables:
  - name: table rows become lines of cells
    input: "Findings:\n\n| Service | p95 | Status |\n|---|---:|---|\n| `orders-api` | 840 ms | **slow** |\n| billing | 120 ms | ok |\n\nThe orders index is missing."
    want: "Findings: Service, p95, Status. orders-api, 840 milliseconds, slow. billing, 120 milliseconds, ok. The orders index is missing."
  - name: a pipe in a code block is still code
    input: "Run this:\n```\n| grep error\n```\nThen retry."
    want: "Run this: Then retry."
  - name: text with no table is left alone
    input: "No table here. Just text."
    want: "No table here. Just text."
  - name: a secret in a table row is not sent
    input: "| Name | Value |\n|---|---|\n| DB_PASSWORD | hunter2 |\n| region | eu-west-1 |"
    want: "Name, Value. DB_PASSWORD, <redacted> region, eu-west-1."
  - name: a column under a secret's header is not sent
    input: "| name | token |\n|---|---|\n| ci | abc123def |\n| deploy | xyz789 |"
    want: "name, token. ci, redacted. deploy, redacted."
  - name: a first row with a secret and no separator is not a header
    input: "| API_KEY | hunter2 |"
    want: "API_KEY, <redacted>"
  - name: an empty cell before a secret column keeps the columns aligned
    input: "| name | | token |\n|---|---|---|\n| ci | | hunter2 |"
    want: "name, token. ci, redacted."
  - name: a wide row hides every cell but the one that names a secret
    input: "| Name | Env | Value |\n|---|---|---|\n| DB_PASSWORD | prod | hunter2 |"
    want: "Name, Env, Value. DB_PASSWORD, <redacted> redacted."
  - name: an escaped pipe stays inside its cell
    input: "| command | note |\n|---|---|\n| grep a \\| wc | counts lines |"
    want: "command, note. grep a | wc, counts lines."
  - name: a secret after a comma is redacted
    input: "The api_key, hunter2 is in the vault."
    want: "The api_key, <redacted> is in the vault."

# What is said with no model: the summary, or the first two sentences, then
# the closing question.
plain:
  - name: a short reply gives its first two sentences
    input: "Fixed. The test was racing the cache. It passes 20 of 20 now."
    want: "Fixed. The test was racing the cache."
  - name: a summary heading wins over a preamble
    input: "I read the logs of the last two weeks.\n\n## Summary\n\nThe cache is cold after each deploy. Warming it fixes the spike. More on that below.\n\n## Details\n\nLots of detail."
    want: "The cache is cold after each deploy. Warming it fixes the spike."
  - name: a TL;DR on its own line
    input: "**TL;DR:** Two causes, an N+1 query and a missing index.\n\nDetails follow."
    want: "Two causes, an N+1 query and a missing index."
  - name: the closing question is added
    input: "I checked the flags. 23 are older than 90 days.\n\nShould I remove the 16 unused ones?"
    want: "I checked the flags. 23 are older than 90 days. Should I remove the 16 unused ones?"
  - name: a French summary
    input: "J'ai regardé les logs.\n\n## En bref\n\nLa sauvegarde bloque les imports. Il faut la décaler.\n\nTu veux que je le fasse ?"
    want: "La sauvegarde bloque les imports. Il faut la décaler. Tu veux que je le fasse?"
  - name: code under a summary heading is not said
    input: "## Summary\n\n```\nmake deploy TARGET=prod\n```\nThe deploy is fixed. It runs in two minutes now.\n"
    want: "The deploy is fixed. It runs in two minutes now."
  - name: a heading inside a code block is not a summary
    input: "I fixed the parser.\n\n```\nSummary: hunter2\n```\nIt handles empty lines now."
    want: "I fixed the parser. It handles empty lines now."
  - name: a reply that is only a table says its rows
    input: "| Job | Status |\n|---|---|\n| nightly export | done |"
    want: "Job, Status. nightly export, done."
  - name: a secret in a table row is not said
    input: "| Name | Value |\n|---|---|\n| DB_PASSWORD | hunter2 |"
    want: "Name, Value. DB_PASSWORD, redacted."
  - name: a first-row secret with no separator is not said
    input: "| DB_PASSWORD | hunter2 |"
    want: "DB_PASSWORD, redacted."
  - name: a word that starts like a heading is not one
    input: "Answering that took a while. The job runs nightly. It is fine."
    want: "Answering that took a while. The job runs nightly."

# A reply too long to send keeps its start and its end, in whole sentences.
head_and_tail:
  - name: a reply under the limit is sent whole
    input: "First point. The answer is yes."
    limit: 100
    want: "First point. The answer is yes."
  - name: a long reply keeps its first sentence and its last ones
    input: "First point. Second point. Third point. Fourth point. Fifth point. Sixth point. The answer is yes."
    limit: 60
    want: "First point. [...] Sixth point. The answer is yes."

redacted:
  - name: plain command is left alone
    input: "swift build -c release && scripts/check-claude-voice.sh"
    want: "swift build -c release && scripts/check-claude-voice.sh"
  - name: bearer token
    input: "curl -H 'Authorization: Bearer abc123def' https://api.example.com/v1"
    want: "curl -H 'Authorization: Bearer <redacted>' https://api.example.com/v1"
  - name: key in an environment variable
    input: "OPENAI_API_KEY=sk-live-0123456789 python3 run.py"
    want: "OPENAI_API_KEY=<redacted> python3 run.py"
  - name: token flag
    input: "gh api --token ghp_abcdefghijklmnop repos"
    want: "gh api --token <redacted> repos"
  - name: bare provider key
    input: "echo sk-or-v1-abcdefghijklmnopqrstuvwxyz"
    want: "echo <redacted>"
  - name: URL query string
    input: "curl https://example.com/hook?sig=abc&user=me"
    want: "curl https://example.com/hook"
  - name: long opaque string
    input: "export X=Zm9vYmFyYmF6cXV4cXV1eHF1dXhmb29iYXJiYXo"
    want: "export X=<redacted>"

naming:
  - name: another session spoke last
    other_spoke_last: true
    quiet_for: 5
    in_front: true
    named: true
  - name: same session, a moment ago
    other_spoke_last: false
    quiet_for: 20
    in_front: false
    named: false
  - name: same session, quiet, window in front
    other_spoke_last: false
    quiet_for: 300
    in_front: true
    named: false
  - name: same session, quiet, window not in front
    other_spoke_last: false
    quiet_for: 300
    in_front: false
    named: true
  - name: exactly two minutes counts
    other_spoke_last: false
    quiet_for: 120
    in_front: false
    named: true

grounded:
  - name: a faithful summary is kept
    said: "I merged PR 403 into main. CI is green, and the spoken digits work now."
    source: "Merged PR 403 into main as 8c15cf77. Spoken digits, separators and learning all work. CI is green on the branch."
    kept: true
  - name: the prompt's own example is refused
    said: "I fixed the crash."
    source: "I merged PR 403 into main. The branch passes 12 of 12 invented cases against 8 of 12 on main."
    kept: false
  - name: an invented result is refused
    said: "I deployed the release and the dashboard shows zero errors."
    source: "I merged PR 403 into main. The branch passes 12 of 12 invented cases against 8 of 12 on main."
    kept: false
  - name: short plain words still count as grounded
    said: "Done."
    source: "Done. Tests pass."
    kept: true
  - name: a word before a period matches the same word
    said: "Merged. Released. Deployed."
    source: "I merged, released and deployed it"
    kept: true

speakable:
  - name: curly apostrophes become straight
    input: "I’m checking whether it’s done."
    want: "I'm checking whether it's done."
  - name: curly quotes and a dash
    input: "It said “done” — then stopped…"
    want: "It said \"done\" ,  then stopped..."

spoken:
  - name: commit phrase is dropped
    input: "It's installed at commit a8532fd1 and listening."
    want: "It's installed and listening."
  - name: hash after as is dropped
    input: "Merged PR 403 into main as 8c15cf77."
    want: "Merged PR 403 into main."
  - name: hash in brackets is dropped
