    want: "Checking the build."

# The session's title, for the reminder's Task line. Claude lines are the
# transcript; Codex lines are session_index.jsonl, and the rollout's thread id
# is 0199a3b2-7c4d-7e8f-9a0b-1c2d3e4f5a6b. Values invented.
titles:
  - name: the title the person set wins over Claude's
    lines:
      - '{"type":"custom-title","customTitle":"Voice summaries for agent answers","sessionId":"s1"}'
      - '{"type":"user","message":{"role":"user","content":"go"}}'
      - '{"type":"ai-title","aiTitle":"Prefilled vocab proposals","sessionId":"s1"}'
    want: "Voice summaries for agent answers"
  - name: the last title the person set wins
    lines:
      - '{"type":"custom-title","customTitle":"First name","sessionId":"s1"}'
      - '{"type":"ai-title","aiTitle":"Generated","sessionId":"s1"}'
      - '{"type":"custom-title","customTitle":"Second name","sessionId":"s1"}'
    want: "Second name"
  - name: with no title set, Claude's last one
    lines:
      - '{"type":"ai-title","aiTitle":"Old guess","sessionId":"s1"}'
      - '{"type":"user","message":{"role":"user","content":"go"}}'
      - '{"type":"ai-title","aiTitle":"Glow around the speaking window","sessionId":"s1"}'
    want: "Glow around the speaking window"
  - name: a title quoted in a message is not a title
    lines:
      - '{"type":"user","message":{"role":"user","content":"read {\"type\":\"custom-title\",\"customTitle\":\"Quoted\"}"}}'
    want: null
  - name: a title object inside a tool call is not the title
    lines:
      - '{"type":"ai-title","aiTitle":"Real title","sessionId":"s1"}'
      - '{"type":"assistant","message":{"content":[{"type":"tool_use","name":"Write","input":{"type":"ai-title","aiTitle":"Nested"}}]}}'
    want: "Real title"
  - name: a file whose only title-like line is a tool call has no title
    lines:
      - '{"type":"assistant","message":{"content":[{"type":"tool_use","name":"Write","input":{"type":"ai-title","aiTitle":"Nested"}}]}}'
    want: null
  - name: a half-written title line is skipped
    lines:
      - '{"type":"custom-title","customTitle":"Kept","sessionId":"s1"}'
      - '{"type":"custom-title","customTitle":"Cut'
    want: "Kept"
  - name: Codex, the thread's last name in the index
    agent: codex
    lines:
      - '{"id":"0199a3b2-7c4d-7e8f-9a0b-1c2d3e4f5a6b","thread_name":"Socket reads","updated_at":"2026-11-08T10:00:00Z"}'
      - '{"id":"0199a3b2-0000-7e8f-9a0b-1c2d3e4f5a6b","thread_name":"Another thread","updated_at":"2026-11-08T10:01:00Z"}'
      - '{"id":"0199a3b2-7c4d-7e8f-9a0b-1c2d3e4f5a6b","thread_name":"Fix dropped socket reads","updated_at":"2026-11-08T10:02:00Z"}'
      - '{"id":"0199a3b2-0000-7e8f-9a0b-1c2d3e4f5a6b","thread_name":"Later, another thread","updated_at":"2026-11-08T10:03:00Z"}'
    want: "Fix dropped socket reads"
  - name: Codex, a thread with no name
    agent: codex
    lines:
      - '{"id":"0199a3b2-0000-7e8f-9a0b-1c2d3e4f5a6b","thread_name":"Another thread","updated_at":"2026-11-08T10:01:00Z"}'
    want: null
  - name: Codex, a cleared name is no title
    agent: codex
    lines:
      - '{"id":"0199a3b2-7c4d-7e8f-9a0b-1c2d3e4f5a6b","thread_name":"Socket reads","updated_at":"2026-11-08T10:00:00Z"}'
      - '{"id":"0199a3b2-7c4d-7e8f-9a0b-1c2d3e4f5a6b","thread_name":"","updated_at":"2026-11-08T10:02:00Z"}'
    want: null

# Codex rollout lines, shaped as Codex 0.167 writes them. Values invented.
codex_turns:
  - name: Codex answer is the final message, not the commentary
    lines:
      - '{"type":"session_meta","payload":{"id":"t1","cwd":"/Users/me/proj","cli_version":"0.167.0"}}'
      - '{"type":"event_msg","payload":{"type":"task_started","turn_id":"7"}}'
      - '{"type":"event_msg","payload":{"type":"item_completed","item":{"type":"UserMessage","id":"u1","content":[{"type":"text","text":"rename foo to bar"}]}}}'
      - '{"type":"event_msg","payload":{"type":"item_completed","item":{"type":"AgentMessage","id":"a1","phase":"commentary","content":[{"type":"Text","text":"Looking for foo first."}]}}}'
      - '{"type":"event_msg","payload":{"type":"item_completed","item":{"type":"CommandExecution","id":"c1","command":"rg foo","exit_code":0}}}'
      - '{"type":"event_msg","payload":{"type":"item_completed","item":{"type":"AgentMessage","id":"a2","phase":"final_answer","content":[{"type":"Text","text":"Renamed foo to bar. cargo build passes."}]}}}'
      - '{"type":"event_msg","payload":{"type":"task_complete","turn_id":"7","last_agent_message":"Renamed foo to bar. cargo build passes."}}'
    prompt: "rename foo to bar"
    answer: "Renamed foo to bar. cargo build passes."
    latest: "Renamed foo to bar. cargo build passes."
    earlier: null
  - name: Codex mid-turn has commentary and no answer yet
    lines:
      - '{"type":"event_msg","payload":{"type":"item_completed","item":{"type":"UserMessage","id":"u1","content":[{"type":"text","text":"fix the socket"}]}}}'
      - '{"type":"event_msg","payload":{"type":"item_completed","item":{"type":"AgentMessage","id":"a1","phase":"commentary","content":[{"type":"Text","text":"Reading SocketListener to see why reads drop."}]}}}'
    prompt: "fix the socket"
    answer: ""
    latest: "Reading SocketListener to see why reads drop."
    earlier: null
  - name: Codex legacy rollout
    lines:
      - '{"type":"event_msg","payload":{"type":"user_message","message":"add a test"}}'
      - '{"type":"event_msg","payload":{"type":"agent_message","message":"Adding it to the YAML.","phase":"commentary"}}'
      - '{"type":"event_msg","payload":{"type":"agent_message","message":"Added one case.","phase":"final_answer"}}'
    prompt: "add a test"
    answer: "Added one case."
    latest: "Added one case."
    earlier: null
  - name: Codex earlier turn
    lines:
      - '{"type":"event_msg","payload":{"type":"user_message","message":"first"}}'
      - '{"type":"event_msg","payload":{"type":"agent_message","message":"Old answer.","phase":"final_answer"}}'
      - '{"type":"event_msg","payload":{"type":"user_message","message":"second"}}'
      - '{"type":"event_msg","payload":{"type":"agent_message","message":"New answer.","phase":"final_answer"}}'
    prompt: "second"
    answer: "New answer."
    latest: "New answer."
    earlier: "Old answer."
  - name: Codex injected context is not the prompt
    lines:
      - '{"type":"event_msg","payload":{"type":"item_completed","item":{"type":"UserMessage","id":"u1","content":[{"type":"text","text":"what changed?"}]}}}'
      - '{"type":"response_item","payload":{"type":"message","role":"user","content":[{"type":"input_text","text":"<environment_context>cwd</environment_context>"}]}}'
      - '{"type":"event_msg","payload":{"type":"task_complete","turn_id":"8","last_agent_message":"Two files changed."}}'
    prompt: "what changed?"
    answer: "Two files changed."
    latest: null
    earlier: null
  - name: Codex tail with no prompt in it
    lines:
      - '{"type":"event_msg","payload":{"type":"agent_message","message":"Still building.","phase":"commentary"}}'
    prompt: null
    answer: ""
    latest: "Still building."
    earlier: null

session_names:
