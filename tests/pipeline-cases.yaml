# Pipeline validation set. Run with scripts/check-pipeline.sh.
#
# What is scored here is the *assembly*, not the stages. Each stage already has
# a set of its own — replacement-cases.txt, numbers-cases.yaml — and repeating
# them through a pipeline would measure the same thing twice and fail in two
# places for one reason. These cases ask a different question: does a stage run
# when the config says it should, in the order it says, and does a condition
# read what it is supposed to read.
#
# Every case names a fixture in tests/pipelines/, and a fixture carries its own
# languages and its own replacement table. Nothing here reads your config, which
# is deliberate: tests/routing-cases.yaml ended up coupled to whichever prompts
# happened to be configured, and its expectations then only meant anything on
# one machine.
#
# `fuzzy` appears in a fixture but no case depends on it firing. It is the one
# stage that cannot be scored deterministically: it asks NSSpellChecker whether
# a word is real, and that service intermittently times out — observed directly
# while writing this, four calls in a row. A timeout reads as "known word", so
# fuzzy declines, which is the safe direction and an unstable one.

cases:
  # --- the default pipeline, end to end -----------------------------------
  - name: filler, then a name, then a number
    pipeline: everything
    input: "um, super base has vingt et un users"
    expect: Supabase has 21 users

  # The guard from numbers-cases.yaml, seen through a pipeline: the stage keeps
  # its own language resolution, so assembling it here must not flatten that.
  - name: the cents collision survives assembly
    pipeline: everything
    input: I have 99 cents
    expect: unchanged

  # --- conditions gate a stage --------------------------------------------
  - name: unless does not match, so the stage runs
    pipeline: conditions
    input: on en a vingt et un
    expect: on en a 21

  - name: unless matches, so the stage is skipped
    pipeline: conditions
    input: "on en a vingt et un dans ```code```"
    expect: unchanged

  # --- a condition reads the text as it stands, not as it arrived ---------
  # The whole reason conditions are evaluated per stage rather than once up
  # front. `replacements` deletes the filler word, so by the time `numbers` is
  # asked whether "genre" is present, it is not — and the stage does not run,
  # even though the sentence arrived containing it.
  #
  # If this ever passes as "on en a 21", conditions have quietly gone back to
  # reading the original text, and the composition this whole design rests on
  # is gone.
  #
  # The capital is not a typo. Any deletion runs `tidy`, which closes the gaps
  # it left and puts a capital back on a sentence a removed leading filler had
  # left lowercase. It fires here although the deletion was mid-sentence, which
  # is worth knowing when reading a diff of a transcript.
  - name: the stage above removed what the condition looks for
    pipeline: when
    input: on en a genre vingt et un
    expect: On en a vingt et un

  # --- app conditions -----------------------------------------------------
  # `app:` is matched against the name and bundle identifier joined into one
  # string, and the app is the one that was in front when the hotkey went down.
  # `--app` is how a case gets to say who that was; without it there is no app
  # at all, which is its own case below.
  - name: the app matches, so the stage runs
    pipeline: apps
    app: Ghostty
    input: on en a vingt et un
    expect: on en a 21

  - name: another app, so the stage is skipped
    pipeline: apps
    app: TextEdit
    input: on en a vingt et un
    expect: unchanged

  # The identifier is half the haystack, so a pattern can name an app by the
  # thing that does not change when someone renames the binary.
  - name: the bundle identifier is matched too
    pipeline: apps
    app: com.mitchellh.ghostty
    input: on en a vingt et un
    expect: on en a 21

  # Fails closed. No Accessibility, no window, a path that never had an app —
  # running anyway would put a terminal-only stage everywhere else, which is
  # the opposite of what asking for `app:` means.
  - name: no app at all, so an app-conditioned stage does not run
    pipeline: apps
    input: on en a vingt et un
    expect: unchanged

  # --- exclusion, with no not_app --------------------------------------
  # The negative lookahead is the whole reason `not_app:` does not exist. These
  # two are what says it works in both directions.
  - name: a negative lookahead keeps the stage out of a terminal
    pipeline: apps-excluded
    app: Ghostty
    input: on en a vingt et un
    expect: unchanged

  - name: and lets it run everywhere else
    pipeline: apps-excluded
    app: TextEdit
    input: on en a vingt et un
    expect: on en a 21

  # --- named tables, chosen by app ----------------------------------------
  # The same sentence, two outputs, decided by where it is going. Both steps
  # are in the pipeline and both conditions are evaluated; only one matches.
  - name: a table transform runs where its app matches
    pipeline: transforms
    app: Ghostty
    input: read user dot name
    expect: read user.name

  - name: the other app gets the other table
    pipeline: transforms
    app: Slack
    input: read user dot name
    expect: "read `user.name`"

  - name: an app matching neither gets neither
    pipeline: transforms
    app: Mail
    input: read user dot name
    expect: unchanged

  # The spoken word varies, not the language of the transcript, so the
  # alternation belongs in the pattern and not in a per-language pipeline.
  - name: point works as well as dot
    pipeline: transforms
    app: Ghostty
    input: lis user point name
    expect: lis user.name

  # `--replace` turns prompts off so it cannot reach the network. A table is
  # not a prompt, and holding it back would make the flag mean "no transforms".
  # It did mean that, until this was run against a real config.
  - name: a table still runs when prompts are off
    pipeline: transforms
    app: Ghostty
    no_prompts: true
    input: read user dot name
    expect: read user.name

  # --- an empty pipeline is a choice --------------------------------------
  - name: nothing listed, so nothing runs
    pipeline: empty
    input: super base has vingt et un users
    expect: unchanged

  # --- a prompt stage, wired but never scored -----------------------------
  # A prompt calls a model, so what it produces cannot be a fixed expectation.
  # These two ask the only questions that have one right answer: does the
  # condition decide, and is a prompt that cannot run survivable.

  - name: the condition keeps the prompt out of the way
    pipeline: prompt
    input: on en a vingt et un
    expect: on en a 21

  # The condition holds, the prompt is named, and no such prompt exists. The
  # stage must give the transcript back rather than empty it — the same
  # contract as Ollama being absent, which is an ordinary state here.
  #
  # "genre" survives, and that is the assertion: the word the prompt would have
  # removed is still there, so what came back is the transcript and not a
  # half-finished rewrite. An expectation of "on en a 21" would have passed
  # only if something else had quietly deleted it.
  - name: a prompt that cannot run returns the transcript
    pipeline: prompt
    input: on en a genre vingt et un
    expect: on en a genre 21

  # --- from the code review -----------------------------------------------
  # A prompt stage must not touch a wake-phrase utterance. It runs inside
  # transcription, before anything has looked for the phrase, so a rewrite
  # would eat "hey parrot" and what should have run as a command would be
  # pasted into the document instead.
  - name: a prompt never rewrites a spoken command
    pipeline: prompt
    input: hey parrot, make that a bullet list
    expect: unchanged

  # --- a transform that is somebody else's program -------------------------
  # The third body kind. `shout` proves the transcript reaches stdin and comes
  # back from stdout; `broken` (exits 3) and `silent` (says nothing) run
  # straight after it and must leave what it produced alone. A command that
  # fails is an ordinary state — a script half-written, an interpreter missing
  # — and a dictation tool cannot answer it by dropping the transcript.
  - name: a command transform rewrites through stdin and stdout
    pipeline: command
    input: read user dot name
    expect: READ USER DOT NAME

  # Same path with accents, because the transcript crosses a pipe as bytes and
  # `tr` is the stage most likely to mangle them.
  - name: a command transform keeps what it was given intact
    pipeline: command
    input: la réunion a duré très longtemps
    expect: LA RÉUNION A DURÉ TRÈS LONGTEMPS

  # A bare relative path, resolved against the directory of the file that
  # declared it — the fixture here, config.yaml in a real install. The script
  # is examples/transforms/code_identifiers/code_identifiers.py, whose own set is examples/transforms/code_identifiers/cases.yaml;
  # what this case adds is that the app finds it and hands it the transcript.
  - name: a command transform finds a script beside the file that names it
    pipeline: command-relative
    input: add a python function called max retries that returns the count
    expect: add a python function called max_retries that returns the count

  # The shebang picks the interpreter, and it does nothing without an execute
  # bit. Committed without one, so this stays true.
  - name: a command that cannot be executed leaves the transcript alone
    pipeline: command-unrunnable
    input: read user dot name
    expect: unchanged

  # EOF on stdout is not the same event as the process exiting, and treating
  # them as one meant a command could close its output, keep running, and hold
  # the pipeline for as long as it liked.
  - name: a command that closes stdout and keeps running gives up on time
    pipeline: command-hangs
    input: read user dot name
    expect: unchanged

  # A space in the path — in the directory the config lives in, and in the
  # relative path itself. Both reached /bin/sh unquoted and were split into a
  # program and an argument.
  - name: a command path with a space in it still runs
    pipeline: command-spaces
    input: read user dot name
    expect: READ USER DOT NAME

  # Two seconds is right for a script and wrong for one that asks a model, so
  # the limit is a per-transform setting. Without it this comes back untouched.
  - name: a command can be given longer than the default two seconds
    pipeline: command-patient
    input: read user dot name
    expect: READ USER DOT NAME

  # --- variables ------------------------------------------------------------
  #
  # `expect_vars` asserts on the scope rather than on the sentence, which is the
  # only way to score a stage whose whole contribution is a fact. Each entry has
  # to appear in the `--vars` listing with that exact value; a case that names no
  # variables is unaffected.
  #
  # What is being scored here is the machinery, not the stages — the fixtures use
  # a script that publishes whatever its flags say, so a failure is about the
  # carrying and never about whether some transform changed its mind.

  # Every namespace present at the end, including the two that ran before the
  # ones that published last. This is carry-through in its plainest form: four
  # stages, and the first one's facts are still readable after the other three.
  - name: every stage's variables survive the stages after it
    pipeline: vars
    input: super base has vingt et un users
    expect: Supabase has 21 users
    expect_vars:
      vocabulary.count: 1
      vocabulary.changed: true
      numbers.language: fr
      numbers.changed: true
      first.count: 2
      second.count: 7
      second.label: kept

  # The same run, read from the far side of a pipe. `first` reports what it found
  # at `vocabulary.count` and `second` reports what it found at `first.count`,
  # so a pass here means the scope reached two separate scripts — not merely that
  # it survived in Swift, which every other case in this section would also show.
  - name: a script sees what the stages above it published
    pipeline: vars
    input: super base has vingt et un users
    expect: Supabase has 21 users
    expect_vars:
      first.saw: 1
      second.saw: 2

  # And the same pipeline on a sentence the table does not touch, so the numbers
  # a script reads are the ones this run produced rather than any run's.
  - name: what a script sees is this transcript's, not the last one's
    pipeline: vars
    input: nothing here matches
    expect: unchanged
    expect_vars:
      vocabulary.count: 0
      first.saw: 0
      second.saw: 2

  # Both halves of the rule, in one pipeline. `counter` runs twice: `count` is
  # republished and the later value wins; `label` is written only by the first
  # run and has to survive the second one saying nothing about it.
  - name: a stage run twice overrides its own variables
    pipeline: vars-override
    input: read user dot name
    expect: unchanged
    expect_vars:
      counter.count: 2
      counter.label: first-run

  # The stage in between is untouched by either run of `counter`, and its own
  # namespace is untouched by them. A stage writes under its own name and
  # nowhere else — there is no way to spell otherwise, which is the point.
  - name: one stage's variables do not reach another's namespace
    pipeline: vars-override
    input: read user dot name
    expect: unchanged
    expect_vars:
      quiet.count: 9
      quiet.changed: false

  # A condition reading a variable rather than the text. The table fires, so
  # `vocabulary.count` is 1, so the stage gated on it being 0 stands down.
  - name: a stage stands down because an earlier stage already did the work
    pipeline: vars-conditions
    app: Ghostty
    input: super base is down
    expect: Supabase is down
    expect_vars:
      first.saw: 1
      second.ran: false

  # The same pipeline, the other branch. Nothing for the table to do, so the
  # gated stage runs.
  - name: and runs when the earlier stage found nothing to do
    pipeline: vars-conditions
    app: Ghostty
    input: nothing here matches
    expect: unchanged
    expect_vars:
      first.saw: 0
      second.ran: true
      second.count: 42

  # `app` and `language` are in the scope before any stage runs, so a condition
  # can read them by name. Ghostty, so the stage that excludes terminals stands
  # down — written as a real negation rather than as the anchored negative
  # lookahead the `app:` key would have needed.
  - name: a condition reads the seeded app and language
    pipeline: vars-conditions
    app: Ghostty
    input: nothing here matches
    expect: unchanged
    expect_vars:
      third.ran: false

  - name: and the same condition lets it run in an editor
    pipeline: vars-conditions
    app: Zed
    input: nothing here matches
    expect: unchanged
    expect_vars:
      third.ran: true
      third.count: 7

  # The three ways a structured stage does not work. All three keep the
  # transcript; all three stay distinguishable afterwards.
  - name: a stage that printed prose is marked as having failed
    pipeline: vars-failure
    input: read user dot name
    expect: unchanged
    expect_vars:
      broken.ok: false
      broken.changed: false

  - name: a stage that exited non-zero is marked the same way
    pipeline: vars-failure
    input: read user dot name
    expect: unchanged
    expect_vars:
      second.ok: false

  # Returning no `text` is not a failure. It is a stage saying it looked and
  # left the sentence alone, which is why `text` is optional in the reply — and
  # it has to be told apart from the two above it.
  - name: a stage that returns variables and no text is not a failure
    pipeline: vars-failure
    input: read user dot name
    expect: unchanged
    expect_vars:
      quiet.ok: true
      quiet.changed: false
      quiet.count: 5

  # A skipped stage gets `ran: false` and nothing else. No `ok`, no `changed` —
  # inventing them would let `first.ok` read true for a stage that never
  # happened.
  - name: a skipped stage reports that it did not run
    pipeline: vars-skipped
    app: Zed
    input: read user dot name
    expect: READ USER DOT NAME
    expect_vars:
      first.ran: false

  # A command with no `returns:` speaks the old contract and knows nothing about
  # any of this, and still gets the derived variables — so a script written
  # before variables existed is still something a later stage can gate on.
  - name: a plain stdin-to-stdout command still gets the derived variables
    pipeline: vars-skipped
    app: Zed
    input: read user dot name
    expect: READ USER DOT NAME
    expect_vars:
      quiet.ran: true
      quiet.ok: true
      quiet.changed: true

  # The language a structured command is handed is the detected one, not the
  # first entry in `languages:`. Scored from what the script reports back,
  # because what Swift believes it sent is not the question.
  - name: a structured command is told the detected language
    pipeline: vars-language
    input: on en a vingt et un dans le tableau
    expect: unchanged
    expect_vars:
      first.saw: fr

  - name: and the configured order does not decide it
    pipeline: vars-language
    input: there are twenty one rows in the table
    expect: unchanged
    expect_vars:
      first.saw: en

  # The shipped script, speaking the protocol, with the stage below it gated on
  # what it published. A sentence it takes:
  #
  # `protected` is the written identifier and not the words that were said. The
  # spoken form appears nowhere in the text a later stage is handed, so a stage
  # asked to leave a name alone could not find it.
  - name: the shipped transform publishes what it converted
    pipeline: vars-shipped
    input: a python function called max retries
    expect: a python function called max_retries
    expect_vars:
      code_identifiers.count: 1
      code_identifiers.asked_model: false
      code_identifiers.protected: max_retries
      dotted.ran: false
  # A class, so the written form is the one thing the two can differ by: the
  # words are the same and only the convention changed.
  - name: and publishes it in the convention it wrote
    pipeline: vars-shipped
    input: a python class called user profile
    expect: a python class called UserProfile
    expect_vars:
      code_identifiers.count: 1
      code_identifiers.protected: UserProfile
  # The same name twice. `count` says how much work the stage did and stays 2;
  # `protected` is the list of words to leave alone, so it holds one entry.
  - name: and names a repeated identifier once
    pipeline: vars-shipped
    input: a python function called max retries and another python function called max retries
    expect: a python function called max_retries and another python function called max_retries
    expect_vars:
      code_identifiers.count: 2
      code_identifiers.protected: max_retries
  # And one it declines, which is what lets the stage below it have a turn.
  # Nothing converted means nothing to protect, so the list is empty rather
  # than absent — a condition reading it must not fault.
  - name: and stands aside for the next stage when it converted nothing
    pipeline: vars-shipped
    input: read user dot name
    expect: read user.name
    expect_vars:
      code_identifiers.count: 0
      code_identifiers.protected: ""
      dotted.ran: true
      dotted.changed: true

  # --- context, which from here can only decline --------------------------
  #
  # See tests/pipelines/context.yaml for why the capture itself is not scored.
  # What these hold down is the rule that survives that: a stage which has
  # nothing to publish costs nothing and hides nothing.
  #
  # The reason is always the same one here, and that is the point rather than a
  # limitation. The stage publishes what was captured when the hotkey went down,
  # and `--pipeline` has no hotkey — so this is also the scored answer to "what
  # does the stage do when it is reached by a path that never pressed anything".
  - name: context declines with no press to publish, and says which
    pipeline: context
    app: Ghostty com.mitchellh.ghostty
    input: super base has twenty one users
    expect: Supabase has 21 users
    expect_vars:
      context.ran: true
      context.ok: false
      context.chars: 0
      context.declined: nothing was captured when the hotkey went down

  # The stage sits between `replacements` and `numbers` in the fixture, so this
  # case is also the answer to "does a stage that publishes variables disturb
  # the ones either side of it". Both still fire.
  - name: a declining context leaves the stages around it alone
    pipeline: context
    app: Ghostty com.mitchellh.ghostty
    input: super base has twenty one users
    expect: Supabase has 21 users
    expect_vars:
      context.changed: false
      vocabulary.count: 1
      numbers.ran: true

  # A non-terminal used to decline here for its own reason. It cannot any more:
  # the terminal check moved to the press, so from `--pipeline` every app gets
  # `noPress` and an app-specific case would pass without testing anything. The
  # case that remains is the one still worth holding: whatever the app, the
  # transcript comes out untouched.
  - name: context leaves a non-terminal transcript exactly as it arrived
    pipeline: context
    app: Slack com.tinyspeck.slackmacgap
    input: super base has twenty one users
    expect: Supabase has 21 users
    expect_vars:
      context.ok: false
      context.changed: false

  # --- protected, which a table publishes on its own behalf ----------------
  #
  # `protected` is the text a pass actually put in, so a later stage can leave
  # those characters alone. A `replace:` table has no code of its own, so
  # `Replacements.exact` publishes for it. The value is the template expanded,
  # which is the part that needed the change: the all-at-once regex call keeps
  # the expansion to itself and hands back only the finished string.
  - name: a replace transform publishes the expanded template, not the template
    pipeline: vars-shipped
    input: read user dot name
    expect: read user.name
    expect_vars:
      dotted.count: 1
      dotted.protected: user.name

  # The same rule twice in one sentence. Both are protected, and the pass walks
  # the matches back to front so the second one's offsets are still good when
  # the first is written.
  - name: a replace transform publishes both substitutions it wrote
    pipeline: vars-shipped
    input: read user dot name and config dot yaml
    expect: read user.name and config.yaml
    expect_vars:
      dotted.count: 1
      dotted.protected: "user.name; config.yaml"

  # Nothing fired, so there is nothing to protect. Empty rather than absent, so
  # a condition reading it does not fault.
  - name: a replace transform that fired publishes nothing when it wrote nothing
    pipeline: vars-shipped
    input: a python function called max retries
    expect: a python function called max_retries
    expect_vars:
      dotted.ran: false

  # The `vocabulary` stage publishes it too, from the pass that writes the
  # names. A rule protects the term it wrote.
  - name: the vocabulary stage publishes what its rules wrote
    pipeline: replacements
    input: our app is deployed on Versailles
    expect: our app is deployed on Vercel
    expect_vars:
      vocabulary.protected: Vercel

  # A deletion protects nothing — there is no text to leave alone. It is a
  # transform now, so the name stage has nothing to say about the sentence and
  # reports a count of zero while the filler still goes.
  - name: a deletion protects nothing
    pipeline: replacements
    input: our app is um deployed on Vercel
    expect: Our app is deployed on Vercel
    expect_vars:
      vocabulary.count: 0
      vocabulary.protected: ""

  # A pattern can match a term that is already written the way the rule would
  # write it. That match wrote nothing, so there is nothing to protect —
  # publishing it would have `join` read the speaker's own word as a rule's
  # work and leave it alone where it should be re-cased.
  - name: a match that changed nothing protects nothing
    pipeline: protected
    input: we deployed on Vercel
    expect: unchanged
    expect_vars:
      vocabulary.count: 0
      vocabulary.changed: false
      vocabulary.protected: ""

  # The same rule, the spelling it exists for. This is the half that must keep
  # working, and it is why the case above cannot be got by deleting the rule.
  - name: and the same rule protects what it did write
    pipeline: protected
    input: we deployed on Versal
    expect: we deployed on Vercel
    expect_vars:
      vocabulary.count: 1
      vocabulary.protected: Vercel

  # --- input, which from here can only decline -----------------------------
  #
  # See tests/pipelines/input.yaml. Same shape as the context cases above and
  # for the same reason: the field is read when the hotkey goes down, and
  # `--pipeline` has no hotkey.
  - name: input declines with no press to publish, and says which
    pipeline: input
    app: Slack com.tinyspeck.slackmacgap
    input: super base has twenty one users
    expect: Supabase has 21 users
    expect_vars:
      input.ran: true
      input.ok: false
      input.chars: 0
      input.total: 0
      input.declined: nothing was captured when the hotkey went down

  # Every surface, not terminals only. That is the difference from `context`,
  # so a terminal gets its own case rather than being assumed.
  - name: input declines in a terminal too, and leaves the stages around it alone
    pipeline: input
    app: Ghostty com.mitchellh.ghostty
    input: super base has twenty one users
    expect: Supabase has 21 users
    expect_vars:
      input.ok: false
      input.changed: false
      vocabulary.count: 1
      numbers.ran: true

  # --- the name judge, on what a `replacements` rule did -----------------------
  #
  # `--pipeline` has no audio, so these are the path that used to have no earlier
  # text to compare against. `replacements` publishes its input as
  # `vocabulary.before`, and that is what says which `Vercel` a rule wrote.
  # `vocabulary.slots` counts the places the stage found. See
  # tests/pipelines/vocabulary-rules.yaml for why no model is called.

  # The case the fix is for. The rule rewrites one `Versailles`, the decoder had
  # already written the other `Vercel`, and the term now stands twice. Without
  # the earlier text this offered nothing and logged that it could not tell them
  # apart. One slot, on the occurrence the rule made.
  - name: a rule is attributed when the term it wrote stands twice
    pipeline: vocabulary-rules
    input: a list of possible alternatives for Versailles, such as Vercel
    expect: a list of possible alternatives for Vercel, such as Vercel
    expect_vars:
      vocabulary.before: a list of possible alternatives for Versailles, such as Vercel
      vocabulary.changes: Versailles -> Vercel
      vocabulary.slots: 1

  # One occurrence was decidable without the earlier text and still is. Here so
  # that the path which already worked is held, not only the one that did not.
  - name: a rule is attributed when the term it wrote stands once
    pipeline: vocabulary-rules
    input: our app is deployed on Versailles
    expect: our app is deployed on Vercel
    expect_vars:
      vocabulary.slots: 1

  # A term the decoder wrote itself is not a substitution. No rule fired, so
  # there is nothing to offer back and no menu to build.
  - name: a term nothing rewrote opens no slot
    pipeline: vocabulary-rules
    input: our app is deployed on Vercel
    expect: unchanged
    expect_vars:
      vocabulary.changes: ""
      vocabulary.slots: 0

  # Two renderings of one term in one sentence. The pairs are counted per term,
  # so together they account for both `Vercel`s standing and each occurrence is
  # offered its own spelling back. Counted one at a time each accounted for one
  # of the two, each failed, and the sentence got no menu at all. This is the
  # live sentence from the 2026-08-09 dictation pass.
  #
  # Two slots is the opportunity, not the answer. What the judge picks at them
  # is a different question and this case says nothing about it.
  - name: two rules writing one term in one sentence open a slot each
    pipeline: vocabulary-rules-two-renderings
    input: deployed on Versal against the Versailles Castle
    expect: deployed on Vercel against the Vercel Castle
    expect_vars:
      vocabulary.before: deployed on Versal against the Versailles Castle
      vocabulary.slots: 2

  # And the counts still have to add up. A pattern rule wrote the second
  # `Vercel` and names no spelling to offer back, so the literal rule beside it
  # is one occurrence short however the pairs are grouped. Declining is the
  # point: the literal's own occurrence is still there to be claimed, and
  # claiming it would put `Versal` on the menu at a place the pattern wrote.
  - name: a term a pattern also wrote is still declined rather than guessed
    pipeline: vocabulary-rules-pattern
    input: deployed on Versal against the Versailles Castle
    expect: deployed on Vercel against the Vercel Castle
    expect_vars:
      vocabulary.slots: 0

  # Two `replacements` steps, which a pipeline may have. `before` and `changes`
  # are both the second step's, so they still describe the same run. The second
  # step finds nothing left to rewrite, so it publishes no changes and the judge
  # is offered nothing — the first step's changes are not readable from here,
  # and never were.
  - name: a second replacements step republishes its own input
    pipeline: vocabulary-rules-twice
    input: a list of possible alternatives for Versailles, such as Vercel
    expect: a list of possible alternatives for Vercel, such as Vercel
    expect_vars:
      vocabulary.before: a list of possible alternatives for Vercel, such as Vercel
      vocabulary.changes: ""
      vocabulary.slots: 0

  # --- fuzzy renderings --------------------------------------------------------
  #
  # See tests/pipelines/vocabulary-fuzzy.yaml. Two mechanisms under one option:
  # a word spelled like a rendering but for its apostrophes, and a word one
  # edit away that no dictionary knows.

  # `vocabulary.count` matters as much as the place does. It is what
  # `when: vocabulary.count > 0` reads, so a term that only a fuzzy match
  # reaches has to raise it — otherwise the stage this option is for never runs
  # in the config anybody actually has.
  - name: a rendering an apostrophe away opens a place, and counts
    pipeline: vocabulary-fuzzy
    input: She deserves Praise's work
    expect: unchanged
    expect_vars:
      vocabulary.changes: ""
      vocabulary.count: 1
      vocabulary.slots: 1

  - name: the same rendering, matched exactly, opens none and counts none
    pipeline: vocabulary-exact
    input: She deserves Praise's work
    expect: unchanged
    expect_vars:
      vocabulary.count: 0
      vocabulary.slots: 0

  - name: a rendering one edit away opens a place
    pipeline: vocabulary-fuzzy
    input: our app is deployed on Versel
    expect: unchanged
    expect_vars:
      vocabulary.slots: 1

  - name: one edit away, matched exactly, opens none
    pipeline: vocabulary-exact
    input: our app is deployed on Versel
    expect: unchanged
    expect_vars:
      vocabulary.slots: 0

  # The gate that makes one edit affordable. "praise" is one edit from
  # `Praises` and is a word this speaker says 111 times in their own archive.
  # The spell checker knows it, so nothing here touches it.
  - name: a word the dictionary knows is never matched by edit distance
    pipeline: vocabulary-fuzzy
    input: We should praise the work that was done
    expect: unchanged
    expect_vars:
      vocabulary.slots: 0

  # A rule that fired already owns its span, and the term it wrote is not then
  # matched back against the rendering it came from.
  - name: a rule that fired is not offered a second time by the fuzzy pass
    pipeline: vocabulary-fuzzy
    input: our app is deployed on Versal
    expect: our app is deployed on Vercel
    expect_vars:
      vocabulary.changes: Versal -> Vercel
      vocabulary.slots: 1

  # --- a stage with no reviewer ----------------------------------------------
  #
  # `review: false` is a documented value and used to be a config that would not
  # load at all — the key decoded as a name and nothing else, so a boolean threw
  # before the app ever saw the pipeline.
  - name: review off still writes what the rules matched exactly
    pipeline: review-off
    input: super base is up
    expect: Supabase is up
    expect_vars:
      vocabulary.count: 1
      vocabulary.slots: 0

  # And the other half: with nobody to read the sentence, a near miss is left
  # where it stands rather than written on the strength of the edit alone.
  - name: review off leaves the near misses alone
    pipeline: review-off
    input: our app is deployed on Versel
    expect: unchanged
    expect_vars:
      vocabulary.count: 0
      vocabulary.slots: 0

  # --- named word lists ------------------------------------------------------
  #
  # `{{name}}` in a pattern is the list of that name, as an alternation. The
  # same words were pasted into nine regexes before this and had already
  # drifted apart.
  - name: a list expands into a pattern, and the guard fires
    pipeline: lists
    input: the dot com bubble
    expect: unchanged

  - name: the same rule still fires where no determiner is in front
    pipeline: lists
    input: read user dot name
    expect: read user.name

  # Longest word first, or `colon` sitting earlier in the alternation eats
  # `semi colon`. The fixture writes the two the wrong way round on purpose.
  - name: a longer phrase wins over a shorter one inside it
    pipeline: lists
    input: he paused semi colon then went on
    expect: he paused MARK then went on

  # A second list in the same pattern, so a rule can guard on two.
  - name: a lead word declines the whole path
    pipeline: lists
    input: it is in slash tmp
    expect: unchanged

  - name: and the same rule fires without one
    pipeline: lists
    input: folder slash file
    expect: folder/file

  # And the words reach a script as well as a pattern, under one namespace.
  # One word, because `expect_vars` splits its own entries on `;` and a joined
  # list is full of them.
  - name: the lists are published into the scope
    pipeline: lists
    input: read user dot name
    expect: read user.name
    expect_vars:
      lists.path_lead: in

# Pipelines that must not load at all.
#
# Scored separately because the property is different: these never reach a
# transcript, and what is being checked is that `--check-config` says the useful
# thing rather than that some stage did something. `expect_problem` is a
# substring — the whole message is prose and would tie a case to its wording.
refused:
  - name: a condition reading a stage that runs later is refused
    pipeline: reads-later-stage
    expect_problem: runs *after* this stage

  - name: a condition naming a stage nothing declares is refused
    pipeline: reads-unknown-stage
    expect_problem: nothing in this pipeline is called "cod_identifiers"

  - name: the old bare-word condition is refused, and told what to write
    pipeline: bare-word
    expect_problem: 'write it as a pattern: /genre/'

  - name: an expression that does not parse is refused at load
    pipeline: bad-syntax
    expect_problem: is not part of this language

  - name: a transform named after the transcription metadata is refused
    pipeline: reserved-name
    expect_problem: would file its variables where asr already is

  # The same rule, for the name a prompt reads the spoken instruction from. It
  # is a bare value and would also be a namespace prefix, which is exactly why
  # `text` is on that list.
  - name: a transform named after the spoken instruction is refused
    pipeline: reserved-instruction
    expect_problem: would file its variables where instruction already is

  # The name judge reads spans measured before the pipeline started. Every
  # stage that edits text moves them (F10), so the order is not a preference.
  - name: the name judge placed after a stage that edits text is refused
    pipeline: vocabulary-after-edit
    expect_problem: which rewrite the transcript

  # A cap below 1 silences the stage on every transcript. Refused by name, so
  # the reader learns which of the numbers they typed.
  - name: a cap of zero is refused and named
    pipeline: vocabulary-cap-zero
    expect_problem: max_per_term is 0

  # The prompt is compiled in. Every config written before that names a file,
  # and the file is refused rather than ignored — see the fixture.
  - name: a vocabulary stage naming a prompt file is refused
    pipeline: vocabulary-prompt-file
    expect_problem: names a prompt file

  # A verdict has two sides, so a place cannot offer three readings. Found by
  # review on #102: the third was built and then silently dropped.
  - name: more readings a place than a verdict can express is refused
    pipeline: vocabulary-per-slot-three
    expect_problem: max_per_slot is 3

  # The same failure in the other retired knob: a number that loads and does
  # nothing, because the menu it capped is gone.
  - name: a cap on the retired menu is refused
    pipeline: vocabulary-max-readings
    expect_problem: max_readings is 16

  # A pattern naming a list nothing defines. The name is left literal at
  # runtime, so the rule matches nothing and looks exactly like a rule that is
  # working. Emptying it instead would be worse: `(?:)` matches everywhere.
  - name: a pattern naming a list nothing defines is refused
    pipeline: unknown-list
    expect_problem: names {{determinors}}, which nothing defines

  # And a list that is defined with nothing in it. Same outcome, and the worse
  # of the two if it expanded: `(?:)` matches everywhere, so the guard in front
  # of it would stop the rewrite on every transcript.
  - name: a pattern naming an empty list is refused
    pipeline: empty-list
    expect_problem: which is defined with no words in it

  # The lists are published under `lists.*` before any stage runs, so a
  # transform of that name would overwrite them.
  - name: a transform named after the word lists is refused
    pipeline: reserved-lists
    expect_problem: a transform called "lists" would file its variables
