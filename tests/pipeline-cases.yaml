# Pipeline validation set. Run with scripts/check-pipeline.sh.
#
# What is scored here is the *assembly*, not the stages. Each stage already has
# a set of its own — replacement-cases.txt, numbers-cases.yaml — and repeating
# them through a pipeline would measure the same thing twice and fail in two
# places for one reason. These cases ask a different question: does a stage run
# when the config says it should, in the order it says, and does a condition
# read what it is supposed to read.
#
# Every case names a fixture in tests/pipelines/, and a fixture carries its own
# languages and its own replacement table. Nothing here reads your config, which
# is deliberate: tests/routing-cases.yaml ended up coupled to whichever prompts
# happened to be configured, and its expectations then only meant anything on
# one machine.
#
# `fuzzy` appears in a fixture but no case depends on it firing. It is the one
# stage that cannot be scored deterministically: it asks NSSpellChecker whether
# a word is real, and that service intermittently times out — observed directly
# while writing this, four calls in a row. A timeout reads as "known word", so
# fuzzy declines, which is the safe direction and an unstable one.

cases:
  # --- the default pipeline, end to end -----------------------------------
  - name: filler, then a name, then a number
    pipeline: everything
    input: "um, super base has vingt et un users"
    expect: Supabase has 21 users

  # The guard from numbers-cases.yaml, seen through a pipeline: the stage keeps
  # its own language resolution, so assembling it here must not flatten that.
  - name: the cents collision survives assembly
    pipeline: everything
    input: I have 99 cents
    expect: unchanged

  # --- conditions gate a stage --------------------------------------------
  - name: unless does not match, so the stage runs
    pipeline: conditions
    input: on en a vingt et un
    expect: on en a 21

  - name: unless matches, so the stage is skipped
    pipeline: conditions
    input: "on en a vingt et un dans ```code```"
    expect: unchanged

  # --- a condition reads the text as it stands, not as it arrived ---------
  # The whole reason conditions are evaluated per stage rather than once up
  # front. `replacements` deletes the filler word, so by the time `numbers` is
  # asked whether "genre" is present, it is not — and the stage does not run,
  # even though the sentence arrived containing it.
  #
  # If this ever passes as "on en a 21", conditions have quietly gone back to
  # reading the original text, and the composition this whole design rests on
  # is gone.
  #
  # The capital is not a typo. Any deletion runs `tidy`, which closes the gaps
  # it left and puts a capital back on a sentence a removed leading filler had
  # left lowercase. It fires here although the deletion was mid-sentence, which
  # is worth knowing when reading a diff of a transcript.
  - name: the stage above removed what the condition looks for
    pipeline: when
    input: on en a genre vingt et un
    expect: On en a vingt et un

  # --- app conditions -----------------------------------------------------
  # `app:` is matched against the name and bundle identifier joined into one
  # string, and the app is the one that was in front when the hotkey went down.
  # `--app` is how a case gets to say who that was; without it there is no app
  # at all, which is its own case below.
  - name: the app matches, so the stage runs
    pipeline: apps
    app: Ghostty
    input: on en a vingt et un
    expect: on en a 21

  - name: another app, so the stage is skipped
    pipeline: apps
    app: TextEdit
    input: on en a vingt et un
    expect: unchanged

  # The identifier is half the haystack, so a pattern can name an app by the
  # thing that does not change when someone renames the binary.
  - name: the bundle identifier is matched too
    pipeline: apps
    app: com.mitchellh.ghostty
    input: on en a vingt et un
    expect: on en a 21

  # Fails closed. No Accessibility, no window, a path that never had an app —
  # running anyway would put a terminal-only stage everywhere else, which is
  # the opposite of what asking for `app:` means.
  - name: no app at all, so an app-conditioned stage does not run
    pipeline: apps
    input: on en a vingt et un
    expect: unchanged

  # --- exclusion, with no not_app --------------------------------------
  # The negative lookahead is the whole reason `not_app:` does not exist. These
  # two are what says it works in both directions.
  - name: a negative lookahead keeps the stage out of a terminal
    pipeline: apps-excluded
    app: Ghostty
    input: on en a vingt et un
    expect: unchanged

  - name: and lets it run everywhere else
    pipeline: apps-excluded
    app: TextEdit
    input: on en a vingt et un
    expect: on en a 21

  # --- named tables, chosen by app ----------------------------------------
  # The same sentence, two outputs, decided by where it is going. Both steps
  # are in the pipeline and both conditions are evaluated; only one matches.
  - name: a table transform runs where its app matches
    pipeline: transforms
    app: Ghostty
    input: read user dot name
    expect: read user.name

  - name: the other app gets the other table
    pipeline: transforms
    app: Slack
    input: read user dot name
    expect: "read `user.name`"

  - name: an app matching neither gets neither
    pipeline: transforms
    app: Mail
    input: read user dot name
    expect: unchanged

  # The spoken word varies, not the language of the transcript, so the
  # alternation belongs in the pattern and not in a per-language pipeline.
  - name: point works as well as dot
    pipeline: transforms
    app: Ghostty
    input: lis user point name
    expect: lis user.name

  # `--replace` turns prompts off so it cannot reach the network. A table is
  # not a prompt, and holding it back would make the flag mean "no transforms".
  # It did mean that, until this was run against a real config.
  - name: a table still runs when prompts are off
    pipeline: transforms
    app: Ghostty
    no_prompts: true
    input: read user dot name
    expect: read user.name

  # --- an empty pipeline is a choice --------------------------------------
  - name: nothing listed, so nothing runs
    pipeline: empty
    input: super base has vingt et un users
    expect: unchanged

  # --- a prompt stage, wired but never scored -----------------------------
  # A prompt calls a model, so what it produces cannot be a fixed expectation.
  # These two ask the only questions that have one right answer: does the
  # condition decide, and is a prompt that cannot run survivable.

  - name: the condition keeps the prompt out of the way
    pipeline: prompt
    input: on en a vingt et un
    expect: on en a 21

  # The condition holds, the prompt is named, and no such prompt exists. The
  # stage must give the transcript back rather than empty it — the same
  # contract as Ollama being absent, which is an ordinary state here.
  #
  # "genre" survives, and that is the assertion: the word the prompt would have
  # removed is still there, so what came back is the transcript and not a
  # half-finished rewrite. An expectation of "on en a 21" would have passed
  # only if something else had quietly deleted it.
  - name: a prompt that cannot run returns the transcript
    pipeline: prompt
    input: on en a genre vingt et un
    expect: on en a genre 21

  # --- from the code review -----------------------------------------------
  # A prompt stage must not touch a wake-phrase utterance. It runs inside
  # transcription, before anything has looked for the phrase, so a rewrite
  # would eat "hey parrot" and what should have run as a command would be
  # pasted into the document instead.
  - name: a prompt never rewrites a spoken command
    pipeline: prompt
    input: hey parrot, make that a bullet list
    expect: unchanged

  # --- a transform that is somebody else's program -------------------------
  # The third body kind. `shout` proves the transcript reaches stdin and comes
  # back from stdout; `broken` (exits 3) and `silent` (says nothing) run
  # straight after it and must leave what it produced alone. A command that
  # fails is an ordinary state — a script half-written, an interpreter missing
  # — and a dictation tool cannot answer it by dropping the transcript.
  - name: a command transform rewrites through stdin and stdout
    pipeline: command
    input: read user dot name
    expect: READ USER DOT NAME

  # Same path with accents, because the transcript crosses a pipe as bytes and
  # `tr` is the stage most likely to mangle them.
  - name: a command transform keeps what it was given intact
    pipeline: command
    input: la réunion a duré très longtemps
    expect: LA RÉUNION A DURÉ TRÈS LONGTEMPS

  # A bare relative path, resolved against the directory of the file that
  # declared it — the fixture here, config.yaml in a real install. The script
  # is examples/transforms/code_identifiers/code_identifiers.py, whose own set is examples/transforms/code_identifiers/cases.yaml;
  # what this case adds is that the app finds it and hands it the transcript.
  - name: a command transform finds a script beside the file that names it
    pipeline: command-relative
    input: add a python function called max retries that returns the count
    expect: add a python function called max_retries that returns the count

  # The shebang picks the interpreter, and it does nothing without an execute
  # bit. Committed without one, so this stays true.
  - name: a command that cannot be executed leaves the transcript alone
    pipeline: command-unrunnable
    input: read user dot name
    expect: unchanged

  # EOF on stdout is not the same event as the process exiting, and treating
  # them as one meant a command could close its output, keep running, and hold
  # the pipeline for as long as it liked.
  - name: a command that closes stdout and keeps running gives up on time
    pipeline: command-hangs
    input: read user dot name
    expect: unchanged

  # A space in the path — in the directory the config lives in, and in the
  # relative path itself. Both reached /bin/sh unquoted and were split into a
  # program and an argument.
  - name: a command path with a space in it still runs
    pipeline: command-spaces
    input: read user dot name
    expect: READ USER DOT NAME

  # Two seconds is right for a script and wrong for one that asks a model, so
  # the limit is a per-transform setting. Without it this comes back untouched.
  - name: a command can be given longer than the default two seconds
    pipeline: command-patient
    input: read user dot name
    expect: READ USER DOT NAME

  # --- variables ------------------------------------------------------------
  #
  # `expect_vars` asserts on the scope rather than on the sentence, which is the
  # only way to score a stage whose whole contribution is a fact. Each entry has
  # to appear in the `--vars` listing with that exact value; a case that names no
  # variables is unaffected.
  #
  # What is being scored here is the machinery, not the stages — the fixtures use
  # a script that publishes whatever its flags say, so a failure is about the
  # carrying and never about whether some transform changed its mind.

  # Every namespace present at the end, including the two that ran before the
  # ones that published last. This is carry-through in its plainest form: four
  # stages, and the first one's facts are still readable after the other three.
  - name: every stage's variables survive the stages after it
    pipeline: vars
    input: super base has vingt et un users
    expect: Supabase has 21 users
    expect_vars:
      replacements.count: 1
      replacements.changed: true
      numbers.language: fr
      numbers.changed: true
      first.count: 2
      second.count: 7
      second.label: kept

  # The same run, read from the far side of a pipe. `first` reports what it found
  # at `replacements.count` and `second` reports what it found at `first.count`,
  # so a pass here means the scope reached two separate scripts — not merely that
  # it survived in Swift, which every other case in this section would also show.
  - name: a script sees what the stages above it published
    pipeline: vars
    input: super base has vingt et un users
    expect: Supabase has 21 users
    expect_vars:
      first.saw: 1
      second.saw: 2

  # And the same pipeline on a sentence the table does not touch, so the numbers
  # a script reads are the ones this run produced rather than any run's.
  - name: what a script sees is this transcript's, not the last one's
    pipeline: vars
    input: nothing here matches
    expect: unchanged
    expect_vars:
      replacements.count: 0
      first.saw: 0
      second.saw: 2

  # Both halves of the rule, in one pipeline. `counter` runs twice: `count` is
  # republished and the later value wins; `label` is written only by the first
  # run and has to survive the second one saying nothing about it.
  - name: a stage run twice overrides its own variables
    pipeline: vars-override
    input: read user dot name
    expect: unchanged
    expect_vars:
      counter.count: 2
      counter.label: first-run

  # The stage in between is untouched by either run of `counter`, and its own
  # namespace is untouched by them. A stage writes under its own name and
  # nowhere else — there is no way to spell otherwise, which is the point.
  - name: one stage's variables do not reach another's namespace
    pipeline: vars-override
    input: read user dot name
    expect: unchanged
    expect_vars:
      quiet.count: 9
      quiet.changed: false

  # A condition reading a variable rather than the text. The table fires, so
  # `replacements.count` is 1, so the stage gated on it being 0 stands down.
  - name: a stage stands down because an earlier stage already did the work
    pipeline: vars-conditions
    app: Ghostty
    input: super base is down
    expect: Supabase is down
    expect_vars:
      first.saw: 1
      second.ran: false

  # The same pipeline, the other branch. Nothing for the table to do, so the
  # gated stage runs.
  - name: and runs when the earlier stage found nothing to do
    pipeline: vars-conditions
    app: Ghostty
    input: nothing here matches
    expect: unchanged
    expect_vars:
      first.saw: 0
      second.ran: true
      second.count: 42

  # `app` and `language` are in the scope before any stage runs, so a condition
  # can read them by name. Ghostty, so the stage that excludes terminals stands
  # down — written as a real negation rather than as the anchored negative
  # lookahead the `app:` key would have needed.
  - name: a condition reads the seeded app and language
    pipeline: vars-conditions
    app: Ghostty
    input: nothing here matches
    expect: unchanged
    expect_vars:
      third.ran: false

  - name: and the same condition lets it run in an editor
    pipeline: vars-conditions
    app: Zed
    input: nothing here matches
    expect: unchanged
    expect_vars:
      third.ran: true
      third.count: 7

  # The three ways a structured stage does not work. All three keep the
  # transcript; all three stay distinguishable afterwards.
  - name: a stage that printed prose is marked as having failed
    pipeline: vars-failure
    input: read user dot name
    expect: unchanged
    expect_vars:
      broken.ok: false
      broken.changed: false

  - name: a stage that exited non-zero is marked the same way
    pipeline: vars-failure
    input: read user dot name
    expect: unchanged
    expect_vars:
      second.ok: false

  # Returning no `text` is not a failure. It is a stage saying it looked and
  # left the sentence alone, which is why `text` is optional in the reply — and
  # it has to be told apart from the two above it.
  - name: a stage that returns variables and no text is not a failure
    pipeline: vars-failure
    input: read user dot name
    expect: unchanged
    expect_vars:
      quiet.ok: true
      quiet.changed: false
      quiet.count: 5

  # A skipped stage gets `ran: false` and nothing else. No `ok`, no `changed` —
  # inventing them would let `first.ok` read true for a stage that never
  # happened.
  - name: a skipped stage reports that it did not run
    pipeline: vars-skipped
    app: Zed
    input: read user dot name
    expect: READ USER DOT NAME
    expect_vars:
      first.ran: false

  # A command with no `returns:` speaks the old contract and knows nothing about
  # any of this, and still gets the derived variables — so a script written
  # before variables existed is still something a later stage can gate on.
  - name: a plain stdin-to-stdout command still gets the derived variables
    pipeline: vars-skipped
    app: Zed
    input: read user dot name
    expect: READ USER DOT NAME
    expect_vars:
      quiet.ran: true
      quiet.ok: true
      quiet.changed: true

# Pipelines that must not load at all.
#
# Scored separately because the property is different: these never reach a
# transcript, and what is being checked is that `--check-config` says the useful
# thing rather than that some stage did something. `expect_problem` is a
# substring — the whole message is prose and would tie a case to its wording.
refused:
  - name: a condition reading a stage that runs later is refused
    pipeline: reads-later-stage
    expect_problem: runs *after* this stage

  - name: a condition naming a stage nothing declares is refused
    pipeline: reads-unknown-stage
    expect_problem: nothing in this pipeline is called "cod_identifiers"

  - name: the old bare-word condition is refused, and told what to write
    pipeline: bare-word
    expect_problem: 'write it as a pattern: /genre/'

  - name: an expression that does not parse is refused at load
    pipeline: bad-syntax
    expect_problem: is not part of this language

  - name: a transform named after the transcription metadata is refused
    pipeline: reserved-name
    expect_problem: would file its variables where asr already is

  # The shipped script, speaking the protocol, with the stage below it gated on
  # what it published. A sentence it takes:
  - name: the shipped transform publishes what it converted
    pipeline: vars-shipped
    input: a python function called max retries
    expect: a python function called max_retries
    expect_vars:
      code_identifiers.count: 1
      code_identifiers.asked_model: false
      dotted.ran: false

  # And one it declines, which is what lets the stage below it have a turn.
  - name: and stands aside for the next stage when it converted nothing
    pipeline: vars-shipped
    input: read user dot name
    expect: read user.name
    expect_vars:
      code_identifiers.count: 0
      dotted.ran: true
      dotted.changed: true
