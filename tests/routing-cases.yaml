# Routing validation set. Run with scripts/check-routing.sh.
#
# One instruction in, one capability name out — or ANY, or NONE. Written the way
# the sentences actually arrive, which is with the routing word buried in a
# longer request, because that is the case the router has to get right.
#
# The expectations assume the catalogue in config.example.yaml: bullets, terse,
# grammar, email, slack, and the built-ins. `slack_handles` and `slack_mentions`
# are tables, so they reach the router not at all — what selects them is the
# word "mention" inside a sentence, which is a substitution, not a routing
# decision.
#
# `--route` reads your own config, so a machine with a different list will
# disagree with this set,
# and rightly — it is scoring a router against a list, and the list is part of
# the question.
#
# Three answers since free_form, and the third is what made the first two
# honest. NONE used to carry two meanings, "no tool does this" and "that was
# not an edit", and it was only ever tested on the second. ANY takes the first,
# so a real request nothing covers now has somewhere to go.
#
# The negative cases are not padding. Without them a router scores well by
# routing everything somewhere, and the failure that costs you real text is
# exactly that: a sentence that meant nothing in particular, confidently sent
# to a prompt that rewrites your selection. That risk went up when ANY arrived,
# not down, which is why there are more of them now than tools.
#
# 47/52 on gemma4:e4b, on a catalogue of five prompts. It was 41/45 on three.
#
# Four of the five that fail fail cheaply, which is why they are left standing
# rather than argued with:
#
#     format those dates ISO                     -> grammar
#     format those dates with slashes            -> grammar
#     fix the numbers                            -> grammar
#     fix the numbers but leave the years alone  -> grammar
#
# They are the residue of removing `dates` and `digits`: grammar is now the
# only entry that mends anything, so "fix the ..." lands on it. It runs a prompt
# whose every rule is against touching a number, so the cost is a no-op you can
# see in the preview, not a rewrite. Five descriptions and a second ANY example
# were measured against these; the notes are in Router.swift.
#
# This family moves with the size of the list rather than with any one entry in
# it. "format those dates with slashes" passed with six prompts in the
# catalogue and fails with five, and nothing about dates changed in between —
# worth knowing before reading a one-case swing here as a regression in
# whatever was added or removed that day.
#
# The fourth is the expensive kind and is new:
#
#     I sent her an email yesterday              -> email
#
# A sentence, not an instruction, routed to a prompt that would rewrite your
# selection. It is the trap "I bought a box of bullets" and "her grammar is
# better than mine" set for the older entries, and those two pass — so this is
# a gap this catalogue opened, not a floor the model always had. Four
# descriptions were measured against it and every one routed it the same way,
# which says the description is not what decides it. The preview is what stands
# between this and a lost selection.

cases:
  # --- named outright: should never reach the model -----------------------
  - instruction: bullets
    expect: bullets
  - instruction: terse
    expect: terse
  - instruction: spelling
    expect: spelling

  # --- plain requests ------------------------------------------------------
  - instruction: make that a bullet list
    expect: bullets
  - instruction: turn this into bullet points
    expect: bullets
  - instruction: break that up into a list
    expect: bullets
  - instruction: shorten this
    expect: terse
  - instruction: make it shorter
    expect: terse
  - instruction: cut this down a bit
    expect: terse
  - instruction: tighten that up
    expect: terse

  # --- the instruction carries an argument ---------------------------------
  # The router must ignore the detail and route on the request. The detail is
  # for the prompt, and these are the cases where a router that tries to parse
  # starts guessing.
  - instruction: make that a bullet list but keep the headings
    expect: bullets
  - instruction: shorten it but do not touch the first sentence
    expect: terse

  # --- a real edit, and no prompt for it -----------------------------------
  # The cases free_form exists for. The first six were `dates` and `digits`
  # before those prompts were removed; the built-in beat them on their own
  # validation cases, so the instructions stayed and the expectation moved.
  #
  # These are the expensive direction to fail in now. An ANY sent to NONE is a
  # refusal, and you say it again; an ANY sent to a *prompt* is the wrong
  # rewrite, which is why "fix the numbers" is here and not quietly dropped.
  - instruction: format those dates ISO
    expect: ANY
  - instruction: format those dates with slashes
    expect: ANY
  - instruction: rewrite the dates as day month year
    expect: ANY
  - instruction: fix the numbers
    expect: ANY
  - instruction: fix the numbers but leave the years alone
    expect: ANY
  - instruction: write the numbers as digits except the ones in the quote
    expect: ANY
  - instruction: use the 24 hour clock
    expect: ANY
  - instruction: make sure the amounts are formatted as money
    expect: ANY
  - instruction: sort that list alphabetically
    expect: ANY
  - instruction: make it title case
    expect: ANY
  - instruction: convert that to metric
    expect: ANY
  - instruction: take the parentheses out
    expect: ANY

  # --- grammar, which competes with everything -----------------------------
  # "fix the X" now names three different capabilities depending on X, which
  # is the sharpest discrimination the catalogue asks for.
  - instruction: fix the grammar
    expect: grammar
  - instruction: fix the punctuation
    expect: grammar
  - instruction: clean up the punctuation
    expect: grammar
  - instruction: add the missing commas
    expect: grammar
  - instruction: correct that sentence
    expect: grammar
  - instruction: fix the grammar but leave my wording alone
    expect: grammar

  # --- built-ins -----------------------------------------------------------
  - instruction: Tasmin spells T A S M E E N
    expect: spelling
  - instruction: Vercel is spelled V E R C E L
    expect: spelling
  - instruction: Nguyen spells N G U Y E N not when
    expect: spelling
  - instruction: fix vocabulary
    expect: vocabulary
  - instruction: open the correction panel
    expect: vocabulary
  - instruction: let me fix that word myself
    expect: vocabulary

  # --- must not route ------------------------------------------------------
  - instruction: what is the weather tomorrow
    expect: NONE
  - instruction: remind me to call the bank
    expect: NONE
  - instruction: play some music
    expect: NONE
  - instruction: how much is a flight to Lisbon
    expect: NONE

  # --- must not route, and shares words with a capability ------------------
  # The trap. Each of these contains a routing word while asking for something
  # no capability does, which is how a router that matches on vocabulary rather
  # than on intent gets caught.
  - instruction: I bought a box of bullets
    expect: NONE
  - instruction: what date is the retro
    expect: NONE
  - instruction: how many bullet points did I write yesterday
    expect: NONE
  - instruction: read that number back to me
    expect: NONE
  - instruction: her grammar is better than mine
    expect: NONE
  # Same trap, for the three window-scoped prompts. The first one fails: it is
  # routed to `email`, and it is a sentence, not an instruction. Four
  # descriptions were tried against it — "lay dictated text out as an email",
  # "format the selected text as an email", "lay this out as an email, greeting
  # and paragraphs", "put this into email shape" — and all four routed it
  # identically, so the description is not what decides this one. Left failing.
  - instruction: I sent her an email yesterday
    expect: NONE
  - instruction: did you see my slack message
    expect: NONE
  - instruction: he never mentions it
    expect: NONE

  # --- the three prompts scoped to a window --------------------------------
  # `email` and `slack` run from a pipeline behind `app:`, but they are prompts,
  # so the phrase reaches them too. `slack_handles` and `slack_mentions` are
  # tables and are reachable no way but a pipeline, so they are not in here —
  # what routes them is the word "mention" inside the sentence, which is not a
  # routing question at all. The two neighbours worth watching are terse and
  # slack — "shorten this" against "tidy that up for chat" — and they hold.
  - instruction: write an email
    expect: email
  - instruction: make that an email
    expect: email
  - instruction: make that a slack message
    expect: slack
  - instruction: tidy that up for chat
    expect: slack
