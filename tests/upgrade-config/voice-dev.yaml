version: 2

models:
  gpt:
    api: openai
    model: gpt-5.6-luna
    endpoint: https://api.openai.com/v1
    api_key: file:~/.config/example/openai.key
    default: true
  claude:
    api: anthropic
    model: claude-sonnet-5
    api_key: file:~/.config/example/anthropic.key

claude:
  enabled: false
  model: gpt
