# Invented config from the `interpret:` days.
version: 5

transcription:
  languages: [en, fr]
  pipeline:
    - transform: sentence_repair
    - transform: grammar
      when: language == "en"

transforms:
  - name: grammar
    description: fix grammar
    replace:
      "the": ['teh']

  # Sentence marks a pause wrote, taken out again. Reads the parse and the
  # readings and calls no model. See docs/pipelines.md.
  - name: sentence_repair
    description: repair sentence boundaries a pause cut
    command: built-in/sentence_repair/sentence_repair.py

# Speaks what your coding agents do and what they answer, with PocketTTS on
# this Mac. true turns it on: the app writes Claude Code's hooks at launch,
# and open sessions need one restart. false removes them. See
# docs/configuration.md.
voice:
  enabled: false
  agents:                # an agent left out is off
    claude:              # empty: ~/.claude. Or a folder, or a list
    # codex:             # empty: $CODEX_HOME, then ~/.codex. Approve its hooks under /hooks
    # mini:              # no folder; needs the parrotflow-mini plugin
  local_voices: [alba, george, jane, michael, eve, paul]  # PocketTTS, one per session
  # A remote voice instead of PocketTTS: a name under models:, such as
  # remote-voice there. Voice names come from its provider.
  # speech: remote-voice
  # speech_voices: [Achird, Sulafat, Zubenelgenubi, Callirrhoe, Umbriel, Aoede]
