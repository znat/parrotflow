# Invented. Two transforms written as one-line flow mappings, the key to drop
# first in one of them, and one under the old `prompts:` key. All three lose
# the values the example wrote.
version: 4
transcription:
  pipeline: [{transform: sentence_repair}, {transform: disfluency}, {transform: dates}]

transforms:
  - {name: sentence_repair, description: repair sentence boundaries a pause cut, command: built-in/sentence_repair/sentence_repair.py}
  - {name: disfluency, description: delete hesitations, command: built-in/disfluency/disfluency.py}

prompts:
  - name: dates
    description: dictated dates as digits
    command: built-in/dates/en.py

# Speaks what your coding agents do and what they answer, with PocketTTS on
# this Mac. true turns it on: the app writes Claude Code's hooks at launch,
# and open sessions need one restart. false removes them. See
# docs/configuration.md.
voice:
  enabled: false
  agents:                # an agent left out is off
    claude:              # empty: ~/.claude. Or a folder, or a list
    # codex:             # empty: $CODEX_HOME, then ~/.codex. Approve its hooks under /hooks
    # mini:              # no folder; needs the parrotflow-mini plugin
  local_voice: alba      # a PocketTTS voice
  # speech: openrouter-tts  # a remote voice under models: instead of PocketTTS
