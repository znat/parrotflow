# One word of a dictation changed by hand, or something that is not that.
#
# expect: "<was> -> <now>"   the one span that changed
# expect: none               a rewrite, two edits, or nothing worth learning
# offer:  yes | no, <why>    whether the panel opens on it; optional, and one
#                            per span when there are several
# heard:  <a>..<b> in "…"    the window and range written to the trace; optional
# lang:   en | fr            what the pipeline resolved; optional, en by default
# learn:  Learn? “…”         the line the pill draws; optional
#
# The strict half matters more than the generous one. A rewrite read as a
# correction teaches a term a sentence nobody meant, and a portrait built on
# that is worse than no portrait.

cases:
  - written: the Vercel Castle is closed today
    now:     the Versailles Castle is closed today
    expect:  "Vercel -> Versailles"

  - written: I use Ghost D as a terminal app
    now:     I use Ghostty as a terminal app
    expect:  "Ghost D -> Ghostty"

  - written: Praise has done great work
    now:     Praisy has done great work
    expect:  "Praise -> Praisy"

  - written: The corridor felt Ghostty in the fog
    now:     The corridor felt ghostly in the fog
    expect:  "Ghostty -> ghostly"

  # The word is at the very end, where there is no suffix to anchor on.
  - written: I forwarded the contract to Soundman
    now:     I forwarded the contract to Salman
    expect:  "Soundman -> Salman"

  # And at the very start.
  - written: Prezi joined the team in March
    now:     Praisy joined the team in March
    expect:  "Prezi -> Praisy"

  # Nothing changed.
  - written: the mic is plugged in
    now:     the mic is plugged in
    expect:  none

  # A different sentence altogether.
  - written: hello there
    now:     goodbye everyone and thanks for the fish
    expect:  none

  # Two words corrected in one edit, which is how anybody corrects a sentence
  # they have already finished reading.
  - written: Prezi told Ghostty to restart the crawler tonight
    now:     Praisy told Ghostty to restart the indexer tonight
    expect:  "Prezi -> Praisy | crawler -> indexer"

  # Two names in one line, the case that sent this whole comparison back to be
  # rewritten: the ends measure said the line had left the screen.
  - written: So we have Prezi in our team. She is an expert about the versal platform.
    now:     So we have Praisy in our team. She is an expert about the Vercel platform.
    expect:  "Prezi -> Praisy | versal -> Vercel"

  # The same wrong word twice, corrected to two different names. Both are
  # reported, so the place and not the word is what names a correction.
  - written: Prezi and Prezi are different people
    now:     Praisy and Preston are different people
    expect:  "Prezi -> Praisy | Prezi -> Preston"

  # A phrase replaced by another. There is no telling which part was meant.
  - written: I use Ghostty as a terminal app
    now:     I use the other one as a terminal app
    expect:  none

  # A word deleted rather than replaced. It says where a term does not belong
  # without saying what belongs there, so there is nothing to learn from it.
  - written: I use Ghostty as a terminal app
    now:     I use as a terminal app
    expect:  none

  # Typing after the dictation is not a correction of it.
  - written: We deploy on Vercel
    now:     We deploy on Vercel every Friday
    expect:  none

  # A terminal draws a prompt at the head of the line being typed. It is not a
  # word, and taking it for one corrected `❯ Prizzy` to `❯ Praizy`.
  - written: "❯ Prizzy isn't the team. She's an expert in versatile deployments."
    now:     "❯ Praizy isn't the team. She's an expert in Vercel deployments."
    expect:  "Prizzy -> Praizy | versatile -> Vercel"

  # Two dictations that ran together have no space between them, so the whole
  # glued run is one "word" and the whole run was offered as the rule. Only the
  # letters that changed belong in it.
  - written: "I like it.Ghost T is my terminal"
    now:     "I like it.Ghostty is my terminal"
    expect:  "Ghost T -> Ghostty"
    heard:   '10..<17 in "I like it.Ghost T is my terminal"'

  # The same at the other end.
  - written: "the ghostly, terminal"
    now:     "the Ghostty, terminal"
    expect:  "ghostly -> Ghostty"

  - written: "I use Ghost E."
    now:     "I use Ghostty."
    expect:  "Ghost E -> Ghostty"

  # Only punctuation comes off, never letters. `Prizzy` and `Praizy` share "Pr"
  # and "zy"; cutting those would offer "iz -> aiz", which nobody said.
  - written: "hello Prizzy there"
    now:     "hello Praizy there"
    expect:  "Prizzy -> Praizy"

  # A stop inside a word is not a sentence end.
  - written: "we run Node.js and Gwen"
    now:     "we run Node.js and Qwen"
    expect:  "Gwen -> Qwen"
    offer:   "yes"

  # From the log, 2026-09-02. Two dictations ran together, and the first was
  # repaired by putting a word back. The shared tail `.maybe` is the next
  # sentence, not the correction; and what is left lands on two ordinary
  # words, which the glued-together lookup `pronepoint` used to call a name.
  - written: "❯ It is error prone.maybe it is fine"
    now:     "❯ It is error prone point.maybe it is fine"
    expect:  "prone -> prone point"
    offer:   "no, ordinary English"

  # Punctuation alone. Both from the log.
  - written: "keep the diff small."
    now:     "keep the diff small"
    expect:  "small. -> small"
    offer:   "no, punctuation, not a name"

  - written: "(before offering vocabulary options."
    now:     "(before offering vocabulary options.)"
    expect:  "options. -> options.)"
    offer:   "no, punctuation, not a name"

  # Two corrections in one line, one onto a name and one onto a word the
  # lists know.
  - written: "We have e speak and we have a fluid audio model."
    now:     "We have espeak and we have a FluidAudio model."
    expect:  "e speak -> espeak | fluid audio -> FluidAudio"
    offer:   "yes | yes"

  - written: "the idiots are detected before submitting"
    now:     "the edits are detected before submitting"
    expect:  "idiots -> edits"
    offer:   "no, ordinary English"

  - written: "say point instead"
    now:     "say dot instead"
    expect:  "point -> dot"
    offer:   "no, ordinary English"

  - written: "we compare Ribrovent with Dorselex"
    now:     "we compare Rybrevant with Darzalex"
    expect:  "Ribrovent -> Rybrevant | Dorselex -> Darzalex"
    offer:   "yes | yes"

  # A word the dictionary knows, made a name by its capital mid-sentence.
  - written: "errors go to century"
    now:     "errors go to Sentry"
    expect:  "century -> Sentry"
    offer:   "yes"

  # The capital that opens a sentence says nothing about the word.
  - written: "Fais attention. Fais le maintenant"
    now:     "Fais attention. Et le maintenant"
    expect:  "Fais -> Et"
    offer:   "no, ordinary English"

  # One name in the span is enough.
  - written: "I met Prezi yesterday"
    now:     "I met Praisy Dupont yesterday"
    expect:  "Prezi -> Praisy Dupont"
    offer:   "yes"

  # A reword, 2026-09-03: two words put in for one. Glued to `forinstance`
  # no list knew it, and the panel offered it as a name.
  - written: "a thing to see or two"
    now:     "a thing to, see for instance. two"
    expect:  "to -> to, | or -> for instance."
    offer:   "no, punctuation, not a name | no, ordinary English"

  - written: "the model can hear what Drew said"
    now:     "the model can say what a drew said"
    expect:  "hear -> say | Drew -> a drew"
    offer:   "no, ordinary English | no, ordinary English"

  - written: "we count BRAM"
    now:     "we count bigram"
    expect:  "BRAM -> bigram"
    offer:   "no, ordinary English"

  # The window is twelve words either side, clipped to the line, and the
  # prompt is not a word. The range is the heard word in that window.
  - written: "❯ one two three four five six seven eight nine ten eleven twelve thirteen the backgrounds are, counted here and more"
    now:     "❯ one two three four five six seven eight nine ten eleven twelve thirteen the bigrams are, counted here and more"
    expect:  "backgrounds -> bigrams"
    offer:   "no, ordinary English"
    heard:   '68..<79 in "three four five six seven eight nine ten eleven twelve thirteen the backgrounds are, counted here and more"'

  # Typing a name after a word is not a correction of that word. `morning`
  # became `morning Tasmeen` and it was offered as a vocabulary rule.
  - written: "I said it this morning."
    now:     "I said it this morning Tasmeen."
    expect:  none

  - written: "said morning, and left"
    now:     "said morning Tasmeen, and left"
    expect:  none

  # Nor is pasting into the line. This one glues to the word before it, so it
  # is one word becoming one word and looks like a correction.
  - written: "a word in the dictation."
    now:     "a word in the dictation.[Image #17]"
    expect:  none

  # Typing that runs straight on from a stop, with no space to mark it. From
  # the log, 2026-09-05: one keystroke landed after the dictation and the whole
  # word was offered as a rule.
  - written: "❯ I mean the term that is Potentially to be removed."
    now:     "❯ I mean the term that is Potentially to be removed.x"
    expect:  none

  # The typed text ends on a stop too, so both readings do and the mark comes
  # off both before the test. It is then at the head of what was added.
  - written: "to be removed."
    now:     "to be removed.Hello."
    expect:  none

  # The mark changed in the same edit that added the text. From the log,
  # 2026-09-06: the stop became a colon and a URL was pasted after it. The two
  # runs no longer end on the same mark, so each end is stripped on its own.
  - written: "❯ take a look at the rebase."
    now:     "❯ take a look at the rebase: https://claude.ai/code/session_01WdUvRN"
    expect:  none

  # The mark alone, with nothing added, is still a change and still refused.
  - written: "take a look at the rebase."
    now:     "take a look at the rebase:"
    expect:  "rebase. -> rebase:"
    offer:   "no, punctuation, not a name"

  # A word typed after a name that ends on a stop.
  - written: "we deploy on Vercel."
    now:     "we deploy on Vercel Cloud."
    expect:  none

  # The same at the other end: a sentence typed in front of the word.
  - written: "we run Ghostty"
    now:     "we run Fine.Ghostty"
    expect:  none

  # Punctuation added after a stop is still a change, and still refused for
  # being punctuation. The letters are what make an addition an addition.
  - written: "keep it small."
    now:     "keep it small.)"
    expect:  "small. -> small.)"
    offer:   "no, punctuation, not a name"

  # But a word that grows is still a correction, and so is one that splits.
  - written: "it is Ghost here"
    now:     "it is Ghostty here"
    expect:  "Ghost -> Ghostty"

  - written: "ask Praisy today"
    now:     "ask Praisy's today"
    expect:  "Praisy -> Praisy's"

# One word in another form is not a pronunciation. Two forms of one French
# verb are homophones, so the sound rule scores them 1.00 and overrules the
# word lists. `passez` -> `passé` was offered as a rule on 2026-09-08.
  - written: "Hello, passez un bon week-end."
    now:     "Hello, passé un bon week-end."
    expect:  "passez -> passé"
    lang:    fr
    offer:   "no, the same word in another form"

  # Number, by the same lemma. The rule is not about verbs — one test covers
  # tense, gender and number. From the trace, 2026-09-04.
  - written: "how many user are on the plan"
    now:     "how many users are on the plan"
    expect:  "user -> users"
    offer:   "no, the same word in another form"

  # Gender.
  - written: "c'est une grand maison"
    now:     "c'est une grande maison"
    expect:  "grand -> grande"
    lang:    fr
    offer:   "no, the same word in another form"

  # An irregular plural, where no ending rule would reach it.
  - written: "the mouse are in the trap"
    now:     "the mice are in the trap"
    expect:  "mouse -> mice"
    offer:   "no, the same word in another form"

  # A capitalised form mid-line never reaches the word test, so the refusal has
  # to be asked over the accept as well.
  - written: "Je disais. Passez un bon week-end."
    now:     "Je disais. Passé un bon week-end."
    expect:  "Passez -> Passé"
    lang:    fr
    offer:   "no, the same word in another form"

  # Nothing was replaced — a mark was typed beside the word. `mask` ->
  # `mask (___)` was offered as a rule on 2026-09-08: the whole addition is
  # punctuation, and `added` strips that off both readings before comparing,
  # so it saw one word twice and no addition.
  - written: "What if we mask with a neutral term? Like a mask."
    now:     "What if we mask with a neutral term? Like a mask (___)."
    expect:  none

  # A space typed on the end is the same shape and equally not a correction.
  - written: "he plays the guitar"
    now:     "he plays the guitar "
    expect:  none

  # But a mark typed straight onto the word still changes it, and is refused
  # for being punctuation rather than dropped. No space, nothing beside it.
  - written: "keep it small"
    now:     "keep it small."
    expect:  "small -> small."
    offer:   "no, punctuation, not a name"

  # And the span the decoder split still reaches the offer. Trimming the ends
  # must not reach the space in the middle.
  - written: "we run the red crawl every night"
    now:     "we run the Redcrawl every night"
    expect:  "red crawl -> Redcrawl"
    offer:   "yes"

  # The control the rule must not touch: a mishearing onto an ordinary word,
  # which is the whole reason the sound rule exists. Neither word has a lemma,
  # so the two readings cannot share one.
  - written: "there is a lot of borderplay in this file"
    now:     "there is a lot of boilerplate in this file"
    expect:  "borderplay -> boilerplate"
    offer:   "yes, ordinary English but it sounds like it"

  # The pill's window stops at the sentence. A field holding several dictations
  # runs them together with no space after the stop, so counting words alone
  # drew four sentences. Reported 2026-09-08.
  - written: "Erik likes individual sports. John is a painter.Jon is a musician."
    now:     "Erik likes individual sports. Jon is a painter.Jon is a musician."
    expect:  "John -> Jon"
    learn:   'Learn? “John Jon is a painter.”'

  # The change is the last word of its sentence, so the stop is on the pair
  # rather than in the words after it.
  - written: "I use Ghost. It is good today my friend."
    now:     "I use Ghostty. It is good today my friend."
    expect:  "Ghost -> Ghostty"
    learn:   'Learn? “I use Ghost Ghostty.”'

  # A stop inside a quotation still ends the sentence. Read as the plain next
  # character, a closing quote is neither a space nor a capital, and the whole
  # sentence in front was kept.
  - written: "He said “hello.” John is a painter."
    now:     "He said “hello.” Jon is a painter."
    expect:  "John -> Jon"
    learn:   'Learn? “John Jon is a painter.”'

  # And a closing bracket.
  - written: "We shipped it (finally.) John is a painter."
    now:     "We shipped it (finally.) Jon is a painter."
    expect:  "John -> Jon"
    learn:   'Learn? “John Jon is a painter.”'

  # A stop inside a number is not a sentence, so the window runs past it.
  - written: "the Prezi build took 3.5 seconds to finish"
    now:     "the Praisy build took 3.5 seconds to finish"
    expect:  "Prezi -> Praisy"
    learn:   'Learn? “the Prezi Praisy build took 3.5 seconds to …”'

  # And with no stop anywhere, the word count is still what cuts.
  - written: "one two three four five six seven Prezi eight nine ten eleven twelve"
    now:     "one two three four five six seven Praisy eight nine ten eleven twelve"
    expect:  "Prezi -> Praisy"
    learn:   'Learn? “… three four five six seven Prezi Praisy eight nine ten eleven twelve”'

# Not here: the input box between two rules, and a line wrapped onto a second
# row. Both are several lines of screen, and this set carries one case per line.
# `EditWatch.boxedInput` is what reads them, and it is exercised by hand.
