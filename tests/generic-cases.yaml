# Validation set for a *generic* transform — one prompt that takes any spoken
# instruction and applies it to the selected text. Run with
# scripts/validate-generic.py.
#
# The question it exists to answer: if the router matches nothing, can a single
# prompt on a small local model be trusted to just do what was asked? That
# would let the narrow prompts (digits, dates, punctuation) go away, and would
# cover the ones nobody wrote — money, units, clock times.
#
# Two halves, and the second is the important one.
#
#   change  the instruction asks for something and the text has it. The right
#           answer is the smallest edit that satisfies the instruction.
#   keep    the instruction does not apply — nothing in the text matches it,
#           it is already in the form asked for, or it is not an instruction
#           at all. The right answer is the text, byte for byte.
#
# `keep` is a third of the set on purpose. A generic prompt has no subject to
# anchor it, so the failure it invites is doing *something* to text that needed
# nothing — and unlike a narrow prompt there is no wrong-tool signal to catch
# it. A question reaching this path ("what does this even mean") must come back
# as the text, not as an answer to the question.
#
# `expect` is the answer. `accept` lists further answers that are equally
# right, and exists only where the instruction genuinely underdetermines the
# output (which month-first spelling, how many decimals in a conversion). It is
# not a place to forgive a model for changing more than it was asked to.
#
# Inputs are dictated or selected text, so they are informal and lowercase
# where a speaker would be. Several carry a second, unmentioned property —
# a missing capital, an informal contraction — that must survive untouched.

cases:
  # --- money ---------------------------------------------------------------
  - name: amounts as dollars
    kind: change
    category: money
    instruction: format the amounts as dollars
    input: hosting was 1200 and domains 340
    expect: hosting was $1,200 and domains $340
    accept:
      - hosting was $1200 and domains $340

  - name: spoken amount to money
    kind: change
    category: money
    instruction: make sure fifty dollars is formatted as money
    input: the licence costs fifty dollars a year
    expect: the licence costs $50 a year

  - name: thousands separator
    kind: change
    category: money
    instruction: write the amounts with a thousands separator
    input: the invoice came to $12500 and the refund was $2300
    expect: the invoice came to $12,500 and the refund was $2,300

  - name: euros, symbol after
    kind: change
    category: money
    instruction: put the amounts in euros with the symbol after the number
    input: 60 euros for the ticket and 12 euros for the seat
    expect: 60€ for the ticket and 12€ for the seat
    accept:
      - 60 € for the ticket and 12 € for the seat

  - name: round the amounts
    kind: change
    category: money
    instruction: round the amounts to whole dollars
    input: $14.27 for lunch and $3.60 for coffee
    expect: $14 for lunch and $4 for coffee

  - name: no money in the text
    kind: keep
    category: money
    instruction: format the amounts as money
    input: we should ship it on friday

  # --- dates ---------------------------------------------------------------
  - name: written date to ISO
    kind: change
    category: dates
    instruction: convert the date to ISO
    input: the deadline is March 3 2026
    expect: the deadline is 2026-03-03

  - name: day-first dates to ISO
    kind: change
    category: dates
    instruction: these dates are day first, write them ISO
    input: we met on 12/03/2025 and again on 05/01/2026
    expect: we met on 2025-03-12 and again on 2026-01-05

  - name: ISO to slashes
    kind: change
    category: dates
    instruction: write the dates with slashes, month first
    input: the retro is on 2026-04-09
    expect: the retro is on 04/09/2026
    accept:
      - the retro is on 4/9/2026

  - name: spell the month out
    kind: change
    category: dates
    instruction: spell the month out
    input: shipping 2026-01-15
    expect: shipping 15 January 2026
    accept:
      - shipping January 15, 2026
      - shipping January 15 2026

  - name: already ISO
    kind: keep
    category: dates
    instruction: make the dates ISO
    input: the release is 2026-02-01

  - name: no date in the text
    kind: keep
    category: dates
    instruction: convert the dates to ISO
    input: call the vendor about the invoice

  # --- digits — what the `digits` prompt does today ------------------------
  - name: spelled number to digits
    kind: change
    category: digits
    instruction: write the numbers as digits
    input: forty two people showed up
    expect: 42 people showed up

  - name: digits, years excepted
    kind: change
    category: digits
    instruction: write the numbers as digits but leave the years alone
    input: we hired twelve people in nineteen ninety eight
    expect: we hired 12 people in nineteen ninety eight

  - name: spoken decimal
    kind: change
    category: digits
    instruction: write the numbers as digits
    input: the ratio came out at three point one four
    expect: the ratio came out at 3.14

  - name: spoken year
    kind: change
    category: digits
    instruction: write that as digits
    input: it shipped in two thousand five
    expect: it shipped in 2005

  - name: already digits
    kind: keep
    category: digits
    instruction: write the numbers as digits
    input: 42 people showed up and 3 left early

  # --- punctuation and grammar — what the `grammar` prompt does today ------
  - name: contraction and full stop
    kind: change
    category: grammar
    instruction: fix the grammar and punctuation
    input: the panel dont show up sometimes
    expect: The panel doesn't show up sometimes.

  - name: agreement
    kind: change
    category: grammar
    instruction: fix the grammar and punctuation
    input: he dont know what the config does
    expect: He doesn't know what the config does.

  - name: fronted phrase takes a comma
    kind: change
    category: grammar
    instruction: fix the punctuation
    input: Before doing a full design spec lets explore a few possibilities
    expect: Before doing a full design spec, let's explore a few possibilities.

  - name: blunt but correct
    kind: keep
    category: grammar
    instruction: fix the grammar and punctuation
    input: It's a bit weird, but it works, and it works well, so leave it.

  - name: terse but correct
    kind: keep
    category: grammar
    instruction: fix the grammar and punctuation
    input: Okay, let's kill it.

  # --- case and shape ------------------------------------------------------
  - name: all caps
    kind: change
    category: case
    instruction: make that all caps
    input: ship it today
    expect: SHIP IT TODAY

  - name: capitalise product names only
    kind: change
    category: case
    instruction: capitalise the product names
    input: we use supabase and postgres for this
    expect: we use Supabase and Postgres for this

  - name: title case
    kind: change
    category: case
    instruction: make it title case
    input: a guide to local models
    expect: A Guide to Local Models
    accept:
      - A Guide To Local Models

  - name: slug
    kind: change
    category: case
    instruction: turn that into a file name slug
    input: Weekly Ops Review Notes
    expect: weekly-ops-review-notes

  # --- units and clock -----------------------------------------------------
  - name: inches to metric
    kind: change
    category: units
    instruction: convert that to metric
    input: the desk is 60 inches wide
    expect: the desk is 152 cm wide
    accept:
      - the desk is 152.4 cm wide
      - the desk is 1.52 m wide
      - the desk is 1.5 m wide
      # The input spells "inches" out, so spelling the unit out is the
      # faithful answer, not a looser one.
      - the desk is 152 centimeters wide
      - the desk is 152.4 centimeters wide

  - name: twelve hour to twenty four
    kind: change
    category: units
    instruction: use the 24 hour clock
    input: standup is at 9:30am and the review at 4pm
    expect: standup is at 09:30 and the review at 16:00
    accept:
      - standup is at 9:30 and the review at 16:00

  - name: already metric
    kind: keep
    category: units
    instruction: convert that to metric
    input: the desk is 150 cm wide

  # --- structural ----------------------------------------------------------
  - name: remove the parentheses
    kind: change
    category: structure
    instruction: remove the parentheses
    input: we shipped it (finally) on friday
    expect: we shipped it finally on friday

  - name: swap the names
    kind: change
    category: structure
    instruction: swap the two names round
    input: Nathan and Tasmeen are on call this week
    expect: Tasmeen and Nathan are on call this week

  - name: sort a list
    kind: change
    category: structure
    instruction: sort the list alphabetically
    input: pears, apples, cherries, bananas
    expect: apples, bananas, cherries, pears

  - name: one line
    kind: change
    category: structure
    instruction: put that on one line
    input: |-
      the build is green
      the tests pass
      ship it
    expect: the build is green the tests pass ship it
    accept:
      - the build is green, the tests pass, ship it

  - name: strip the trailing please
    kind: change
    category: structure
    instruction: drop the please at the end
    input: Explain your plan before implementing please.
    expect: Explain your plan before implementing.

  # --- not an instruction at all ------------------------------------------
  # The router used to absorb these by answering NONE. Under a generic
  # fallback they land here instead, which is the whole risk of the design.
  - name: a question about the text
    kind: keep
    category: idle
    instruction: what does this even mean
    input: the config file is at ~/.config/parrotflow

  - name: a remark sharing the vocabulary
    kind: keep
    category: idle
    instruction: I bought a box of bullets yesterday
    input: we should ship it on friday

  - name: a question about the world
    kind: keep
    category: idle
    instruction: what is the weather tomorrow
    input: the release is cut on the fifteenth

  - name: thinking out loud
    kind: keep
    category: idle
    instruction: we talked about the dates in the meeting
    input: the retro is on 2026-04-09

  # --- saying what you meant, instead of what to do ------------------------
  #
  # A correction is an instruction with the imperative taken out. "make it
  # Tuesday" and "I meant Tuesday" ask for the same edit, and the second is
  # what people actually say to a machine that has just written something down
  # for them — this is dictation, and the sentence before it was theirs.
  #
  # The negatives here are the whole reason the category exists. "I meant" is
  # not a marker: it introduces an edit only when it names the replacement.
  # Bare, it is a complaint, and there is nothing to act on in a complaint. A
  # prompt that reads the phrase as a signal rather than reading what follows
  # it will rewrite on a sentence that never asked for anything.
  - name: I meant, naming the replacement
    kind: change
    category: correction
    instruction: I meant Tuesday
    input: the meeting is on Monday
    expect: the meeting is on Tuesday

  - name: I wanted to say, naming the replacement
    kind: change
    category: correction
    instruction: I wanted to say Redcrawl
    input: we shipped Redrock last week
    expect: we shipped Redcrawl last week

  - name: a correction with the apology in front
    kind: change
    category: correction
    instruction: sorry I meant next Friday
    input: let's do it this Friday
    expect: let's do it next Friday

  - name: no, I meant
    kind: change
    category: correction
    instruction: no I meant three of them
    input: we ordered two of them
    expect: we ordered three of them

  - name: a complaint with no edit in it
    kind: keep
    category: correction
    instruction: this is not what I had in mind
    input: the migration runs on friday

  - name: I meant it, which is not a correction at all
    kind: keep
    category: correction
    instruction: I meant what I said in the review
    input: the config file is at ~/.config/parrotflow

  # --- 2026-10-05: requests, not only commands ----------------------------
  #
  # People talk to the open panel the way they talk to a colleague: "can you
  # improve the wording?". The recogniser hears that, sometimes with a word
  # wrong, and the text is often a whole message of several paragraphs.
  #
  # Broad edits ("improve the wording") have no one right answer, so they use a
  # third kind:
  #
  #   rewrite  the text must come back with at least one word changed (not
  #            only punctuation or case), with no fewer paragraphs
  #            than it had, at a length between a quarter and one and a half
  #            times the input (`min_ratio` and `max_ratio` override). Every
  #            string in `contains` must be there and none in `absent`,
  #            ignoring case. `contains` names the facts the message must
  #            keep, so a fluent rewrite that drops them fails.
  #
  # A narrow edit over a long text is still a `change` with an exact answer:
  # the rest of the message must come back as it was.

  # --- a polite question is a request -------------------------------------
  - name: can you, digits
    kind: change
    category: polite
    instruction: Can you write the numbers as digits?
    input: we booked nine rooms for the team
    expect: we booked 9 rooms for the team

  - name: could you, all caps
    kind: change
    category: polite
    instruction: Could you make that all caps?
    input: do not merge before friday
    expect: DO NOT MERGE BEFORE FRIDAY

  - name: would you mind, remove the brackets
    kind: change
    category: polite
    instruction: Would you mind removing the brackets?
    input: the demo (the short one) is at noon
    expect: the demo the short one is at noon

  - name: can you, fix the grammar and punctuation
    kind: change
    category: polite
    instruction: Can you fix the grammar and punctuation?
    input: the logs doesnt say why it failed
    expect: The logs don't say why it failed.

  - name: can you tell me, a question about the text
    kind: keep
    category: polite
    instruction: Can you tell me what this means?
    input: the cache is warmed on first launch

  - name: can you remind me, not an edit
    kind: keep
    category: polite
    instruction: Can you remind me to call the vendor tomorrow?
    input: the invoice is due at the end of the month

  # --- broad requests apply to the whole text ------------------------------
  - name: improve the wording
    kind: rewrite
    category: style
    instruction: Improve the wording.
    input: the thing with the build is that it is slow and that is a thing that we should look at doing something about soon
    absent:
      - is a thing that
    contains:
      - build
      - slow

  - name: fix the typos
    kind: rewrite
    category: style
    instruction: fix any typos
    input: I definately recieve the report every morning, but teh numbers are off.
    contains:
      - definitely
      - receive
      - the numbers
    absent:
      - definately
      - recieve
      - teh

  - name: more formal
    kind: rewrite
    category: style
    instruction: make it more formal
    input: hey folks, we're gonna push the launch to next week cuz the docs aren't ready
    max_ratio: 2.0
    absent:
      - gonna
      - cuz
    contains:
      - launch
      - next week
      - doc

  - name: friendlier
    kind: rewrite
    category: style
    instruction: Could you make it a bit friendlier?
    input: Send me the slides by 5. Late slides will not be shown.
    max_ratio: 2.0
    contains:
      - slides
      - "5"

  - name: shorter
    kind: rewrite
    category: style
    instruction: make it shorter
    input: I just wanted to let you all know that I am going to be out of the office for the whole of next week, and that during that time Priya will be the person to ask about anything to do with the billing project.
    min_ratio: 0.15
    max_ratio: 0.85
    contains:
      - next week
      - Priya
      - billing

  # --- the instruction was misheard ----------------------------------------
  # The recogniser swaps a word for one that sounds like it. When the heard
  # word does not fit the text and a near-sounding one does, the near one is
  # what was said.
  - name: improve the warning, meaning wording
    kind: rewrite
    category: misheard
    instruction: Can you improve the warning?
    input: the thing with the build is that it is slow and that is a thing that we should look at doing something about soon
    absent:
      - warning
      - is a thing that
    contains:
      - build
      - slow

  - name: fix the grandma, meaning grammar
    kind: change
    category: misheard
    instruction: fix the grandma and punctuation
    input: the tests dont pass on main
    expect: The tests don't pass on main.

  - name: numbers as dishes, meaning digits
    kind: change
    category: misheard
    instruction: write the numbers as dishes
    input: we need twelve chairs and three tables
    expect: we need 12 chairs and 3 tables

  - name: less worthy, meaning wordy
    kind: rewrite
    category: misheard
    instruction: make it less worthy
    input: I just wanted to let you all know that I am going to be out of the office for the whole of next week, and that during that time Priya will be the person to ask about anything to do with the billing project.
    min_ratio: 0.15
    max_ratio: 0.9
    contains:
      - next week
      - Priya
      - billing

  - name: a remark that sounds like a request
    kind: keep
    category: misheard
    instruction: I'm warning you, friday is going to be busy
    input: the retro moved to thursday afternoon

  # --- a message of several paragraphs -------------------------------------
  - name: paragraphs, digits only
    kind: change
    category: paragraphs
    instruction: write the numbers as digits
    input: |-
      Hi all, the spring hackathon is three weeks out and the sign-up sheet is open.

      Teams can be up to five people. Bring your own idea or pick one from the board in the kitchen.

      Demos are on the Friday afternoon, and each team gets ten minutes.
    expect: |-
      Hi all, the spring hackathon is 3 weeks out and the sign-up sheet is open.

      Teams can be up to 5 people. Bring your own idea or pick one from the board in the kitchen.

      Demos are on the Friday afternoon, and each team gets 10 minutes.

  - name: paragraphs, I meant
    kind: change
    category: paragraphs
    instruction: I meant Thursday
    input: |-
      Quick update on the library move.

      The movers come on Wednesday, so please box up your desk the evening before. Label every box with your name and floor.

      Thanks for your patience while we settle in.
    expect: |-
      Quick update on the library move.

      The movers come on Thursday, so please box up your desk the evening before. Label every box with your name and floor.

      Thanks for your patience while we settle in.

  - name: paragraphs, improve the wording
    kind: rewrite
    category: paragraphs
    instruction: Improve the wording.
    input: |-
      Hi team, so the release freeze is happening next week and it starts on Monday and it goes until the Thursday after.

      During the freeze nothing gets merged to main unless it is a fix for something that is broken, and if you are not sure, ask in the release channel first before you merge it.

      Thanks everyone.
    absent:
      - and it starts on monday and it goes
    contains:
      - Monday
      - Thursday
      - main
      - release

  - name: paragraphs, wording and typos as a question
    kind: rewrite
    category: paragraphs
    instruction: Can you improve the wording and fix any typo or grammatical error?
    input: |-
      Hi everyone, the team dinner is on the 14th and we has booked the back room at the noodle place on Elm street.

      Please let me know by friday if you can come, and tell me about any alergies so the kitchen can plan for it.

      See you their!
    contains:
      - 14th
      - Elm
      - Friday
      - allergies
      - "you there"
    absent:
      - we has
      - alergies
      - you their

  - name: paragraphs, misheard as warning
    kind: rewrite
    category: paragraphs
    instruction: Can you improve the warning?
    input: |-
      Hi team, so the release freeze is happening next week and it starts on Monday and it goes until the Thursday after.

      During the freeze nothing gets merged to main unless it is a fix for something that is broken, and if you are not sure, ask in the release channel first before you merge it.

      Thanks everyone.
    absent:
      - warning
      - and it starts on monday and it goes
    contains:
      - Monday
      - Thursday
      - main
      - release

  - name: paragraphs, a question about the message
    kind: keep
    category: paragraphs
    instruction: what time does the dinner start
    input: |-
      Hi everyone, the team dinner is on the 14th and we have booked the back room at the noodle place on Elm Street.

      Please let me know by Friday if you can come.

  - name: paragraphs, a remark
    kind: keep
    category: paragraphs
    instruction: thanks, that looks good
    input: |-
      Quick update on the library move.

      The movers come on Wednesday, so please box up your desk by the end of Tuesday.
