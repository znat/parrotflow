# What `VocabularyJudge.verdicts` reads out of a model's reply.
#
# Scored by scripts/check-verdicts.sh through `ParrotFlow --verdicts`.
#
# `count` is how many substitutions were put to the model. `expect` is one word
# per substitution, space separated. The parser is deliberately loose about
# punctuation and deliberately strict about which change a word is about — a
# word that names no change and could be about several is dropped rather than
# spread, because spreading it lets one word undo a name the model never
# spoke about.
#
# **KEEP is the default everywhere.** A change the reply never answers keeps
# its substitution, which is the same direction every other failure in this
# stage falls: the transcript that arrived is what ships. The malformed cases
# at the bottom are the ones that matter — they are what a small model does on
# a bad day, and every one of them has to land on the transcript the pass
# already produced rather than on a sentence nobody chose.

cases:
  - name: the plain answer, one change
    count: 1
    reply: "1. KEEP"
    expect: KEEP

  - name: the plain answer, two changes
    count: 2
    reply: |-
      1. KEEP
      2. REVERT
    expect: KEEP REVERT

  - name: both reverted
    count: 2
    reply: |-
      1. REVERT
      2. REVERT
    expect: REVERT REVERT

  - name: lower case
    count: 1
    reply: "1. revert"
    expect: REVERT

  - name: a bracket instead of a dot
    count: 2
    reply: |-
      1) REVERT
      2) KEEP
    expect: REVERT KEEP

  - name: a dash instead of a dot
    count: 1
    reply: "1 - REVERT"
    expect: REVERT

  - name: no separator at all
    count: 2
    reply: |-
      1 REVERT
      2 KEEP
    expect: REVERT KEEP

  - name: all on one line
    count: 2
    reply: "1. REVERT 2. KEEP"
    expect: REVERT KEEP

  # A bare word answers a one-change sentence. Most sentences have one change
  # and the model drops the numbering for them often enough to matter.
  - name: a bare word, one change
    count: 1
    reply: "REVERT"
    expect: REVERT

  - name: a bare word with the answer spelled out
    count: 1
    reply: "The name does not belong here. REVERT"
    expect: REVERT

  # Past one change a bare word names nothing, and guessing which one it meant
  # is how a name nobody discussed gets undone.
  - name: a bare word, two changes, answers neither
    count: 2
    reply: "REVERT"
    expect: KEEP KEEP

  - name: out of order
    count: 2
    reply: |-
      2. REVERT
      1. KEEP
    expect: KEEP REVERT

  # The first word about a change wins. A model that argues with itself has
  # already failed; taking the later word would let the argument decide.
  - name: the same change answered twice
    count: 1
    reply: |-
      1. KEEP
      1. REVERT
    expect: KEEP

  # ---- malformed ----

  - name: empty reply
    count: 2
    reply: ""
    expect: KEEP KEEP

  - name: whitespace only
    count: 1
    reply: "   "
    expect: KEEP

  - name: prose with no verdict in it
    count: 2
    reply: "I am not sure about either of these."
    expect: KEEP KEEP

  - name: a number past the end of the list
    count: 1
    reply: |-
      1. KEEP
      2. REVERT
    expect: KEEP

  - name: a number of zero names no change
    count: 1
    reply: "0. REVERT"
    expect: KEEP

  - name: only the second change is answered
    count: 2
    reply: "2. REVERT"
    expect: KEEP REVERT

  - name: the letter answer the old menu wanted
    count: 2
    reply: "B"
    expect: KEEP KEEP

  - name: a word that is neither
    count: 1
    reply: "1. MAYBE"
    expect: KEEP

  # `KEEPING` is not `KEEP`. Reading a prefix would take "REVERTED THE FIRST"
  # as an answer about a change the model was describing, not deciding.
  - name: a longer word starting with the answer
    count: 1
    reply: "1. KEEPING the name here"
    expect: KEEP

  - name: a longer word, the other way
    count: 1
    reply: "1. REVERTED"
    expect: KEEP

  - name: an enormous number
    count: 1
    reply: "999999999999999999999. REVERT"
    expect: KEEP
