# Spoken corrections for the native `disfluency` stage, which needs the parser.
# Scored by scripts/check-disfluency-corrections.sh.
#
# `correction` and `restart`: `expect` is the text with the taken-back words
# gone. Left unchanged is a miss; any other text is a wrong cut.
# `keep`: must come back byte for byte, or as its `expect` when the `fillers`
# table before the stage changed it. `unscored` runs for time
# and for no crash only. `languages:` stands in for the fixture's `[en]`, and
# `pipeline: fillers` runs tests/pipelines/disfluency-fillers.yaml instead.
#
# `blind-1`, `blind-2` and `blind-3` were each written by a fresh agent from
# the rule description alone, without the code. The rule was tuned on blind-1
# and blind-2 after their first run, and blind-3 added one guard. `user` is
# what the user dictated. `audit` is an independent audit's adversarial inputs,
# labelled here; a `#` line above a case says why when it is debatable.
# `adversarial-1` to `adversarial-6` were written by fresh agents to break the
# rule; their first runs are in the pull request.

