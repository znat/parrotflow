# What may be overwritten by a vocabulary term without anything asking.
#
# Two lists decide, and both have to say "unknown" — `Vocabulary.autoApplies`.
# `spell` is `Replacements.isRealWord`: NSSpellChecker, `en` then `fr`.
# `wordpiece` is `WordPieces.knows`: the whole-word half of
# distilbert-base-uncased's tokenizer vocabulary, in data/wordpiece.txt.
#
#   gate: judge       something reads the sentence before the word is replaced
#   gate: auto-apply  the word is replaced, and nothing reads the sentence
#
# One `auto-apply` carries a note: a span the term glues to. The lists are
# never asked about one, and what happens next depends on where the proposal
# came from — see the block on it below.
#
# A case with a `term` asks the whole gate about that pair, and reads
# `possessive` instead of the two lists:
#
#   possessive: dropped   the heard text carries a `'s` the term does not, so
#                         writing the term in would take a possessive out of
#                         the sentence — `Vocabulary.dropsPossessive`
#   possessive: kept      it would not
#
# The two blocks below are the two blind spots, and they are why one list is
# not enough. A dictionary has no first names in it. A tokenizer has no rare
# compounds in it. Measured 2026-08-29 against the shipped binary.
#
# Scored by `scripts/check-word-gate.sh`. Both verdicts are checked and not
# only the decision: a word reaches `judge` from either side, and a set that
# read the decision alone would pass while the half it meant to test was
# broken.

cases:

  # --- names the dictionary has never heard of, which the tokenizer has ------
  # These auto-applied before data/wordpiece.txt. "Um not Peter, uh Frederick."
  # became "…uh Redrock." with nothing reading the sentence.

  - word: Frederick
    spell: unknown
    wordpiece: known
    gate: judge
    why: the name the defect was found on

  - word: Sarah
    spell: unknown
    wordpiece: known
    gate: judge

  - word: Nathan
    spell: unknown
    wordpiece: known
    gate: judge

  - word: Ahmed
    spell: unknown
    wordpiece: known
    gate: judge

  - word: Bjorn
    spell: unknown
    wordpiece: known
    gate: judge

  - word: Xiao
    spell: unknown
    wordpiece: known
    gate: judge

  - word: Chloé
    spell: unknown
    wordpiece: known
    gate: judge
    why: >
      the accent. The tokenizer lowercases and then drops combining marks, and
      folding the query does the same thing, so this is looked up as `chloe`.

  # --- words the tokenizer splits, which the dictionary has ------------------
  # These reached the judge before this change and still do. The list alone
  # would have overwritten every one of them.

  - word: subtask
    spell: known
    wordpiece: unknown
    gate: judge

  - word: repo
    spell: known
    wordpiece: unknown
    gate: judge

  - word: async
    spell: known
    wordpiece: unknown
    gate: judge

  - word: rebase
    spell: known
    wordpiece: unknown
    gate: judge

  - word: tokenizer
    spell: known
    wordpiece: unknown
    gate: judge

  - word: Mathieu
    spell: known
    wordpiece: unknown
    gate: judge
    why: known to the French dictionary, split by an English tokenizer

  # --- known to both --------------------------------------------------------

  - word: Peter
    spell: known
    wordpiece: known
    gate: judge

  # --- known to neither, which is what the gate is for ----------------------
  # A word no dictionary and no tokenizer has seen is a mishearing, and the
  # audio already preferred the term. Nothing here changed.

  - word: Versal
    spell: unknown
    wordpiece: unknown
    gate: auto-apply
    why: the mishearing of Vercel that actually happens

  - word: Redrock
    spell: unknown
    wordpiece: unknown
    gate: auto-apply

  - word: Praisy
    spell: unknown
    wordpiece: unknown
    gate: auto-apply

  # --- what the pair still does not fix -------------------------------------
  # Recorded rather than hidden. These are names, they auto-apply, and neither
  # list stops them. The change removes most of the class, not all of it.

  - word: Priya
    spell: unknown
    wordpiece: unknown
    gate: auto-apply
    why: a first name both lists miss

  - word: Siobhan
    spell: unknown
    wordpiece: unknown
    gate: auto-apply
    why: a first name both lists miss

  # --- a possessive the term does not carry ---------------------------------
  # The two lists are asked about letters, so `Mirza's` is looked up as
  # `Mirzas` — a form neither list has ever seen. The apostrophe walks the
  # proposal past both of them, including past the first names the block at
  # the top of this file is about. Dropping a possessive changes what the
  # sentence says, so these go to the judge, which reads it.

  - word: "Mirza's"
    term: Mirza
    possessive: dropped
    gate: judge
    why: >
      "I'm just waiting for Mirza's thoughts about whether it's worth fixing
      the extension" — the case is in tests/judge-cases.yaml as a decline.
      "Mirza thoughts" is not what was said.

  - word: "Mirza’s"
    term: Mirza
    possessive: dropped
    gate: judge
    why: the typographic apostrophe, which is the one the recogniser writes

  - word: "Frederick's"
    term: Redrock
    possessive: dropped
    gate: judge
    why: >
      the first block of this file, defeated by one apostrophe. `Frederick`
      goes to the judge because the tokenizer knows it; `Fredericks` is known
      to neither list, so before this rule the possessive form auto-applied
      and `--inflected Redrock "Frederick's"` wrote `Redrock's`.

  # --- a term the decoder split in two --------------------------------------
  # Neither list is asked. Both halves are ordinary words, so the pair is
  # matched glued instead: `red crawl` is `Redcrawl` with a space in it.
  #
  # The test cannot tell that from an English phrase whose glued form happens
  # to be a term, and `better stack` is one. So a `replacements` rule that has
  # already written the term is left open by `VocabularyJudge.settle` and the
  # two sentence tests decide it. The sound path, which has written nothing
  # yet, still applies the glue. The note on the `gate` line says which.

  - word: "red crawl"
    term: Redcrawl
    possessive: kept
    gate: auto-apply
    why: the decoder puts a space in one name, which is a question about spelling

  - word: "better stack"
    term: BetterStack
    possessive: kept
    gate: auto-apply
    why: >
      the same test on an ordinary English phrase. Seen live 2026-09-01: "how
      this is a better stack for us" shipped as "a BetterStack for us". The
      lists still say auto-apply; what stops it now is the sentence.

  # --- the same class the other way round ------------------------------------
  # The term carries the possessive and the heard text does not. That
  # correction is right and nothing here fires on it: `possessive` reads
  # `kept`, and a rule that ran in both directions would read `dropped`.

  - word: "Matthew at"
    term: "Matthieu's"
    possessive: kept
    gate: judge
    why: >
      observed live, 2026-08-08. The judge kept "Matthew at" where the speaker
      said "Matthieu's". `judge` here is the glued-compound branch, which
      decides before the possessive is looked at — so `possessive` is the
      field under test and the decision is not.

  - word: Versal
    term: "Vercel's"
    possessive: kept
    gate: auto-apply
    why: >
      the same direction where the decision does move. A rule that fired on
      the term's possessive would send this to the judge.

  - word: Versal
    term: Vercel
    possessive: kept
    gate: auto-apply
    why: a word neither list knows, with no possessive anywhere, still goes through

  # --- a contraction, which is the same apostrophe wearing another hat -------
  # `wouldn't` is looked up as `wouldnt`, and neither list has seen that
  # either. Measured on the shipped binary before the fix: 9 of 14 common
  # contractions read `auto-apply`. The 5 that did not survived by accident —
  # `cant`, `wont`, `dont`, `its` and `lets` are words in their own right.
  #
  # The slot gate cannot catch these. "I wouldn't do that" reads slot `Verb`,
  # which it blocks, but the free tier had already decided and the slot is
  # never asked.

  - word: "wouldn't"
    term: Redcrawl
    possessive: kept
    gate: judge
    why: >
      "I wouldn't do that today" — the letters-only form walks past both lists
      the way a possessive does. Writing a name here deletes the negation.

  - word: "they're"
    term: Praisy
    possessive: kept
    gate: judge
    why: not a possessive, and the apostrophe is doing the same damage

  - word: "I've"
    term: Arexvy
    possessive: kept
    gate: judge
    why: two letters and an apostrophe, unknown to both lists as `Ive`

  - word: "don't"
    term: Redrock
    possessive: kept
    gate: judge
    why: >
      one of the five that already reached the judge, because `dont` is a
      word — kept so the fix is not the only thing holding this case

  # --- a possessive both sides carry ----------------------------------------
  #
  # The reading keeps the `'s`, so nothing is taken out of the sentence and
  # `dropsPossessive` has nothing to say. What decides is the word test, and it
  # is on letters only — `Sarah's` reaches it as `Sarahs`, a form no dictionary
  # can contain. Both lists then answer "unknown" to a question neither was
  # asked. Measured against the shipped binary: `sarahs`, `mirzas` and `precys`
  # are unknown to both lists; `sarah` is known to the tokenizer, `mirza` to
  # both, and only `precy` is genuinely new.
  #
  # So a possessive on both sides is taken off both before the lookup.

  - word: "Sarah's"
    term: "Praisy's"
    possessive: kept
    gate: judge
    why: >
      the tokenizer knows `sarah` and nothing knows `sarahs` — an ordinary
      name was being overwritten by the glued form walking past both lists

  - word: "Mirza's"
    term: "Praisy's"
    possessive: kept
    gate: judge
    why: both lists know `mirza`, neither knows `mirzas`

  - word: "Precy's"
    term: "Praisy's"
    possessive: kept
    gate: auto-apply
    why: >
      `precy` is unknown to both lists on its own merits, so the reading is
      written — this is the case the stems exist for, and it was going to a
      model that reverted it

  - word: "Mirza's"
    term: Mirza
    possessive: dropped
    gate: judge
    why: >
      only one side carries it, so nothing is stripped and the possessive rule
      still refuses — "Mirza's thoughts" is not "Mirza thoughts"
