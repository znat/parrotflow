# Every validation set that can run without a model, a microphone or a screen,
# on every push to a pull request.
#
# What the split costs, stated up front so nobody reads a green tick as more
# than it is. Four of the nine `scripts/check-*.sh` cannot run here:
#
#   check-grammar, check-routing, check-spelling   need Ollama and gemma4:e4b,
#     which is a 9.6 GB pull and CPU inference on a hosted runner — minutes per
#     case, for sets that take two minutes locally against a warm model.
#   check-inplace                                  needs a real screen, an
#     installed app, the Accessibility grant and tmux. It exists precisely
#     because that path cannot be checked in a pipe.
#
# So this catches a broken build, a broken deterministic pass and a config the
# app would refuse — not a prompt that has quietly got worse. Prompt changes
# still have to be scored on a machine with the model, and the numbers belong
# in the case file next to the prompt, as they already do.
#
# macOS only, and not by preference: FluidAudio wants CoreML and the ANE, and
# NSSpellChecker — which the fuzzy pass depends on — is a macOS service with no
# Linux equivalent.
name: checks

on:
  pull_request:
  # So a branch can be checked before the pull request exists.
  workflow_dispatch:

concurrency:
  # A second push supersedes the first: nobody reads the result of a run whose
  # commit has already been replaced.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # macos-26, not 15: the glass on the floating surfaces is
    # `NSGlassEffectView`, which exists in the macOS 26 SDK and no earlier one.
    # `#available(macOS 26, *)` is a *runtime* check — it decides whether the
    # branch runs, not whether the symbol has to be there to compile — so an
    # older image fails with "cannot find NSGlassEffectView in scope" however
    # the branch is guarded. The app still deploys to macOS 14; this is the SDK
    # it is built against, which is a different number.
    #
    # Not 14 either, for the reason it never was: FluidAudio 0.15.5 declares
    # swift-tools-version 6.0, and the macos-14 image ships Swift 5.10, so
    # resolution fails before a line is compiled. Our own Package.swift still
    # says 5.10 — that is the floor this package needs, not the toolchain a
    # dependency needs to be read.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The build is the whole cost here: 74s cold, and the tests it enables
      # take six seconds between them. Keyed on Package.resolved so a run that
      # changes no dependency reuses the compiled ones.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .build
          # Keyed on the dependencies alone. Adding the source hash would
          # invalidate on every push, which is every run — a cache that never
          # hits, paid for twice in upload and download.
          key: build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: build-${{ runner.os }}-

      - name: Build
        run: swift build -c release

      # The runners for the YAML the case files are written in.
      - name: Install pyyaml
        # Runners differ on whether their python is externally managed, and the
        # flag that satisfies one is rejected by the other.
        run: |
          python3 -m pip install --quiet pyyaml \
            || python3 -m pip install --quiet --break-system-packages pyyaml

      # Fails on errors, prints warnings. The config is calibrated against the
      # codebase rather than SwiftLint's defaults — see .swiftlint.yml for why
      # the default rules found 148 things here and no defect among them.
      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --reporter github-actions-logging

      # Each on its own step, so a red run says which set broke in the summary
      # rather than in the middle of a log.
      - name: Numbers
        run: scripts/check-numbers.sh

      - name: Replacements
        # The fuzzy half asks NSSpellChecker whether a word is real, and that
        # service intermittently times out — a timeout reads as "known word", so
        # a correction is missed. Seen twice locally, never reproducible. If
        # this step alone goes red, re-run it before believing it.
        run: scripts/check-replacements.sh

      - name: Pipeline
        run: scripts/check-pipeline.sh

      # Where the wake phrase ends and the instruction begins. Deterministic,
      # unlike the routing that follows it, so it runs here.
      - name: Wake phrase
        run: scripts/check-wake.sh

      # And the same question for a phrase found mid-sentence, where a false
      # positive splits an ordinary sentence and sends half of it to a model.
      - name: Instruction inside a dictation
        run: scripts/check-split.sh

      # Reads its pattern out of Config.defaultYAML, so this is also what keeps
      # the shipped default honest: the one rewrite that fires on ordinary
      # language rather than on a name someone taught it.
      - name: Dotted paths
        run: scripts/check-dotted.sh

      - name: Dates
        run: scripts/check-dates.sh

      # Where a transform's files are found, and where its command runs. Builds
      # whole config directories in /tmp and runs the real binary against them
      # with PARROTFLOW_CONFIG_DIR, so it needs no config on the machine and
      # says nothing about the one that is there.
      - name: A folder per transform
        run: scripts/check-transform-folders.sh

      # The scoring harness itself, against sets built for the purpose. No
      # model anywhere in it: the numbers have to be the same on a runner and
      # on a laptop with Ollama up.
      - name: The eval harness
        run: scripts/check-eval.sh

      # What the recorder does when the microphone changes underneath it. No
      # microphone is opened and no audio setting is touched — the input
      # binding is moved inside the process — so this runs on a headless
      # runner and beside somebody who is dictating. What it cannot prove is
      # the hardware; see #95 and the note at the top of the command.
      - name: Recovery from a device change
        run: scripts/check-audio-recovery.sh

      # Whether a possessive survives a substitution. Pure string work, no audio
      # and no model, so it runs here. The direction that matters is a `'s`
      # written where the speaker said none: these substitutions auto-apply and
      # there is no menu behind them.
      - name: A possessive across a substitution
        run: scripts/check-possessive.sh

      # The model behind the correction panel: the whitespace of the selection
      # it opened on, and where the caret lands. Both are invisible in the
      # panel, and both were wrong. Compiles the one file on its own, so it
      # needs no window.
      - name: The correction panel's spans
        run: scripts/check-spans.sh

      # Not a validation set: it checks that the file a new install is written
      # with still teaches everything config.example.yaml documents. That has
      # drifted twice, both times silently.
      - name: The config a new install gets
        run: scripts/check-default-config.sh

      # The other learnt file. Nobody rereads vocabulary.yaml, so a key that
      # quietly stops meaning what it meant is invisible — and one already did:
      # Yams answers `Bool.self` for `0.85`, so a decoder that asks about
      # `floor: off` first reads every measured floor as "never match this".
      - name: What vocabulary.yaml adds up to
        run: scripts/check-vocabulary-config.sh

      # `--learn` used to write into config.yaml's `transcription.replacements`.
      # It writes into vocabulary.yaml now, the same file the correction panel
      # and the voice spelling command write, and the splice has to handle
      # every shape that file has been written by hand.
      - name: --learn writes a pronunciation
        run: scripts/check-learn.sh

      # The same trap, one directory over: the transform folder a first launch
      # is seeded with against the copy in examples/ that people read and
      # score. It has always been able to drift and has never been checked
      # here — the rename that came with folders is the moment to fix that.
      - name: The transform a new install gets
        run: scripts/check-seeded-transform.sh

      # Two ways in, one certificate. A pin that is only right in the script or
      # only right in the app is a door that checks less than the other one.
      - name: Both install paths pin the same certificate
        run: scripts/check-pinned-certificate.sh

      # One person's voice is not source. `.gitignore` stops `git add .` and
      # nothing else — not `-f`, not a file tracked before the rule existed,
      # not a rebase from the frozen prototype branch, which does carry the
      # recordings. This checks what git tracks.
      - name: No speaker audio in the repository
        run: scripts/check-no-voice.sh
