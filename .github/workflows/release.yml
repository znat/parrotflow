name: release

# release-please watches main for Conventional Commits, keeps a release PR up to
# date with the next version and the changelog, and cuts the tag when that PR is
# merged. Only then does the build job run — so ordinary pushes cost nothing.
#
# workflow_dispatch runs the same job by hand. It does not force a release: it
# re-reads the commits since the last tag and opens or refreshes the release PR,
# which is what you want when a commit landed with the wrong subject and the PR
# needs recomputing. Merging that PR is still what cuts the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Actions are pinned to a commit, not a tag. A tag is mutable: whoever controls
# the action's repository can repoint v4 at new code, and this workflow hands
# what it runs the Developer ID certificate, its password, the notarization key
# and a token that can push to the tap. Pinning costs a manual bump when the
# action is updated, which is the trade.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The release commit, so the built bundle carries the released version.
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Show toolchain
        run: swift --version

      # The Developer ID does two jobs. Gatekeeper accepts it, which is what
      # notarization and the Homebrew cask need. And TCC keys Microphone and
      # Accessibility to the signing certificate, so signing every release with
      # the same one is what stops an upgrade silently costing users both
      # permissions.
      #
      # Missing secrets are a hard failure now, not a warning. An ad-hoc signed
      # release is one install.sh refuses and the app's own updater refuses —
      # publishing it would only produce an asset nobody can install.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::error::SIGNING_CERT_P12 is not set — cannot sign a release."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Put it on the search list so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # The identity is not named here. scripts/codesign.sh picks the
          # Developer ID out of the keychain, and picking it in one place is
          # what keeps a hand-run release and this one signing the same way.
          security find-identity -vp codesigning "$KEYCHAIN"
          # But say now if the secret does not hold one. release.sh refuses the
          # build anyway; failing here names the cause instead of the symptom.
          security find-identity -vp codesigning "$KEYCHAIN" \
            | grep -q "Developer ID Application" || {
              echo "::error::SIGNING_CERT_P12 holds no Developer ID Application certificate."
              exit 1
            }

      # An App Store Connect API key, not an Apple ID and password. The key
      # carries the Developer role and nothing else, it is revocable on its own,
      # and it does not stop working when the account gets a new password.
      - name: Write the notarization key
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [ -z "$NOTARY_KEY" ]; then
            echo "::error::NOTARY_KEY is not set — cannot notarize."
            exit 1
          fi
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      # Interpolations go through env rather than straight into the script, so
      # nothing from a workflow context is ever spliced into a shell command.
      - name: Build, sign, notarize and package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release.sh "$VERSION"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            dist/ParrotFlow.zip dist/ParrotFlow.zip.sha256 --clobber

      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8"

  # The cask lives in znat/homebrew-tap, so this needs a token that can push
  # there. Separate job because it must not run until the assets are attached:
  # it reads the checksum off the release it is bumping to.
  homebrew:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tag, so the cask is written by the script the release shipped.
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Bump the cask
        env:
          # Reads the release here. Pushes to the tap with the other one.
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: scripts/bump-cask.sh
