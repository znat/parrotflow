blank_issues_enabled: false

contact_links:
  - name: Ask a question
    url: https://github.com/znat/parrotflow/discussions/categories/q-a
    about: How do I write this transform? Why does this stage not fire? Ask in Q&A — answers there stay findable.
  - name: Show your transform or your config
    url: https://github.com/znat/parrotflow/discussions
    about: Post what you built. The good ones become examples in the repository.
  - name: Documentation
    url: https://github.com/znat/parrotflow/blob/main/docs/README.md
    about: Setup, configuration, pipelines, the command line, permissions.
  - name: A security problem
    url: https://github.com/znat/parrotflow/security/advisories/new
    about: Report it privately. Do not open an issue.
