transcription:
  enabled: true

  # paste     -> type it straight into the app you're in (needs Accessibility)
  # clipboard -> just copy it, you press Cmd-V
  insert_mode: clipboard

  # Select a wrong word anywhere, hold the hotkey and say this, and a panel
  # opens to teach ParrotFlow the right spelling. Needs Accessibility.
  correction_phrase: hey parrot

  # ACOUSTIC CONTEXT BIASING — OFF BY DEFAULT, AND IT SHOULD STAY OFF UNLESS
  # YOU HAVE MEASURED IT ON YOUR OWN VOICE.
  #
  # It fires on audio that contains nothing like the term, and when it fires it
  # deletes the words it lands on. Measured: with "Zilbershtayn" enabled,
  # "Good morning, my name is Nathan." became "Zylbersztejn is Nathan."
  # and a clip of plain "Good morning." became "Zylbersztejn".
  #
  # It is not tunable around. The false positive scored -8.98 while genuine
  # detections scored -10.0 to -10.6, so no score threshold separates them, and
  # raising the similarity guard to 0.85 did not block it either.
  #
  # If you want to try: add ONE long distinctive term, spelled the way it
  # SOUNDS, then check it against real clips with
  #   ParrotFlow --spot <clip.wav>
  # and re-run --transcribe on clips that do NOT contain the word, to see what
  # it wrecks.
  vocabulary: []

  # This is what actually fixes names. Literal, word-boundary, case-insensitive
  # swaps applied to the finished transcript. Predictable, and it cannot eat
  # words that were correct.
  #
  # Workflow: dictate, run --transcribe on the clip, map whatever the model
  # wrote to what you meant.
  replacements:
    Superbase: Supabase
    Versov: Vercel
    Tasman: Tasmeen
    Tasmin: Tasmeen

# A local Ollama model, used to interpret what you say after the wake phrase.
# Everything else works without it — you just lose free-form spoken commands.
llm:
  enabled: true
  model: gemma3:4b
  endpoint: http://localhost:11434
  timeout_seconds: 20
