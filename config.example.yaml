# ParrotFlow configuration
# Edit and save — changes are picked up automatically. Delete any line to
# get its default back. `--check-config` says what the file adds up to.

hotkey:
  # A bare modifier — right_option, left_option, right_command,
  # left_command, right_control, left_control, right_shift, left_shift, fn
  # — or a character key (a-z, 0-9, f1-f20, space, return, arrows,
  # punctuation), which needs `modifiers` below.
  key: right_command

  # Any of: command, control, option, shift.
  modifiers: []

  # push_to_talk records while the key is held; toggle taps on and off.
  # A bare modifier wants push_to_talk, or typing an accented character
  # with it would start recording.
  mode: push_to_talk

  # Keep the mic open this long after you let go, so the last syllable is
  # not cut off. push_to_talk only. 0 turns it off.
  release_tail_seconds: 0.3

audio:
  # Where the recordings and trace.jsonl go.
  output_dir: ~/Recordings/ParrotFlow

  # Skip clips with no speech in them, so a stray keypress does not decode
  # room tone into a sentence.
  speech_gate: true

feedback:
  sound: true     # a click when recording starts and stops
  overlay: true   # the floating pill while you speak
  # After the words land the pill names what can be done to them, for 3s.
  # Click a chip to run it. Tapping the dictation hotkey — press and let go
  # — opens the correction panel too. Holding it starts the next dictation.
  correct_offer: true
  # Put the sentence on the offer as well, each word coloured by how sure the
  # decoder was of it: white, then amber, then scarlet. Off by default — it is
  # for learning what your own dictation is weak at, not for every day.
  confidence: false
  # When the offer says the words may not be the words you said. The pill
  # turns amber and carries one line naming the word. On by default, unlike
  # `confidence`: it costs nothing on a dictation that went fine.
  # Both thresholds have to trip, because either alone is noise:
  #   sentence — the decoder's mean over the whole utterance. Below this the
  #              decode went badly throughout, not just in one place.
  #   word     — and it holds a word this bad. Words the vocabulary pass
  #              wrote do not count: they carry the score of the decode they
  #              replaced, which is low because that is why the pass fired.
  # Zero for either turns the warning off.
  # hold_return is how long, in seconds, a bare Return is taken rather than
  # typed after a warned dictation — the pill turns red and asks you to check
  # what was written. It catches the reflex press, not a considered one: past
  # this the key goes through even with the warning still up. The next Return
  # always goes through. Cmd+Return is left alone. 0 turns it off.
  low_confidence:
    sentence: 0.80
    word: 0.50
    hold_return: 1.5

logging:
  # The line-by-line log at ~/Library/Logs/ParrotFlow.log — how
  # every problem in this app gets diagnosed. Leave it on.
  text: true

  # Write each dictation's recording to disk, in audio.output_dir. Off by
  # default: a recording of your voice should not pile up there unless you
  # asked for it. Turn it on for --transcribe, calibration, or to hear what
  # the app heard.
  audio: false

transcription:
  # paste     -> typed into the app you're in (needs Accessibility)
  # clipboard -> copied, you press Cmd-V
  insert_mode: paste

  # Say one of these, and what follows is an instruction, not dictation:
  # "hey parrot, make that a bullet list". An empty list turns this off.
  activation_phrases: [hey parrot, by the way parrot]

  # Terminals only: they cannot be edited in place, so the input line is
  # cleared and retyped corrected. Everywhere else ignores this.
  rewrite_line: true

  # Languages you dictate in, most spoken first. Supported: en, fr. One entry
  # turns off language detection.
  languages: [en, fr]

  # What a finished transcript runs through, in order. Remove a line to turn
  # off that stage. A language key wins over `default`. A transform is also a
  # stage, and any stage takes a condition. See docs/pipelines.md.
  pipelines:
    default:
      - replacements                       # the table below
      # Offers a rule's substitution back as a reading, so `replacements`
      # must fire first. Judges each one KEEP or REVERT.
      - stage: vocabulary
        when: vocabulary.count > 0
      - numbers                            # "two hundred forty-three" -> 243
      - transform: punctuation             # "is that true question mark" -> is that true?
      - transform: repetitions             # a word or phrase said twice by accident, taken out

      # "read user dot name" -> read user.name, in code-ish windows only.
      - transform: dotted
        app: /term|ghostty|warp|kitty|alacritty|hyper|slack|discord/
      # `backticks` does the same for chat, so pasted markup stays literal.
      - transform: code_identifiers
        app: /term|ghostty|warp|kitty|alacritty|hyper|code|cursor|zed|xcode|jetbrains|idea|pycharm|webstorm/
        when: /\b(?:function|method|variable|class|constant|type|struct|interface|enum|fonction|méthode|classe|constante)\b/
      #
      # A `when:` without a pattern reads what earlier stages published:
      # `code_identifiers.count`, `numbers.language`, `asr.confidence`, and
      # `<stage>.ran` / `.ok` / `.changed` / `.ms` for every stage. So a stage
      # can stand down because another one already took the sentence:
      #
      #   - stage: transform
      #     transform: dotted
      #     when: code_identifiers.count == 0
      #
      # A stage that publishes a variable must declare `returns: json` and
      # speak that protocol — see docs/authoring.md.

# The local Ollama model behind spoken commands. Without it, dictation still
# works, and every `prompt:` transform below stops.
#
# These four keys describe one model, and it is named `local`. Everything runs
# on it unless something says otherwise — see `models:` below.
llm:
  enabled: true
  model: gemma4:e4b-mlx
  endpoint: http://localhost:11434
  # Pin the model in RAM at launch. Otherwise Ollama drops it after five
  # minutes, and the next command waits 7-10s for the reload.
  keep_loaded: true

  # Which model runs what, by name. `default` is what a `prompt:` transform
  # uses when it names none; the other two are jobs that run on every
  # dictation and are worth keeping local — the router is what you wait on
  # with the pill on screen, and both carry your transcript.
  # default: local
  # router: local
  # vocabulary: local

# More models, under names you pick. A transform names one with `model:`.
#
# `api:` is the protocol, not the company: ollama, openai or anthropic.
# Everyone else speaks one of the three, so Groq, OpenRouter, DeepSeek, LM
# Studio and vLLM are an `endpoint:` away rather than a new version of this
# app. `params:` is put into the request body untouched, for anything these
# keys do not cover.
#
# A model that is not `ollama` sends your dictation to somebody else's server.
# `--check-config` says so, every time, and names which transforms do it.
#
# api_key: never the key itself. `env:NAME` reads the environment, which the
# app does not have when it is launched from Finder — `file:` is the form that
# works in both places. A key written in full still works and is announced as
# plain text on every load.
#
# models:
#   gpt:
#     api: openai
#     model: gpt-5.6-luna
#     endpoint: https://api.openai.com/v1
#     api_key: file:~/.config/parrotflow/openai.key
#     # off | minimal | low | medium | high. One ladder, whatever the provider
#     # calls its own knob. `off` is the right default for a rewrite.
#     reasoning: off
#     timeout_seconds: 30
#
#   claude:
#     api: anthropic
#     model: claude-sonnet-5
#     api_key: env:ANTHROPIC_API_KEY
#     reasoning: off

# One call a day to GitHub's release API — the only request this app makes on
# its own. The number is a waiting period, not a poll interval: -1 never
# asks, 0 offers a release the day it ships, 7 waits a week — long enough for
# a bad release to be pulled before your Mac ever sees it.
updates:
  after_days: 0

# Word lists, written once and named. A `replace:` pattern refers to one as
# `{{determiners}}` and a transform that is a program reads the same words from
# `ctx["vars"]["lists"]`, so there is one definition rather than a copy in every
# regex — there were nine, and they had already drifted apart.
#
# Not split by language. `dotted` has always merged English and French into one
# alternation and it measures clean, because the words do not collide. Adding a
# language is adding words here, not adding a file.
#
# Every entry is quoted. `on`, `no` and `off` are booleans in YAML 1.1, which is
# what the check scripts parse with, and an unquoted `on` reaches them as the
# word `true`.
lists:
  # What may sit in front of a spoken name. A determiner there means the words
  # are prose: "the dot com bubble", "le point sur les tests".
  determiners: ["le", "la", "les", "l", "un", "une", "des", "du", "de", "d", "ce", "cet", "cette", "ces", "mon", "ma", "mes", "ton", "ta", "tes", "son", "sa", "ses", "notre", "nos", "votre", "vos", "leur", "leurs", "au", "aux", "à", "quel", "quelle", "chaque", "autre", "même", "premier", "première", "deuxième", "dernier", "dernière", "seul", "seule", "bon", "bonne", "mauvais", "certain", "tel", "telle", "quelque", "the", "a", "an"]

  # Words that mean the speaker is joining ideas, not names. Only `dash` needs
  # these, being an ordinary word in a way `hyphen` is not.
  connectors: ["this", "that", "about", "and", "or", "it"]

  # What may sit in front of a slash that starts a path rather than joining two
  # words: "available in slash tmp slash x".
  path_lead: ["in", "to", "at", "from", "on", "of", "into", "onto", "under", "sure", "is", "was", "be"]

  # What may follow "point"/"dot" in prose. Mostly French, because "point" is an
  # everyday French word and English "dot" is not: "point de vue", "point
  # commun", "point final". The last few are the English set phrases.
  prose_after_point: ["de", "du", "des", "d", "le", "la", "les", "l", "un", "une", "sur", "dans", "en", "et", "ou", "que", "qui", "où", "à", "au", "aux", "pour", "par", "avec", "sans", "est", "sont", "était", "sera", "me", "te", "se", "ne", "n", "c", "il", "elle", "je", "tu", "nous", "vous", "ils", "elles", "ce", "plus", "moins", "très", "mais", "donc", "car", "si", "comme", "final", "finale", "barre", "virgule", "commun", "commune", "faible", "faibles", "fort", "forts", "mort", "culminant", "névralgique", "chaud", "sensible", "positif", "négatif", "clé", "focal", "nommé", "com", "net", "org", "matrix", "product", "notation", "plot"]

  # Ordinary English function words. A real hyphen-join has a name part on its
  # right, never a preposition — this is what leaves "a mad dash to the door".
  function_words: ["to", "the", "a", "an", "of", "for", "in", "on", "at", "from", "with", "is", "was", "are", "were", "and", "or", "it", "its", "this", "that"]

  # The names of the marks themselves. Saying them is talking about them, which
  # is why "add slash semicolon ellipsis" comes back as words.
  mark_names: ["semicolon", "semi", "ellipsis", "comma", "colon", "dot", "dash", "hyphen", "underscore", "period", "quote", "unquote", "bracket", "brackets", "paren", "parens", "parenthesis", "point", "virgule"]

  # A word right before a spoken mark that means it is the noun, not the mark:
  # "a comma splice", "the exclamation point". Kept short on purpose — most
  # prepositions are also how a phrasal verb ends ("hold on", "log in"), and
  # guarding on those broke real instructions. Read by `punctuation`, which
  # reads `determiners` too, for the French.
  # `oxford` is not a determiner. It is here because "the oxford comma" was
  # `punctuation`'s one documented miss, and this is now where such a thing is
  # fixed — one word here rather than an edit to a script.
  talked_about: ["a", "an", "the", "and", "or", "nor", "around", "oxford"]


# What the activation phrase can reach, and what a pipeline can name.
#
#   name          the id a pipeline or `when:` names
#   description   matched against what you say — write it as you would say it
#   display       shown on the menu bar while the transform runs
#   prompt:       asks a model, about a second on the local one
#   model:        which model this prompt runs on — a name from `models:`, or
#                 `{ use: gpt, reasoning: low }` to change a setting for this
#                 prompt alone. Left out, it runs on `llm.default`.
#   replace:      a substitution table, costs nothing
#   command:      a program of yours — transcript in on stdin, rewrite out on stdout
#   confirm       shows the result first; set to false to skip that
#   path          a body too long for here — transforms/X/, e.g. prompt: { path: slack.md }
#
# See docs/pipelines.md.
transforms:
  - name: terse
    description: shorten text without losing anything it says
    display: Cutting it down
    prompt: |
      Cut this down. No filler, same facts, same voice.
      Return only the shortened text.

  - name: grammar
    description: fix grammar and punctuation mistakes, not formatting or numbers
    display: Fixing grammar
    # `offer: true` puts this on the pill after a dictation, next to Vocabulary.
    # `key:` is the letter drawn on its chip.
    offer: true
    key: g
    prompt: |
      Correct grammar, spelling and punctuation. Make the smallest change
      that makes the text correct — and make it. Every error is fixed.
      Nothing else is touched.

      Fix: subject-verb agreement, verb forms, confused homophones
      (its/it's, their/they're, weather/whether), missing or wrong
      punctuation, a missing capital at the start of a sentence, and a
      missing full stop at the end.

      Never reword, reorder, shorten, expand, or improve. Never add or
      remove words except where grammar requires it. Never add quotation
      marks, emphasis, or punctuation the sentence does not need. Keep the
      speaker's own vocabulary, register and phrasing, including informal,
      blunt or repetitive wording. A sentence that is already correct comes
      back exactly as it was.

      A phrase before the main clause takes a comma after it. A trailing
      please or thanks does not.

      Return only the text.

  # Same pattern as `backticks`, different output — that is what a table's
  # name is for. Refuses the match when either side is a word code does not
  # use there, or "voilà le point sur les tests" becomes "voilà le.sur les
  # tests". First list: what may not precede. Second: what may not follow.
  #
  # Hyphen and underscore reuse both lists — same risk shape.
  #
  # `dash` was left out until it was measured. Over 3,759 archived clips
  # "hyphen" was said 0 times and "dash" 8, 6 of them joining a real name. It is
  # also an ordinary word, so it carries a longer before-list and an English
  # after-list of its own: a real join has a name part on its right, never a
  # preposition, and that is what leaves "a mad dash to the door" alone.
  #
  # A single letter either side — "A dot B", "a underscore b" — is never prose.
  # The article guard was throwing it away.
  - name: dotted
    description: spoken dot, hyphen, dash, slash and underscore paths as code
    replace:
      '$1.': ['/\b(?!(?:{{determiners}})\b)(\w+) (?:dot|point) (?!(?:{{prose_after_point}})\b)(?=\w)/',
              '/\b([A-Za-z]) (?:dot|point) (?=[A-Za-z]\b)/']
      '$1-': ['/\b(?!(?:{{determiners}})\b)(\w+) (?:hyphen|tiret(?! bas)) (?!(?:{{prose_after_point}})\b)(?=\w)/',
              '/\b(?!(?:{{determiners}}|{{connectors}})\b)(\w+) (?:dash) (?!(?:{{prose_after_point}}|{{function_words}})\b)(?=\w)/',
              '/\b([A-Za-z]) (?:hyphen|tiret(?! bas)|dash) (?=[A-Za-z]\b)/']
      # A path, or the and/or sense ("a technical slash product decision").
      # `(?<!slash )` is what keeps a leading-slash path from half-converting:
      # "in slash tmp slash x" declines whole rather than becoming
      # "in slash tmp/x". A `replace:` table is a Swift dictionary, so its rules
      # run in an arbitrary order and no two-step rewrite can be relied on.
      # The mark names in the after-list are why "add slash semicolon ellipsis"
      # is left as words.
      '$1/': ['/\b(?!(?:{{determiners}}|{{path_lead}})\b)(?<!slash )(?<!barre oblique )(\w+) (?:slash|barre oblique) (?!(?:{{mark_names}})\b)(?=\w)/']
      '$1_': ['/\b(?!(?:{{determiners}})\b)(\w+) (?:underscore|souligné|tiret bas) (?!(?:{{prose_after_point}})\b)(?=\w)/',
              '/\b([A-Za-z]) (?:underscore|souligné|tiret bas) (?=[A-Za-z]\b)/']

  - name: backticks
    description: wrap dotted paths in backticks, for chat
    replace:
      '`$1`': ['/\b([A-Za-z_]\w*(?:\.[A-Za-z_]\w*)+)/']

  # A program, not a table — casing words is not something a substitution
  # can express. Written to transforms/code_identifiers/ on first launch.
  - name: code_identifiers
    description: spoken names as identifiers
    display: Formatting identifiers
    command: code_identifiers.py

  # A spoken mark replaces whatever punctuation the decoder already guessed
  # next to it: "we could find. exclamation point" -> "we could find!".
  - name: punctuation
    description: spoken marks as punctuation
    command: punctuation.py
    # The script needs its context, and `returns: json` is what sends it: the
    # language, which picks `<lang>.py`, and `lists.talked_about`. It reports
    # `applied` — the marks it wrote — and `declined`, which names the guard
    # that left a trigger as the ordinary word it is. Every trigger is an
    # English word, so "why is my comma still a comma" is the question this
    # stage generates, and the trace now answers it.
    returns: json

  # Cheap enough not to gate on a `when:` — 0.04s, mostly the `python3`
  # start, and it deletes nothing when it finds nothing.
  - name: repetitions
    description: delete a word or phrase said twice by accident
    command: repetitions.py

# Do what was asked even when no transform above matches: "hey parrot, use
# the 24 hour clock". A remark that was never an instruction is still
# refused, and you see every result before it replaces anything. Off means a
# fixed menu.
free_form: true
