transcription:
  enabled: true

  # Acoustic context biasing. NOTE: in FluidAudio 0.15.5 this produced zero
  # replacements in every configuration tested — see docs/transcription.md.
  # Kept because it costs nothing when it misses, and should start working as
  # the library matures. `replacements` below is what actually does the work
  # today.
  #
  # Only `text` is tokenized for the spotter, so it must be spelled the way the
  # word SOUNDS. Aliases are not given to the spotter at all — they only relax
  # a string-similarity check afterwards.
  vocabulary:
    - text: Zylbersztejn
      aliases: [Zilbershtayn, Zilberstein, Silverstein]
    - text: Tasmeen
      aliases: [Tasmin, Tasman]
    - text: Mik
      aliases: [Mick]
    - Parakeet

  # What actually fixes names right now. Run `--transcribe` on a clip of your
  # own voice, see what the model wrote, and map it here. Word-boundary matched
  # and case-insensitive.
  replacements:
    Ilbushtane: Zylbersztejn
    Zilbershtayn: Zylbersztejn
    Tasman: Tasmeen
    Tasmin: Tasmeen
    Mick: Mik
    Carrot Flow: ParrotFlow
