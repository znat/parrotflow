transcription:
  enabled: true

  # paste     -> type it straight into the app you're in (needs Accessibility)
  # clipboard -> just copy it, you press Cmd-V
  insert_mode: clipboard

  # ACOUSTIC CONTEXT BIASING.
  #
  # Terms here are matched against the audio itself, so this can recover a name
  # the model has never seen. Two hard-won rules:
  #
  #  1. Spell the term the way it SOUNDS, not the way you write it. Only `text`
  #     is tokenized and searched for; aliases are never given to the spotter.
  #     Then map the sound to the spelling you want under `replacements`.
  #  2. Keep this list short, long and distinctive. Terms under ~6 characters
  #     over-fire badly — "Mick" swallowed "project called carrot flow" in
  #     testing. Anything you can anticipate belongs in `replacements` instead.
  #
  # Check what the spotter actually finds with:  --spot <file.wav>
  vocabulary:
    - Zilbershtayn

  # Literal, word-boundary, case-insensitive swaps applied last. Safe and
  # predictable — this is where most name fixing should live.
  # Workflow: dictate, run --transcribe, map whatever the model wrote.
  replacements:
    Zilbershtayn: Zylbersztejn
    Tasman: Tasmeen
    Tasmin: Tasmeen
    Mick: Mik
    Carrot Flow: ParrotFlow
    Superbase: Supabase
    Versov: Vercel
