# ParrotFlow configuration
# Edit and save — changes are picked up automatically. Delete any line to
# get its default back. `--check-config` says what the file adds up to.

hotkey:
  # A bare modifier (right_option, right_command, right_control, fn, ...) or
  # a character key (a-z, 0-9, f1-f20, space, arrows) plus `modifiers` below.
  key: right_command

  # Any of: command, control, option, shift.
  modifiers: []

  # push_to_talk records while held; toggle taps on/off. Bare modifiers need
  # push_to_talk, or typing an accented character would start recording.
  mode: push_to_talk

  # Keeps the mic open this long after release, so the last syllable is not
  # cut. push_to_talk only; 0 turns it off.
  release_tail_seconds: 0.3

audio:
  # Where recordings and trace.jsonl go.
  output_dir: ~/Recordings/ParrotFlow

  # Skip clips with no speech, so a stray keypress does not decode room tone.
  speech_gate: true

  # Decode each clip again with silence padding, keep it if it reaches
  # further. Recovers dropped endings (~2%) for ~100ms. Needs speech_gate.
  second_opinion: false

feedback:
  sound: true     # a click when recording starts and stops
  overlay: true   # the floating pill while you speak
  # After the words land, the pill offers what to do for 6s, the last 2 of
  # them fading. Click a chip to run it, or tap the hotkey for the panel.
  correct_offer: true
  # Colours each word by decoder confidence. For diagnosing your own
  # dictation, not everyday use — off by default.
  confidence: false
  # Warns when a dictation may be wrong: pill turns amber, names the word.
  # Both the sentence-mean and the worst-word confidence must trip — either
  # alone is too noisy. hold_return delays a bare Return so a reflex press
  # cannot confirm unread text. 0 on either setting turns it off.
  low_confidence:
    sentence: 0.80
    word: 0.50
    hold_return: 1.5

logging:
  # Line-by-line log at ~/Library/Logs/ParrotFlow.log. Leave it on.
  text: true

  # Saves each dictation's recording to audio.output_dir, for --transcribe,
  # calibration, or hearing what the app heard. Off by default.
  audio: false

transcription:
  # paste     -> typed into the frontmost app (needs Accessibility)
  # clipboard -> copied, you press Cmd-V
  insert_mode: paste

  # Say one of these and what follows is an instruction. Empty list turns it off.
  activation_phrases: [hey parrot, by the way parrot]

  # Terminals only — the input line is cleared and retyped, since it cannot
  # be edited in place.
  rewrite_line: true

  # Languages you dictate in, most spoken first. Supported: en, fr. One
  # entry turns off language detection.
  languages: [en, fr]

  # What a transcript runs through, in order. Remove a line to skip that
  # stage. A language key wins over `default`. See docs/pipelines.md.
  pipelines:
    default:
      # Matches vocabulary.yaml renderings and has a model keep or revert
      # each match. Runs first, before anything else edits the text.
      #   near_misses: false   match exactly, never one edit away
      #   review: false        ship every match unread, and reach no model
      - stage: vocabulary
        review: gemma          # who decides "Versailles" is the castle here
      - numbers                            # "two hundred forty-three" -> 243
      - transform: punctuation             # "is that true question mark" -> is that true?
      - transform: repetitions             # a word or phrase said twice by accident, taken out

      # "read user dot name" -> read user.name, in code-ish windows only.
      - transform: dotted
        app: /term|ghostty|warp|kitty|alacritty|hyper|slack|discord/
      # `backticks` does the same for chat, so pasted markup stays literal.
      - transform: code_identifiers
        app: /term|ghostty|warp|kitty|alacritty|hyper|code|cursor|zed|xcode|jetbrains|idea|pycharm|webstorm/
        when: /\b(?:function|method|variable|class|constant|type|struct|interface|enum|fonction|méthode|classe|constante)\b/
      # A bare `when:` reads what earlier stages published, e.g.
      # `code_identifiers.count` or `<stage>.ran`/`.ok`/`.changed`/`.ms`:
      #   - { stage: transform, transform: dotted, when: code_identifiers.count == 0 }
      # Publishing a variable needs `returns: json` — see docs/authoring.md.

# Every model this config can reach, under a name you pick. `api:` is the
# protocol (ollama, openai, anthropic); other providers work through an
# `endpoint:`. `default: true` picks the one used when no model is named.
# A non-ollama model sends dictation off this Mac — `--check-config` says
# so. api_key: omit it for the keychain, or use `file:~/path`, `env:NAME`
# (terminal only), or the key written in full.
models:
  gemma:
    api: ollama
    model: gemma4:e4b-mlx
    endpoint: http://localhost:11434
    # Keeps the model in RAM — otherwise Ollama drops it after 5 minutes idle
    # and the next command waits 7-10s to reload. Ollama only.
    keep_loaded: true
    default: true

  # No `api_key:` — keychain. reasoning: off | minimal | low | medium | high.
  # gpt:
  #   api: openai
  #   model: gpt-5.6-luna
  #   endpoint: https://api.openai.com/v1
  #   reasoning: off
  #   timeout_seconds: 30
  # claude:
  #   api: anthropic
  #   model: claude-sonnet-5
  #   reasoning: off

# What "hey parrot, …" can reach, and which model runs each part. Each falls
# back to the default model above.
commands:
  # Matches what you said to a capability. Runs on every "hey parrot" —
  # keep it local and fast.
  # router: gemma

  # Reads a rule out of "Tasmin spells T A S M E E N". Worth a bigger model.
  # spelling: gpt

  # An instruction no capability covers. `false` refuses them.
  # catch_all: gpt

# One call a day to GitHub's release API. -1 never asks, 0 offers a release
# the day it ships, 7 waits a week.
updates:
  after_days: 0

# Word lists, written once and named — `{{determiners}}` in a `replace:`, or
# `ctx["vars"]["lists"]` in a script. Quote every entry: `on`/`no`/`off` are
# booleans in YAML 1.1.
lists:
  # A determiner before a spoken name means prose: "the dot com bubble".
  determiners: ["le", "la", "les", "l", "un", "une", "des", "du", "de", "d", "ce", "cet", "cette", "ces", "mon", "ma", "mes", "ton", "ta", "tes", "son", "sa", "ses", "notre", "nos", "votre", "vos", "leur", "leurs", "au", "aux", "à", "quel", "quelle", "chaque", "autre", "même", "premier", "première", "deuxième", "dernier", "dernière", "seul", "seule", "bon", "bonne", "mauvais", "certain", "tel", "telle", "quelque", "the", "a", "an", "my", "your", "his", "her", "its", "our", "their", "this", "that", "these", "those", "each", "every", "another", "other", "same", "which", "what", "some", "any", "no", "one", "first", "second", "last", "only"]

  # Words meaning the speaker is joining ideas, not names — only `dash` needs these.
  connectors: ["this", "that", "about", "and", "or", "it"]

  # What may precede a slash that starts a path, not a join: "in slash tmp".
  path_lead: ["in", "to", "at", "from", "on", "of", "into", "onto", "under", "sure", "is", "was", "be"]

  # What may follow "point"/"dot" in prose, mostly French set phrases.
  prose_after_point: ["de", "du", "des", "d", "le", "la", "les", "l", "un", "une", "sur", "dans", "en", "et", "ou", "que", "qui", "où", "à", "au", "aux", "pour", "par", "avec", "sans", "est", "sont", "était", "sera", "me", "te", "se", "ne", "n", "c", "il", "elle", "je", "tu", "nous", "vous", "ils", "elles", "ce", "plus", "moins", "très", "mais", "donc", "car", "si", "comme", "final", "finale", "barre", "virgule", "commun", "commune", "faible", "faibles", "fort", "forts", "mort", "culminant", "névralgique", "chaud", "sensible", "positif", "négatif", "clé", "focal", "nommé", "com", "net", "org", "matrix", "product", "notation", "plot"]

  # A real hyphen-join never has one of these on its right — English function words.
  function_words: ["to", "the", "a", "an", "of", "for", "in", "on", "at", "from", "with", "is", "was", "are", "were", "and", "or", "it", "its", "this", "that"]

  # Names of the marks themselves — saying them is talking about them.
  mark_names: ["semicolon", "semi", "ellipsis", "comma", "colon", "dot", "dash", "hyphen", "underscore", "period", "quote", "unquote", "bracket", "brackets", "paren", "parens", "parenthesis", "point", "virgule"]

  # A word before a spoken mark that means it is the noun, not the mark: "a comma splice".
  talked_about: ["a", "an", "the", "and", "or", "nor", "around", "oxford"]


# Sharing with a team — a `.parrot/` folder in a repository, holding the names
# that team says out loud and the transforms they wrote. Nothing here reads it:
# an agent does, screens each term against your voice and your languages, and
# writes what survives into vocabulary.yaml and this file. A term that is safe
# for the person who committed it is not therefore safe for you, and a shared
# `command:` is someone else's program running on your Mac. See docs/sharing.md.

# What the activation phrase can reach, and what a pipeline can name.
#   name          the id a pipeline or `when:` names
#   description   matched against what you say — write it as you would say it
#   display       shown on the menu bar while the transform runs
#   prompt:       asks a model, about a second on the local one
#   model:        which model this runs on — a name from `models:`, or
#                 `{ use: gpt, reasoning: low }`. Left out, uses the default.
#   replace:      a substitution table, costs nothing
#   command:      a program of yours — transcript in on stdin, rewrite out on stdout
#   confirm       shows the result first; set to false to skip that
#   path          a body too long for here — transforms/X/, e.g. prompt: { path: slack.md }
# See docs/pipelines.md.
transforms:
  - name: terse
    description: shorten text without losing anything it says
    display: Cutting it down
    prompt: |
      Cut this down. No filler, same facts, same voice.
      Return only the shortened text.

  - name: grammar
    description: fix grammar and punctuation mistakes, not formatting or numbers
    display: Fixing grammar
    # Puts this on the pill after a dictation. `key:` is the chip's letter.
    offer: true
    key: g
    prompt: |
      Correct grammar, spelling and punctuation. Make the smallest change
      that makes the text correct — and make it. Every error is fixed.
      Nothing else is touched.

      Fix: subject-verb agreement, verb forms, confused homophones
      (its/it's, their/they're, weather/whether), missing or wrong
      punctuation, a missing capital at the start of a sentence, and a
      missing full stop at the end.

      Never reword, reorder, shorten, expand, or improve. Never add or
      remove words except where grammar requires it. Never add quotation
      marks, emphasis, or punctuation the sentence does not need. Keep the
      speaker's own vocabulary, register and phrasing, including informal,
      blunt or repetitive wording. A sentence that is already correct comes
      back exactly as it was.

      A phrase before the main clause takes a comma after it. A trailing
      please or thanks does not.

      Return only the text.

  # Refuses when either side is not a code word, so "voilà le point sur les
  # tests" stays as words. A single letter either side is always code.
  - name: dotted
    description: spoken dot, hyphen, dash, slash and underscore paths as code
    replace:
      '$1.': ['/\b(?!(?:{{determiners}})\b)(\w+) (?:dot|point) (?!(?:{{prose_after_point}})\b)(?=\w)/',
              '/\b([A-Za-z]) (?:dot|point) (?=[A-Za-z]\b)/']
      '$1-': ['/\b(?!(?:{{determiners}})\b)(\w+) (?:hyphen|tiret(?! bas)) (?!(?:{{prose_after_point}})\b)(?=\w)/',
              '/\b(?!(?:{{determiners}}|{{connectors}})\b)(\w+) (?:dash) (?!(?:{{prose_after_point}}|{{function_words}})\b)(?=\w)/',
              '/\b([A-Za-z]) (?:hyphen|tiret(?! bas)|dash) (?=[A-Za-z]\b)/']
      # `(?<!slash )` stops a leading-slash path half-converting.
      '$1/': ['/\b(?!(?:{{determiners}}|{{path_lead}})\b)(?<!slash )(?<!barre oblique )(\w+) (?:slash|barre oblique) (?!(?:{{mark_names}})\b)(?=\w)/']
      '$1_': ['/\b(?!(?:{{determiners}})\b)(\w+) (?:underscore|souligné|tiret bas) (?!(?:{{prose_after_point}})\b)(?=\w)/',
              '/\b([A-Za-z]) (?:underscore|souligné|tiret bas) (?=[A-Za-z]\b)/']

  - name: backticks
    description: wrap dotted paths in backticks, for chat
    replace:
      '`$1`': ['/\b([A-Za-z_]\w*(?:\.[A-Za-z_]\w*)+)/']

  # A program, not a table — casing words needs code. Copy the examples/
  # folder to transforms/code_identifiers/ to edit it.
  - name: code_identifiers
    description: spoken names as identifiers
    display: Formatting identifiers
    command: examples/code_identifiers/code_identifiers.py

  # A spoken mark replaces whatever punctuation the decoder guessed next to
  # it: "we could find. exclamation point" -> "we could find!".
  - name: punctuation
    description: spoken marks as punctuation
    command: examples/punctuation/punctuation.py
    returns: json

  # Cheap: ~0.04s, mostly the python3 start.
  - name: repetitions
    description: delete a word or phrase said twice by accident
    command: examples/repetitions/repetitions.py
