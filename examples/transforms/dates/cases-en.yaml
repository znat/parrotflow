# Validation set for `dates_en`. Scored with `score.py --lang en` beside
# this file, or with `ParrotFlow --eval dates_en`, which runs the deployed
# command rather than a reimplementation of it. The `tests:` key on the
# transform is what points `--eval` at this file rather than at the other
# language's.
#
# `change`: a date or a clock time was dictated — write it the way it was said.
# `keep` (no `expect`): must come back byte for byte.
#
# The keep half is 26 of 51 cases and it is the half that decides. This
# stage runs on every transcript with no output of its own, so a wrong rewrite
# is text nobody watched change. Every keep here is a shape that looks like a
# date or a time and is not: a count, a duration, a range, a chapter number, a
# year.
#
# What is deliberately out of scope:
#   - the calendar. "next Tuesday" and "tomorrow" are not resolved, and a date
#     said without a year does not get one.
#   - a lone ordinal and a lone year. Both are the `numbers` stage's job, which
#     runs after this one.
#   - a target format. The speaker's shape is the output's shape.
#
# `lang:` is on every case even though the file is one language. `--eval` hands
# it to the pipeline, and detection is unreliable at the length a case is.
#
# The set carries no `transforms:` block of its own. It would only work with an
# absolute `command:` path: a bare name resolves in `transforms/<name>/` under
# the file's own directory and nowhere else, and an unresolved one kills
# `--eval` with SIGPIPE rather than reporting it.

cases:

  # --- time_en ---
  - probe: time_en
    lang: en
    input: "let's meet at three thirty"
    expect: "let's meet at 3:30"
