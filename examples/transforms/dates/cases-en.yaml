    expect: "the contract runs to March 3, 2026"
  - probe: date_en
    lang: en
    input: "the deadline is September first"
    expect: "the deadline is September 1"
  - probe: date_en
    lang: en
    input: "the office closes December twenty-fifth"
    expect: "the office closes December 25"
  - probe: date_en
    lang: en
    input: "she joined the twenty-first of June nineteen ninety-nine"
