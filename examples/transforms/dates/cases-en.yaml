# Validation set for `dates_en`. Scored with `score.py --lang en` beside this
# file, or with `ParrotFlow --eval dates_en`, which runs the installed command.
# The `tests:` key on the transform points `--eval` at this file.
#
# `change`: a date or a clock time was dictated — write it the way it was said.
# `keep` (no `expect`): must come back byte for byte.
#
# The keep half is 28 of 53 cases and it is the half that decides. The stage
# runs on every transcript and shows nothing, so a wrong rewrite is text nobody
# watched change. Every keep is a shape that looks like a date and is not: a
# count, a duration, a range, a chapter number, a year.
#
# Out of scope on purpose: the calendar ("next Tuesday" is not resolved, a date
# said without a year does not get one), a lone ordinal and a lone year (the
# numbers transform's job, after this one), and any target format.
#
# `lang:` is on every case because `--eval` hands it to the pipeline, where
# detection is unreliable at the length of a case. The set carries no
# `transforms:` block: a bare `command:` resolves under the file's own
# directory only, and an unresolved one kills `--eval` with SIGPIPE.

cases:

  # --- time_en ---
  - probe: time_en
    lang: en
    input: "let's meet at three thirty"
    expect: "let's meet at 3:30"
  - probe: time_en
    lang: en
    input: "the call is at ten fifteen"
    expect: "the call is at 10:15"
  - probe: time_en
    lang: en
    input: "the demo is three thirty pm"
    expect: "the demo is 3:30 pm"
  - probe: time_en
    lang: en
    input: "the standup moved to around eleven thirty"
    expect: "the standup moved to around 11:30"
  - probe: time_en
    lang: en
    input: "ship it by eight forty five"
    expect: "ship it by 8:45"
  - probe: time_en
    lang: en
    input: "the window opens at two oh five"
    expect: "the window opens at 2:05"
  - probe: time_en
    lang: en
    input: "the review is at three thirty p.m."
    expect: "the review is at 3:30 p.m."
  - probe: time_en
    lang: en
    input: "the meeting is at seven am"
    expect: "the meeting is at 7 am"
  - probe: time_en
    lang: en
    input: "we start at 10 15"
    expect: "we start at 10:15"
