# Validation set for `dates`. Scored with `score.py` beside this file, or with
# `ParrotFlow --eval examples/transforms/dates/cases.yaml`, which runs the
# deployed command rather than a reimplementation of it.
#
# `change`: a date or a clock time was dictated — write it the way it was said.
# `keep` (no `expect`): must come back byte for byte.
#
# The keep half is 37 of 77 cases and it is the half that decides. This stage
# runs on every transcript with no output of its own, so a wrong rewrite is
# text nobody watched change. Every keep here is a shape that looks like a date
# or a time and is not: a count, a duration, a range, a chapter number, a year.
#
# What is deliberately out of scope:
#   - the calendar. "next Tuesday" and "tomorrow" are not resolved, and a date
#     said without a year does not get one.
#   - a lone ordinal ("the fifteenth") and a lone year ("twenty twenty-six").
#     Both are the `numbers` stage's job, which runs after this one.
#   - a target format. The speaker's shape is the output's shape.
#
# `lang:` is on every case. Detection is unreliable at the length a case is,
# and a French case scored under English rules passes for the wrong reason.
#
# The set carries no `transforms:` block of its own. It would only work with an
# absolute `command:` path: a bare name resolves in `transforms/<name>/` under
# the file's own directory and nowhere else, and an unresolved one kills
# `--eval` with SIGPIPE rather than reporting it. So `--eval` reads `dates`
# from your config, and `score.py` beside this file reads the repo copy.

cases:

  # --- English: a clock time -------------------------------------------------
