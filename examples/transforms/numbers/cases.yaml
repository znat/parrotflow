# Validation set for `numbers`. Scored with `ParrotFlow --eval numbers`, which
# runs the deployed command, and with `score.py` beside this file, which runs
# the copy in the repo.
#
# `expect`: what must come out. No `expect` means "comes back byte for byte" —
# the --eval contract, in docs/cli.md.
#
# `lang` pins the grammar rather than detecting it, because half these cases
# are two words long and language detection needs four words to answer. A case
# with no `lang` is detected, which is what the app does; those are the last
# section and they are where the multi-language rule is scored.
#
# The set is deliberately lopsided toward text that must come back untouched.
# A number pass runs on every transcript, including the ones that were already
# right, so a false positive is not one bad case — it is a rewrite of correct
# text that nobody asked for and nobody sees happen. "à deux" and "chapitre
# trois" are the whole reason the below-ten floor exists.

cases:

  # =========================================================================
  # French
  # =========================================================================

  # --- the case this was built for ----------------------------------------
  - probe: fr_floor
    name: à deux, deux cents
    lang: fr
    input: à deux, on a dépensé deux cents euros
    expect: à deux, on a dépensé 200 euros

  # Both halves of the threshold in one sentence, which is why it is worth
  # more than either alone: the lone "deux" stays a word and the compound
  # "vingt et un" becomes 21, in the same breath. Its English twin is below.
  - { probe: fr_floor, lang: fr, input: j'ai mangé deux des vingt et un poissons, expect: j'ai mangé deux des 21 poissons }
  - { probe: fr_floor, lang: fr, input: j'ai mangé deux des vingt-et-un poissons, expect: j'ai mangé deux des 21 poissons }

  # --- 70, 80, 90: the vigesimal rule -------------------------------------
  - { probe: fr_vigesimal, lang: fr, input: il y avait soixante-dix personnes, expect: il y avait 70 personnes }
  - { probe: fr_vigesimal, lang: fr, input: soixante-dix-sept euros, expect: 77 euros }
  - { probe: fr_vigesimal, lang: fr, input: on en a compté quatre-vingts, expect: on en a compté 80 }
  - { probe: fr_vigesimal, lang: fr, input: il en reste quatre-vingt-un, expect: il en reste 81 }
  - { probe: fr_vigesimal, lang: fr, input: quatre-vingt-dix dossiers, expect: 90 dossiers }
  - { probe: fr_vigesimal, lang: fr, input: quatre-vingt-dix-sept dossiers, expect: 97 dossiers }
  - { probe: fr_vigesimal, lang: fr, input: quatre vingt dix sept dossiers, expect: 97 dossiers }
  - { probe: fr_vigesimal, lang: fr, input: soixante et onze euros, expect: 71 euros }
  - { probe: fr_vigesimal, lang: fr, input: vingt et un jours, expect: 21 jours }
  - { probe: fr_vigesimal, lang: fr, input: trente-deux personnes, expect: 32 personnes }
  - { probe: fr_vigesimal, lang: fr, input: quarante-cinq minutes, expect: 45 minutes }
  - { probe: fr_vigesimal, lang: fr, input: cinquante-neuf secondes, expect: 59 secondes }
  - { probe: fr_vigesimal, lang: fr, input: dix-sept ans, expect: 17 ans }
  - { probe: fr_vigesimal, lang: fr, input: dix-huit mois, expect: 18 mois }
  - { probe: fr_vigesimal, lang: fr, input: dix-neuf euros, expect: 19 euros }
  - { probe: fr_vigesimal, lang: fr, input: seize personnes, expect: 16 personnes }

  # --- hundreds, thousands, and the bare scale ----------------------------
  - { probe: fr_scales, lang: fr, input: cent cinquante euros, expect: 150 euros }
  - { probe: fr_scales, lang: fr, input: cent euros, expect: 100 euros }
  - { probe: fr_scales, lang: fr, input: mille euros par mois, expect: 1000 euros par mois }
  - { probe: fr_scales, lang: fr, input: deux mille vingt-six, expect: '2026' }
  - { probe: fr_scales, lang: fr, input: deux cent cinquante mille, expect: '250000' }
  - { probe: fr_scales, lang: fr, input: cinq cent mille, expect: '500000' }
  - { probe: fr_scales, lang: fr, input: trois millions de dollars, expect: 3000000 de dollars }
  - { probe: fr_scales, lang: fr, input: deux milliards d'euros, expect: 2000000000 d'euros }
  - { probe: fr_scales, lang: fr, input: mille neuf cent quatre-vingt-quatre, expect: '1984' }

  # --- decimals and ordinals ----------------------------------------------
  - { probe: fr_extras, lang: fr, input: trois virgule un quatre, expect: "3,14" }
  - { probe: fr_extras, lang: fr, input: zéro virgule cinq, expect: "0,5" }
  - { probe: fr_extras, lang: fr, input: le vingtième étage, expect: le 20e étage }
  - { probe: fr_extras, lang: fr, input: le vingt et unième jour, expect: le 21e jour }
  - { probe: fr_extras, lang: fr, input: le quinzième essai, expect: le 15e essai }

  # --- Belgium and Switzerland --------------------------------------------
  # Vocabulary only, no new rule: the vigesimal path already reads a tens word
  # plus a unit. They share the table with the metropolitan forms because no
  # speaker uses both, and nothing upstream knows which French this is.
  - { probe: fr_belgium, lang: fr, input: j'en ai quatre cent septante-huit, expect: j'en ai 478 }
  - { probe: fr_belgium, lang: fr, input: j'en ai quatre cent septante huit, expect: j'en ai 478 }
  - { probe: fr_belgium, lang: fr, input: nonante-neuf centimes, expect: 99 centimes }
  - { probe: fr_belgium, lang: fr, input: il y avait septante personnes, expect: il y avait 70 personnes }
  - { probe: fr_belgium, lang: fr, input: huitante euros, expect: 80 euros }
  - { probe: fr_belgium, lang: fr, input: octante-cinq dossiers, expect: 85 dossiers }
  - { probe: fr_belgium, lang: fr, input: septante et un jours, expect: 71 jours }
  # The metropolitan forms must be untouched by all of that.
  - { probe: fr_belgium, lang: fr, input: j'en ai quatre cent soixante-dix-huit, expect: j'en ai 478 }
  - { probe: fr_belgium, lang: fr, input: quatre-vingt-dix-neuf centimes, expect: 99 centimes }

  # --- French: must come back untouched -----------------------------------
  # Every one of these contains a number word, and none of them is a number
  # anyone wants written as a digit.
  - { probe: fr_keep, lang: fr, input: j'ai une question }
  - { probe: fr_keep, lang: fr, input: chapitre trois du livre }
  - { probe: fr_keep, lang: fr, input: on est deux sur le projet }
  - { probe: fr_keep, lang: fr, input: un et deux sont revenus }
  - { probe: fr_keep, lang: fr, input: il y en a un qui manque }
  - { probe: fr_keep, lang: fr, input: on se voit à cinq heures }
  - { probe: fr_keep, lang: fr, input: des centaines de gens }
  # The threshold's own cost, in both languages, and not a French bug: a lone
  # "dix" is at the floor so it converts, and "neuf fois sur 10" is not what
  # anyone would type. The English twin below does exactly the same thing.
  # Lowering the floor is not the fix — it is what keeps "chapitre trois" and
  # "on est deux" as words, which is the failure that costs more.
  - { probe: fr_keep, lang: fr, input: neuf fois sur dix, expect: neuf fois sur 10 }
  - { probe: fr_keep, lang: fr, input: le premier de la liste }
  - { probe: fr_keep, lang: fr, input: en deux mots }

  # =========================================================================
  # English
  # =========================================================================

  # --- cardinals and the threshold ----------------------------------------
  - { probe: en_cardinals, lang: en, input: two hundred forty-three, expect: '243' }
  - { probe: en_cardinals, lang: en, input: two hundred and forty-three, expect: '243' }
  - { probe: en_cardinals, lang: en, input: twenty-five people, expect: 25 people }
  - { probe: en_cardinals, lang: en, input: about twelve of them, expect: about 12 of them }
  - { probe: en_cardinals, lang: en, input: forty two people showed up, expect: 42 people showed up }
  - { probe: en_cardinals, lang: en, input: a hundred and fifty bucks, expect: 150 bucks }
  - { probe: en_cardinals, lang: en, input: two hundred fifty thousand, expect: '250000' }
  - { probe: en_cardinals, lang: en, input: three million dollars, expect: 3000000 dollars }

  # The twin of the French pair above — same sentence, same two behaviours,
  # and the hyphen makes no difference because the tokeniser splits it.
  - { probe: en_cardinals, lang: en, input: I ate two of the twenty one fishes, expect: I ate two of the 21 fishes }
  - { probe: en_cardinals, lang: en, input: I ate two of the twenty-one fishes, expect: I ate two of the 21 fishes }

  # --- extras --------------------------------------------------------------
  - { probe: en_extras, lang: en, input: three point one four, expect: '3.14' }
  - { probe: en_extras, lang: en, input: the twenty third of June, expect: the 23rd of June }
  - { probe: en_extras, lang: en, input: nineteen eighty-four, expect: '1984' }
  - { probe: en_extras, lang: en, input: it shipped in twenty twenty five, expect: it shipped in 2025 }
  - { probe: en_extras, lang: en, input: call five five five one two three four, expect: call 5551234 }
  - { probe: en_extras, lang: en, input: we hired twelve people, expect: we hired 12 people }

  # --- English: the guards -------------------------------------------------
  # Each of these broke a rule at some point, which is why they are here rather
  # than in a comment.
  - { probe: en_keep, lang: en, input: I have one question }
  - { probe: en_keep, lang: en, input: no one knows }
  - { probe: en_keep, lang: en, input: chapter three }
  - { probe: en_keep, lang: en, input: the fifth of January }
  - { probe: en_keep, lang: en, input: let's meet at eleven thirty }
  - { probe: en_keep, lang: en, input: two three-inch bolts }
  - { probe: en_keep, lang: en, input: one and two came back }
  - { probe: en_keep, lang: en, input: hundreds of people came }
  # The twin of the French case above, kept so the trade-off is visibly a
  # design choice rather than one language misbehaving.
  - { probe: en_keep, lang: en, input: nine times out of ten, expect: nine times out of 10 }
  # "second" is out of the ordinal table on purpose: it is a unit of time more
  # often than an ordinal, and this is the sentence that decides it.
  - { probe: en_keep, lang: en, input: a thirty second timeout, expect: a 30 second timeout }

  # =========================================================================
  # Percent
  # =========================================================================
  #
  # A number and the marker after it become one thing: `75%`, no space, in both
  # languages. French typography wants a narrow no-break space there and this
  # writes none, deliberately — the transcript is pasted into terminals and
  # code fields as often as into prose.
  #
  # Percent also lifts the below-ten floor. Everywhere else a lone number word
  # under ten stays a word; `five%` is never what anyone meant.

  - { probe: percent_en, lang: en, input: seventy-five percent, expect: 75% }
  - { probe: percent_en, lang: en, input: seventy five percent, expect: 75% }
  - { probe: percent_en, lang: en, input: a hundred percent, expect: 100% }
  - { probe: percent_en, lang: en, input: five percent, expect: 5% }
  - { probe: percent_en, lang: en, input: one percent of the time, expect: 1% of the time }
  - { probe: percent_en, lang: en, input: we shipped twenty percent faster, expect: we shipped 20% faster }
  - { probe: percent_en, lang: en, input: it grew three point five percent, expect: it grew 3.5% }
  # "per cent" as two words is the same sign.
  - { probe: percent_en, lang: en, input: two per cent of them, expect: 2% of them }

  # No number in front, nothing to sign.
  - { probe: percent_en, lang: en, input: percent of the time is what matters }
  - { probe: percent_en, lang: en, input: the percent sign is not a number }
  # Punctuation between the number and the marker means they are two things.
  - { probe: percent_en, lang: en, input: "it fell to twelve, percent of nothing", expect: "it fell to 12, percent of nothing" }
  # An ordinal is not a percentage, and "5th%" is not a thing anyone types.
  - { probe: percent_en, lang: en, input: the fifth percent of the sample }

  - { probe: percent_fr, lang: fr, input: soixante-quinze pour cent, expect: 75% }
  - { probe: percent_fr, lang: fr, input: cent pour cent, expect: 100% }
  - { probe: percent_fr, lang: fr, input: cinq pour cent des gens, expect: 5% des gens }
  - { probe: percent_fr, lang: fr, input: quatre-vingt-dix-neuf pour cent des cas, expect: 99% des cas }
  - { probe: percent_fr, lang: fr, input: trois virgule cinq pour cent, expect: "3,5%" }
  - { probe: percent_fr, lang: fr, input: zéro pour cent de chances, expect: 0% de chances }

  # The other direction. "pour cent" with no number in front is the
  # preposition and a hundred, and nothing can tell which was meant — so a
  # scale word right after "pour" is never read as a number at all. That rule
  # predates percent: it is what kept "soixante-quinze pour cent" from
  # becoming "75 pour 100".
  - { probe: percent_fr, lang: fr, input: il paie pour cent euros }
  - { probe: percent_fr, lang: fr, input: "pour cent euros, il a tout donné" }
  - { probe: percent_fr, lang: fr, input: le pour cent est un signe }

  # =========================================================================
  # No language pinned — what the app itself resolves
  # =========================================================================
  #
  # Language detection needs four words to answer and returns the first
  # configured language below that, so these would all have been handed the
  # English grammar and come back untouched. The pass tries the detected
  # language first and the rest of the list after it, which also covers the
  # recogniser's documented weak spot: a French sentence carrying English
  # technical vocabulary.

  # --- too short to detect -------------------------------------------------
  - { probe: auto_short, input: cent euros, expect: 100 euros }
  - { probe: auto_short, input: vingt et un, expect: '21' }
  - { probe: auto_short, input: quatre-vingts, expect: '80' }
  - { probe: auto_short, input: two hundred euros, expect: 200 euros }
  - { probe: auto_short, input: twenty one, expect: '21' }

  # --- code-switching ------------------------------------------------------
  - { probe: auto_switch, input: "on a mergé la pull request avec vingt et un commits", expect: "on a mergé la pull request avec 21 commits" }
  - { probe: auto_switch, input: I ate two of the twenty one fishes, expect: I ate two of the 21 fishes }

  # --- and it still leaves alone what it should ---------------------------
  - { probe: auto_keep, input: on est deux sur le projet }
  - { probe: auto_keep, input: I have one question }
  - { probe: auto_keep, input: chapitre trois du livre }

  # --- where the two vocabularies collide ---------------------------------
  # "cents" is French for hundreds and English for money, and the fallback that
  # makes short French work turned "I have 99 cents" into "I have 99 100". A
  # language the recogniser did not pick now has to recognise a unit, a teen or
  # a tens word before it is allowed to win — a lone scale word is not enough.
  - { probe: auto_collide, input: I have 99 cents }
  - { probe: auto_collide, input: it costs 50 cents each }
  # Same word, but English itself reads the number, so nothing falls through.
  - { probe: auto_collide, input: we made two hundred cents, expect: we made 200 cents }
  # And the guard must not cost the French it was built for.
  - { probe: auto_collide, input: j'ai payé deux cents euros hier, expect: j'ai payé 200 euros hier }
  - { probe: auto_collide, input: j'en ai quatre cent septante-huit, expect: j'en ai 478 }

  # --- already digits, nothing to do --------------------------------------
  - { probe: auto_keep, input: I was born in 1975 }
  - { probe: auto_keep, input: Just the two of us }
  - { probe: auto_keep, input: Seulement nous deux }
