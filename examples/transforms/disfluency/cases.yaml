# Validation set for `disfluency`. Scored with `ParrotFlow --eval disfluency`,
# which runs the deployed command, not a reimplementation of it.
#
# `change`: a word/phrase said twice by accident — collapse it.
# `keep` (no `expect`): must come back byte for byte — a collapsed repetition
# is gone for good, so this half matters as much as `change`.
#
# Most inputs are real sentences from ~/Recordings/ParrotFlow.

cases:

  # --- word ---
  - probe: word
    input: "and and uh fix conflicts."
    expect: "and uh fix conflicts."
  - probe: word
    input: "but but in the pop-up I would only see"
    expect: "but in the pop-up I would only see"
  - probe: word
    input: "the the prompt that processes the hey parrot"
    expect: "the prompt that processes the hey parrot"
  - probe: word
    input: "the core or most most significant code fragments changed."
    expect: "the core or most significant code fragments changed."
  - probe: word
    input: "Okay, so the next next thing I want to do is"
    expect: "Okay, so the next thing I want to do is"
  - probe: word
    input: "So I'd like to consolidate consolidate that on something"
    expect: "So I'd like to consolidate that on something"
  - probe: word
    input: "It was the the last session we had"
    expect: "It was the last session we had"
  - probe: word
    input: "to remove usual hesitations and feelers and mumblers mumblers."
    expect: "to remove usual hesitations and feelers and mumblers."
  - probe: word
    input: "We could even have a a path option to the prompts"
    expect: "We could even have a path option to the prompts"
  - probe: word
    input: "add some design consistency between the the menu"
    expect: "add some design consistency between the menu"
  - probe: word
    input: "the replace dialogue and the vocabulary vocabulary replacement dialogue"
    expect: "the replace dialogue and the vocabulary replacement dialogue"
  - probe: word
    input: "so that like two hundred forty-three is is always return two four three."
    parse: true
    # `like` goes too now: the marker rule reads it as a filler, which it is.
    expect: "so that two hundred forty-three is always return two four three."
  - probe: word
    input: "the substitution with the brackets and and then there would be a code step"
    expect: "the substitution with the brackets and then there would be a code step"
  - probe: word
    input: "Could we output output a score and return a list"
    expect: "Could we output a score and return a list"
  - probe: word
    input: "the heading and the 50 first characters of of the markdown content."
    expect: "the heading and the 50 first characters of the markdown content."
  - probe: word
    input: "you would replace you you would ask to replace one word"
    expect: "you would replace you would ask to replace one word"
  - probe: word
    input: "I switch from my microphone to my my airpods"
    expect: "I switch from my microphone to my airpods"
  - probe: word
    input: "looking for a solution that is easy to to use"
    expect: "looking for a solution that is easy to use"
  - probe: word
    input: "Since expanding in in the content and in the query"
    expect: "Since expanding in the content and in the query"
  - probe: word
    input: "but I would like like a quick start, fast track"
    expect: "but I would like a quick start, fast track"
  - probe: word
    input: "I will prompt so the the the result of the prompting would be"
    expect: "I will prompt so the result of the prompting would be"
  - probe: word
    input: "just do the minimal, minimal changes so that grammar is correct"
    expect: "just do the minimal changes so that grammar is correct"
  - probe: word
    input: "So So if you have two dictated segments, you would replace"
    expect: "So if you have two dictated segments, you would replace"
  - probe: word
    input: "for example if we use the The heading two has the queries"
    expect: "for example if we use The heading two has the queries"
  - probe: word
    input: "the following instruction becomes the becomes the uh instructions"
    expect: "the following instruction becomes the uh instructions"

  # --- phrase ---
  - probe: phrase
    input: "How what's the what's the logic behind correcting"
    expect: "How what's the logic behind correcting"
  - probe: phrase
    input: "that evokes the profile the profile view of a parrot"
    expect: "that evokes the profile view of a parrot"
  - probe: phrase
    input: "If we can we can still use it, maybe at"
    expect: "If we can still use it, maybe at"
  - probe: phrase
    input: "prompt tuning before fine tuning. So the so the logic would be the same."
    expect: "prompt tuning before fine tuning. So the logic would be the same."
  - probe: phrase
    input: "is low then they go in all in all the same"
    expect: "is low then they go in all the same"
  - probe: phrase
    input: "Could you try a markdown a markdown version"
    expect: "Could you try a markdown version"
  - probe: phrase
    input: "add weather in the bottom in the bundle in the bundle or as a follow-up?"
    expect: "add weather in the bottom in the bundle or as a follow-up?"
  - probe: phrase
    input: "We can um can um with ITN we can write"
    expect: "We can um with ITN we can write"
  # "I" is a pronoun and a spellable letter. The `spelled aloud` guard used to
  # scan the whole run with `any`, so one capital "I" anywhere kept the repeat
  # and no English phrase starting "I ..." was ever collapsed.
  - probe: phrase
    input: "I mean I mean what I want is this."
    parse: true
    # The surviving "I mean" is a marker, and spaCy parses it as parataxis —
    # without an explicit "that" it is not the verb of the clause after it.
    expect: "What I want is this."
  - probe: phrase
    input: "I mean I mean I want want this."
    parse: true
    expect: "I want this."
  - probe: phrase
    input: "I think I think we should try it."
    expect: "I think we should try it."

  # --- meant ---
  - probe: meant
    input: "when I said hey parrot tasmine spells blah blah blah, but it wasn't able to reconcile"
  - probe: meant
    input: "For example, converting or formatting functions dot dot dot or fixing grammar dot dot dot."
  - probe: meant
    input: "so Tasmi spells T A S M E E N Tasmin."
  - probe: meant
    input: "this mean spells T A S M E E N but in the pop-up"
  - probe: meant
    input: "and by the way, pirate James spells G G A M E Z"
  - probe: meant
    input: "Le x.y, x.y pour slack et pour le terminal."
  - probe: meant
    input: "Hey, yeah, yeah. Apparently, fifty should be in digits"
  - probe: meant
    input: "the meeting that that person asked for"
  - probe: meant
    input: "I had had enough of it by then"
  - probe: meant
    input: "it was a very very long afternoon"
  - probe: meant
    input: "vous vous êtes trompé de fichier"
  - probe: meant
    input: "nous nous sommes vus hier"
  - probe: meant
    input: "c'est très très bien fait"
  - probe: meant
    input: "I went over it again and again and again"
  - probe: meant
    input: "twenty two two"
  - probe: meant
    input: "the code is two two three"
  - probe: meant
    input: "il en reste quatre-vingt six six"

  # --- fragment: a word begun, abandoned, then said in full ---
  - probe: fragment
    input: "Yeah. I mean w we can try I'm not exactly sure how it's gonna work."
    parse: true
    expect: "Yeah. We can try I'm not exactly sure how it's gonna work."
  - probe: fragment
    input: "Of course vocabulary is important. Like t teammates names Slack mentions."
    expect: "Of course vocabulary is important. Like teammates names Slack mentions."
  - probe: fragment
    input: "c c'est exactement ça"
    expect: "c'est exactement ça"

  # --- meant: the fragment rule's own traps ---
  # "A" is a letter being discussed, not a false start — the rule only fires
  # lowercase because of this one.
  - probe: meant
    input: "Pas d'article avant, pas de A avec accent avant, pas de sur"
  # Single letters that are real words — each loses a subject/verb/article.
  - probe: meant
    input: "I imagine we can try it tomorrow"
  - probe: meant
    input: "il a acheté le fichier hier"
  - probe: meant
    input: "je crois qu'il y a un souci"
  - probe: meant
    input: "we need a answer before Friday"
  # A dictated list label, not a false start.
  - probe: meant
    input: "The options are a. apples b. bananas"
  # A spelled name. The letter sits among other single letters.
  - probe: meant
    input: "she spells it m a r c but says Marc"
  # A doubled capital letter is still a spelling. This is why the guard's
  # capital-letter test stays, scoped to a one-word run.
  - probe: meant
    input: "the source is B B C news"
  - probe: meant
    input: "it takes A A batteries"

  # --- restart: a phrase begun, abandoned, begun again ----------------------
  # The frame is the gate: `n-1` words match exactly and the last is a prefix
  # of its counterpart. No word list, because 22 of the 30 archive fires have
  # a partial that is an ordinary word.
  - probe: restart
    input: "let's say I enter the two phrases in the ter in the terminal input"
    expect: "let's say I enter the two phrases in the terminal input"
  - probe: restart
    input: "see if it mak if it makes sense to adapt the schema"
    expect: "see if it makes sense to adapt the schema"
  - probe: restart
    input: "so I think the con the conclusion is that one"
    expect: "so I think the conclusion is that one"
  - probe: restart
    input: "but it was broke it was broken before and that line has never been in the file"
    expect: "but it was broken before and that line has never been in the file"
  - probe: restart
    input: "good morning Alex what's on your pla what's on your plate today"
    expect: "good morning Alex what's on your plate today"
  - probe: restart
    input: "we currently log that for every transcript, for every transcription"
    expect: "we currently log that for every transcription"

  # --- partial: a word begun, abandoned, said in full -----------------------
  - probe: partial
    input: "what do you mean you and wh why do we need anything over SSH"
    expect: "what do you mean you and why do we need anything over SSH"
  - probe: partial
    input: "I think the conclusion wa was that it didn't really work"
    expect: "I think the conclusion was that it didn't really work"
  - probe: partial
    input: "it should support both syntax syntaxes to avoid problems"
    expect: "it should support both syntaxes to avoid problems"
  - probe: partial
    input: "Eric is rev reviewing my PR"
    expect: "Eric is reviewing my PR"
  # A function word is exempt only when the completion adds an apostrophe.
  - probe: partial
    input: "in fact we we're just using openai for that"
    expect: "in fact we're just using openai for that"
  - probe: partial
    input: "the way I understand it it's just because hormone therapies may help"
    expect: "the way I understand it's just because hormone therapies may help"

  # --- meant: what the two passes must not touch ----------------------------
  # A function word before a longer word starting the same way is two ordinary
  # words. This is 87 of the 142 bare prefix matches in the archive.
  - probe: meant
    input: "we had a one on one yesterday and two days stand up"
  - probe: meant
    input: "you remember which site we were working on when it broke"
  - probe: meant
    input: "I owe Prissy an answer on this"
  - probe: meant
    input: "an animated icon for downloading and a green check"
  - probe: meant
    input: "is it a bug or do does open ai not support it"
  # A hyphen is not a clitic: "peut" is a modal and "an" is a determiner.
  - probe: meant
    input: "ça n'est pas disponible il peut peut-être simplement envoyer un message"
  - probe: meant
    input: "it's an anti-bounds system for decreasing traffic"
  # A term of yours that no list of function words holds. See NEVER_START.
  - probe: meant
    input: "with the sequence of pr proposed and the size of each"
  # The stop is what saves this one — two sentences, not a restart.
  - probe: meant
    input: "There's only one user. Don't worry about it. It'll ask loud to fix."
  # A spelling, not a stutter.
  - probe: meant
    input: "the source is B B C news and she spells it m a r c"

  # --- marker: a discourse marker that carries nothing ----------------------
  # Needs spaCy. Not a word list: "you know" is a real verb with a real object
  # half the time, and deleting the string destroys the sentence.
  - probe: marker
    parse: true
    input: "So use like you know five maximum eight lines."
    expect: "So use five maximum eight lines."
  - probe: marker
    parse: true
    input: "And you know, the comments should be just enough."
    expect: "And the comments should be just enough."
  - probe: marker
    parse: true
    input: "Then like I'm twelve."
    expect: "Then I'm twelve."
  # Across a boundary. Every case above is one sentence, which is exactly how
  # the space and the capital went missing without anything failing.
  - probe: marker
    parse: true
    input: "It works fine. I mean the hesitations part. And then we ship."
    expect: "It works fine. The hesitations part. And then we ship."
  - probe: marker
    parse: true
    input: "You know what I mean? It's about when everything goes right. I mean you should try."
    expect: "You know what I mean? It's about when everything goes right. You should try."

  # --- meant: the marker is doing work --------------------------------------
  - probe: meant
    input: "Okay, we'll let you know."
  - probe: meant
    input: "You see what I mean?"
  - probe: meant
    input: "Do you know who owns this account?"
  - probe: meant
    input: "And therefore you know what you are allowed to modify without risk."
  - probe: meant
    input: "Unless you know it's gonna fail in that case, mention it's failing."
  - probe: meant
    input: "like a cat on a mat"
  # A hedge, not a filler: "I think THAT we should" — deleting it turns an
  # opinion into an assertion. Only `--hedges` touches these.
  - probe: meant
    input: "I think we should do this before Friday."
  # A self-correction, not a filler. Cutting the cue alone keeps both names.
  - probe: meant
    input: "So the other day I was with James I mean Peter, sorry."
